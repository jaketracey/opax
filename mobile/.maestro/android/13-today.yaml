appId: au.com.opax.app
name: 13 Today front page, its native records and dated original sources
---
# scrollUntilVisible always swipes from the centre of the screen. Tap
# targets are centred with speed-20 swipes (about half a screen each). From
# iOS 26 the tab bar floats over the bottom of the page, and a link drawn
# under it still counts as visible: on iOS 27 a source tap hit the Your MP
# tab. Each group of steps first checks the page is still shown.
- launchApp:
    permissions: {}
- assertVisible:
    id: today-screen-message
# Android has no launch arguments, so the fixture's edition (4 October 2026)
# keeps its own date and is old on Today: old editions never draw there
# (today.md 5.2). No seat is saved, so the invitation to choose one leads.
- extendedWaitUntil:
    visible:
      id: today-invitation
    timeout: 30000
- assertNotVisible:
    id: today-edition
- takeScreenshot: ${EVIDENCE}/13-invitation
- scrollUntilVisible:
    element:
      id: today-bill-0
    direction: DOWN
    timeout: 300000
    visibilityPercentage: 1
    centerElement: true
- takeScreenshot: ${EVIDENCE}/13-bills
- scrollUntilVisible:
    element:
      id: today-bill-0
    timeout: 300000
    visibilityPercentage: 1
    centerElement: true
    speed: 40
    direction: UP
- waitForAnimationToEnd
- tapOn:
    id: today-bill-0
- scrollUntilVisible:
    element:
      id: bill-title
    direction: DOWN
    timeout: 300000
    visibilityPercentage: 1
- takeScreenshot: ${EVIDENCE}/13-open-bill
# On iOS 27 an uncentred source link can sit under the tab bar.
- assertVisible:
    id: bill-screen
- scrollUntilVisible:
    element:
      id: bill-source
    direction: DOWN
    timeout: 300000
    centerElement: true
    speed: 40
- waitForAnimationToEnd
- assertVisible:
    id: bill-screen
- tapOn:
    id: bill-source
# The bill's one source line opens its originals; in e2e builds an
# original opens the local preview of its address ("Original", Done).
- extendedWaitUntil:
    visible:
      id: bill-source-sheet-original-0
    timeout: 15000
- tapOn:
    id: bill-source-sheet-original-0
- extendedWaitUntil:
    visible:
      id: source-destination-url
      text: https://parlinfo\.aph\.gov\.au/.*
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/13-bill-source-original
- tapOn: Done
- pressKey: Back
- assertVisible:
    id: today-screen
- scrollUntilVisible:
    element:
      id: today-declaration-0
    direction: DOWN
    timeout: 300000
    centerElement: true
    speed: 40
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/13-declaration
- assertVisible:
    id: today-screen
# The register page is "Open the register" on touch and hold.
- longPressOn:
    id: today-declaration-0
- tapOn: Open the register
- extendedWaitUntil:
    visible:
      id: source-destination-url
      text: https://www\.aph\.gov\.au/.*
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/13-declaration-source-original
# The local destination view scrolls a long URL at AX5. Capture its end too.
- repeat:
    times: 4
    commands:
      - swipe:
          from:
            id: source-destination-scroll
          direction: UP
- takeScreenshot: ${EVIDENCE}/13-declaration-source-original-end
- tapOn: Done
- assertVisible:
    id: today-screen
# Every records block ends in its own dated line: Just declared's opens the
# sheet of its original page and notes.
- scrollUntilVisible:
    element:
      id: today-declarations-sources
    direction: DOWN
    timeout: 300000
    centerElement: true
    speed: 40
- waitForAnimationToEnd
- assertVisible:
    id: today-declarations-sources
    text: Updated \d{1,2} \w{3} \d{4}.*
- takeScreenshot: ${EVIDENCE}/13-sources
- tapOn:
    id: today-declarations-sources
- extendedWaitUntil:
    visible: Sources
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/13-sources-sheet
- tapOn: Done
- assertVisible:
    id: today-screen
# The foot: the independence line and Report a correction (design review D4).
- scrollUntilVisible:
    element:
      id: today-screen-footer
    direction: DOWN
    timeout: 300000
    visibilityPercentage: 1
- scrollUntilVisible:
    element:
      id: today-independence
      text: OPAX is independent and non-partisan\..*
    direction: DOWN
    timeout: 300000
    visibilityPercentage: 10
    centerElement: true
- takeScreenshot: ${EVIDENCE}/13-foot
