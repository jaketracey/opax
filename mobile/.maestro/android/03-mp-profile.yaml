appId: au.com.opax.app
name: 03 Read a sourced profile
---
# Android must mount its URL listener before receiving the profile VIEW intent.
- launchApp:
    permissions: {}
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 30000
- openLink: opax://person/anthony-albanese
- extendedWaitUntil:
    visible:
      id: person-screen-title
    timeout: 30000
- scrollUntilVisible:
    element:
      id: person-screen-title
    direction: UP
- takeScreenshot: ${EVIDENCE}/03-person-name
- scrollUntilVisible:
    element:
      id: person-party
- assertVisible:
    id: person-party
- scrollUntilVisible:
    element:
      id: person-electorate
    centerElement: true
- assertVisible: Grayndler
# Chamber names, never raw IDs ("federal", "representatives").
- assertVisible: House of Representatives
- assertNotVisible: .*· federal.*
- takeScreenshot: ${EVIDENCE}/03-profile
- scrollUntilVisible:
    element:
      id: person-source
    centerElement: true
- assertVisible:
    id: person-source
- takeScreenshot: ${EVIDENCE}/03-source
# The profile's original records open from one small "View original": with
# several, a native menu names each. Sources open in the in-app browser; e2e
# shows the destination locally.
- tapOn:
    id: person-source
- tapOn: OpenAustralia parliamentary service records
- extendedWaitUntil:
    visible:
      id: source-destination-url
      text: https://raw\.githubusercontent\.com/openaustralia/openaustralia-parser/master/data/representatives\.csv
    timeout: 15000
- assertVisible: https://raw.githubusercontent.com/openaustralia/openaustralia-parser/master/data/representatives.csv
- takeScreenshot: ${EVIDENCE}/03-source-destination
# At AX5 the URL runs past the screen. Scroll the page to its end in a bounded
# number of swipes (past the end they only bounce) and keep the tail, drawn in
# full: "representatives.csv", never "representative...".
- repeat:
    times: 4
    commands:
      - swipe:
          from:
            id: source-destination-scroll
          direction: UP
- assertVisible:
    id: source-destination-url
- takeScreenshot: ${EVIDENCE}/03-source-destination-end
- tapOn: OK
# Share uses the canonical web path; e2e carries a non-resolving origin.
- tapOn: Share Anthony Albanese
- assertVisible: https://opax.invalid/subject/person/anthony-albanese
- takeScreenshot: ${EVIDENCE}/03-share
- tapOn: OK
