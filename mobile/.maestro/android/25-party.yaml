appId: au.com.opax.app
name: 25 Native party members, pinned receipts, bill divisions and an unknown party
---
- runFlow:
    file: ../08-open-profile.yaml
    env:
      NAME: Anthony Albanese
      SLUG: anthony-albanese
- scrollUntilVisible:
    element:
      id: person-party
    direction: UP
    centerElement: true
    speed: 20
    timeout: 180000
- tapOn:
    id: person-party
- extendedWaitUntil:
    visible:
      id: party-title
    timeout: 30000
- assertVisible: Labor
- takeScreenshot: ${EVIDENCE}/25-party-title
- scrollUntilVisible:
    element:
      id: party-current-count
    direction: DOWN
    speed: 20
    timeout: 180000
# One row of faces and the count; it opens Parliamentarians filtered to the
# party's sitting members.
- assertVisible: .* sitting (Labor )?members
- takeScreenshot: ${EVIDENCE}/25-members-row
- tapOn:
    id: party-members-all
- extendedWaitUntil:
    visible:
      id: directory-person-screen
    timeout: 30000
- assertVisible:
    id: directory-person-.*
- takeScreenshot: ${EVIDENCE}/25-party-directory
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: party-title
    timeout: 15000
- runScript: ../support/party-figures.js
- scrollUntilVisible:
    element:
      id: party-receipts-total
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- assertVisible: ${output.partyReceiptsLabel}
- takeScreenshot: ${EVIDENCE}/25-pinned-receipts
- scrollUntilVisible:
    element:
      id: party-donor-years-toggle
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 180000
- tapOn:
    id: party-donor-years-toggle
- extendedWaitUntil:
    visible:
      id: party-sources-screen
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/25-donors-by-year
- pressKey: Back
- scrollUntilVisible:
    element:
      id: party-money-caveat
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/25-money-caveat
# Money map pushes the party's money record (node party:Labor).
- scrollUntilVisible:
    element:
      id: party-money-map
    direction: DOWN
    centerElement: true
    timeout: 120000
- takeScreenshot: ${EVIDENCE}/25-party-entry
- tapOn:
    id: party-money-map
- extendedWaitUntil:
    visible:
      id: money-focus-name
      text: Labor
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/25-native-money-focus
- pressKey: Back
- scrollUntilVisible:
    element:
      id: party-bill-au-federal-r7501
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/25-party-votes
- tapOn:
    id: party-bill-au-federal-r7501
- extendedWaitUntil:
    visible:
      id: bill-divisions
    timeout: 30000
- assertVisible:
    id: bill-divisions-title
- takeScreenshot: ${EVIDENCE}/25-native-divisions
- scrollUntilVisible:
    element:
      id: bill-division-0-outcome
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/25-native-division-counts
- pressKey: Back
- scrollUntilVisible:
    element:
      id: party-end
    direction: DOWN
    speed: 20
    timeout: 600000
- takeScreenshot: ${EVIDENCE}/25-party-end
# Review every viewport at either text size.
- scrollUntilVisible:
    element:
      id: party-title
    direction: UP
    visibilityPercentage: 10
    speed: 20
    timeout: 600000
- runFlow:
    file: ../review-pages.yaml
    env:
      END: party-end
      PREFIX: 25-review
      REVIEW_PAGES: 200
# This is a synthetic unresolved route, not a claim about a real party. A
# resolved absence is a whole-screen state; the page never leaves the app.
- openLink: opax://party/opax-fixture-unresolved
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible:
      id: party-not-found
    timeout: 30000
- assertVisible: This party isn’t in OPAX’s records yet
- takeScreenshot: ${EVIDENCE}/25-not-found
