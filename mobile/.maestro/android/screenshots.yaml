appId: au.com.opax.app
name: Android tab and key-screen captures at the requested font scale
---
- launchApp:
    permissions: {}
- tapOn:
    id: tab-today
- scrollUntilVisible:
    element:
      id: today-screen-message
    direction: UP
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: today-edition-head
    timeout: 180000
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: tab-your-mp
- extendedWaitUntil:
    visible:
      id: your-seat-name
    timeout: 30000
- scrollUntilVisible:
    element:
      id: change-seat
    centerElement: true
    speed: 70
    timeout: 600000
- tapOn:
    id: change-seat
- scrollUntilVisible:
    element:
      id: seat-search
    direction: UP
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/seat-chooser
- pressKey: Back
- scrollUntilVisible:
    element:
      id: your-seat-name
    direction: UP
    speed: 70
    timeout: 180000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/tab-your-mp
- tapOn:
    id: tab-bills
- extendedWaitUntil:
    visible:
      id: bills-count
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/tab-bills
- tapOn:
    id: tab-search
- extendedWaitUntil:
    visible:
      id: search-screen
    timeout: 180000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/tab-search
# Pass 3D's results (one count line, rows titled by the record) and the kind
# list, which Android raises as a bottom sheet (pass 4F).
- longPressOn:
    id: search-input
- inputText: Don Farrell
- hideKeyboard
- scrollUntilVisible:
    element:
      id: search-kind-menu
    direction: UP
    visibilityPercentage: 10
    speed: 40
    timeout: 90000
- tapOn:
    id: search-kind-menu
- extendedWaitUntil:
    visible:
      id: search-kind-option-records
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/search-kind-sheet
- tapOn:
    id: search-kind-option-records
- extendedWaitUntil:
    notVisible:
      id: search-kind-sheet
    timeout: 30000
- scrollUntilVisible:
    element:
      id: search-submit
    visibilityPercentage: 10
    speed: 40
    timeout: 90000
- tapOn:
    id: search-submit
- scrollUntilVisible:
    element:
      id: records-count
    visibilityPercentage: 10
    speed: 40
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/search-passages
- tapOn:
    id: tab-ask
- extendedWaitUntil:
    visible:
      id: ask-screen
    timeout: 180000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/tab-ask
- tapOn:
    id: ask-options
- assertVisible:
    id: ask-options-screen
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/ask-options
- pressKey: Back
- extendedWaitUntil:
    visible:
      id: ask-screen
    timeout: 180000
# Defer this capture until startup data and native glyphs have settled.
- tapOn:
    id: tab-today
- scrollUntilVisible:
    element:
      id: today-screen-message
    direction: UP
    timeout: 180000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/tab-today
- scrollUntilVisible:
    element:
      id: today-explore
    visibilityPercentage: 10
    speed: 40
    timeout: 180000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/today-explore
- scrollUntilVisible:
    element:
      id: today-sources
    centerElement: true
    speed: 40
    timeout: 180000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/today-foot
- tapOn:
    id: today-sources
- extendedWaitUntil:
    visible:
      id: today-sources-sheet-done
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/today-sources-sheet
- pressKey: Back
- extendedWaitUntil:
    notVisible:
      id: today-sources-sheet-done
    timeout: 30000
- openLink: opax://person/anthony-albanese
- extendedWaitUntil:
    visible:
      id: person-screen-title
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/profile
- openLink: opax://party/labor
- extendedWaitUntil:
    visible:
      id: party-title
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/party
- openLink: opax://bill/au-federal-r7534
- extendedWaitUntil:
    visible:
      id: bill-title
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/bill
- scrollUntilVisible:
    element:
      id: bill-more
    centerElement: true
    speed: 40
    timeout: 90000
- tapOn:
    id: bill-more
- extendedWaitUntil:
    visible:
      id: android-menu
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/bill-more-menu
- pressKey: Back
- extendedWaitUntil:
    notVisible:
      id: android-menu
    timeout: 30000
- scrollUntilVisible:
    element:
      id: bill-source
    centerElement: true
    speed: 40
    timeout: 90000
- tapOn:
    id: bill-source
- extendedWaitUntil:
    visible:
      id: bill-source-sheet-done
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/bill-source-sheet
- pressKey: Back
- extendedWaitUntil:
    notVisible:
      id: bill-source-sheet-done
    timeout: 30000
- scrollUntilVisible:
    element:
      id: bill-division-0-outcome
    centerElement: true
    speed: 40
    timeout: 180000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/bill-divisions
- openLink: opax://doc/speech-1205524
- extendedWaitUntil:
    visible:
      id: doc-title
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/record-reader
- openLink: opax://doc-cite/speech-1205524
- extendedWaitUntil:
    visible:
      id: doc-citations
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/citation
- tapOn:
    id: tab-your-mp
- scrollUntilVisible:
    element:
      id: your-electorate
    direction: UP
    speed: 70
    timeout: 180000
- tapOn:
    id: your-electorate
- extendedWaitUntil:
    visible:
      id: electorate-name
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/electorate
- openLink: opax://money
- extendedWaitUntil:
    visible:
      id: money-screen
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: money-map-drawn-frames-.*
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/money-map
- scrollUntilVisible:
    element:
      id: money-as-at
    centerElement: true
    timeout: 30000
- tapOn:
    id: money-as-at
- assertVisible:
    id: money-as-at-sheet
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/money-notes
- pressKey: Back
- assertNotVisible:
    id: money-as-at-sheet
- openLink: opax://reports
- extendedWaitUntil:
    visible:
      id: reports-screen
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/reports-list
- scrollUntilVisible:
    element:
      id: report-open-gambling
    centerElement: true
    speed: 40
    timeout: 180000
- tapOn:
    id: report-open-gambling
- extendedWaitUntil:
    visible:
      id: report-title
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/report
- openLink: opax://account
- extendedWaitUntil:
    visible:
      id: account-about
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/about-sheet
- tapOn:
    id: account-about
- assertVisible:
    id: about-screen
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/about
- pressKey: Back
- scrollUntilVisible:
    element:
      id: account-sources
    direction: DOWN
    speed: 70
    timeout: 180000
- tapOn:
    id: account-sources
- assertVisible:
    id: sources-screen
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/sources-and-licences
