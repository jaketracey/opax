appId: au.com.opax.app
name: Android tab and key-screen captures at the requested font scale
---
- launchApp:
    clearState: true
    permissions: {}
- assertVisible:
    id: today-screen-message
- takeScreenshot: ${EVIDENCE}/tab-today
- openLink: opax://seat
- assertVisible:
    id: seat-sheet
- takeScreenshot: ${EVIDENCE}/seat-chooser
- tapOn: Electorate or member.s name
- inputText: Grayndler
- tapOn:
    id: seat-row-federal-representatives-nsw-grayndler
- openLink: opax://your-mp
- assertVisible:
    id: your-seat-name
- takeScreenshot: ${EVIDENCE}/tab-your-mp
- tapOn:
    id: tab-bills
- assertVisible:
    id: bills-count
- takeScreenshot: ${EVIDENCE}/tab-bills
- tapOn:
    id: tab-search
- assertVisible:
    id: search-screen
- takeScreenshot: ${EVIDENCE}/tab-search
- tapOn:
    id: search-input
- inputText: Don Farrell
- pressKey: Enter
- runFlow:
    file: ../support/search-scope.yaml
    env:
      SCOPE: Speeches
- scrollUntilVisible:
    element:
      id: records-result-0
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/search-passages
- tapOn:
    id: tab-ask
- assertVisible:
    id: ask-screen
- takeScreenshot: ${EVIDENCE}/tab-ask
- tapOn:
    id: ask-composer-options
- assertVisible:
    id: filters-screen
- takeScreenshot: ${EVIDENCE}/ask-options
- pressKey: Back
- tapOn:
    id: tab-today
- scrollUntilVisible:
    element:
      id: today-explore-open
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/today-explore
- scrollUntilVisible:
    element:
      id: today-declarations-sources
    direction: UP
    timeout: 180000
- tapOn:
    id: today-declarations-sources
- assertVisible: Sources
- takeScreenshot: ${EVIDENCE}/today-sources-sheet
- tapOn: Done
- openLink: opax://person/anthony-albanese
- extendedWaitUntil:
    visible:
      id: person-screen-title
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/profile
- openLink: opax://party/labor
- extendedWaitUntil:
    visible:
      id: party-title
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/party
- openLink: opax://bill/au-federal-r7534
- extendedWaitUntil:
    visible:
      id: bill-title
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/bill
- openLink: opax://doc/speech-1205524
- extendedWaitUntil:
    visible:
      id: doc-title
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/reader
- openLink: opax://electorate/federal-representatives-nsw-grayndler
- extendedWaitUntil:
    visible:
      id: electorate-name
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/electorate
- openLink: opax://money
- extendedWaitUntil:
    visible:
      id: money-view-summary
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/money-map
- openLink: opax://leads
- extendedWaitUntil:
    visible:
      id: leads-lede
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/leads
- openLink: opax://account/about
- extendedWaitUntil:
    visible:
      id: about-screen
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/about
- openLink: opax://account/sources
- extendedWaitUntil:
    visible:
      id: sources-screen
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/sources-and-licences
