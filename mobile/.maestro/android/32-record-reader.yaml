appId: au.com.opax.app
name: 32 Bill to native speech, cite BibTeX, similar on tap and roster profile
---
- launchApp:
    permissions: {}
- openLink: opax://bill/au-federal-r7534
- extendedWaitUntil:
    visible:
      id: bill-screen
    timeout: 20000
- scrollUntilVisible:
    element:
      id: bill-speech-0
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 70
    timeout: 180000
- waitForAnimationToEnd
- tapOn:
    id: bill-speech-0
- extendedWaitUntil:
    visible:
      id: doc-title
    timeout: 20000
- assertVisible:
    id: reader-text-0
- takeScreenshot: ${EVIDENCE}/32-reader-header
# The header's More holds the copy actions, Citation formats, Copy link,
# Open on opax.com.au, Ask about this and Share (records.md 2.3).
- assertNotVisible:
    text: Cite
- tapOn:
    id: header-more
- waitForAnimationToEnd
- tapOn: Citation formats…
- extendedWaitUntil:
    visible:
      id: doc-citations
    timeout: 20000
- tapOn: BibTeX
- waitForAnimationToEnd
- tapOn:
    id: cite-copy-bibtex
- assertVisible: Copied BibTeX
- takeScreenshot: ${EVIDENCE}/32-cite-bibtex
# Android Back returns to the existing reader with its position preserved.
- back
- extendedWaitUntil:
    visible:
      id: doc-reader
    timeout: 20000
- scrollUntilVisible:
    element:
      id: doc-title
    direction: UP
    visibilityPercentage: 10
    speed: 70
    timeout: 180000
- waitForAnimationToEnd:
    timeout: 5000
# In short is closed until opened.
- scrollUntilVisible:
    element:
      id: doc-brief
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- tapOn:
    id: doc-brief
- scrollUntilVisible:
    element:
      id: doc-brief-label
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/32-machine-summary
- scrollUntilVisible:
    element:
      id: doc-bill-open
    direction: DOWN
    centerElement: true
    speed: 70
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/32-linked-bill
- scrollUntilVisible:
    element:
      id: doc-similar
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 180000
- waitForAnimationToEnd
- tapOn:
    id: doc-similar
- scrollUntilVisible:
    element:
      id: doc-similar-0
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/32-similar
- scrollUntilVisible:
    element:
      id: reader-text-0
    direction: UP
    visibilityPercentage: 10
    speed: 70
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/32-full-text
- waitForAnimationToEnd
- runFlow:
    file: ../support/open-more.yaml
    env:
      NAME: '.*'
- extendedWaitUntil:
    visible:
      id: person-screen-title
    timeout: 20000
- takeScreenshot: ${EVIDENCE}/32-linked-person
# End on the copied citation so the locked native clipboard audit reads it
# immediately, before unrelated host clipboard changes can replace it.
- launchApp:
    stopApp: true
    permissions: {}
- openLink: opax://doc-cite/speech-1205524
- extendedWaitUntil:
    visible:
      id: doc-citations
    timeout: 20000
- tapOn: BibTeX
- waitForAnimationToEnd
- tapOn:
    id: cite-copy-bibtex
- assertVisible: Copied BibTeX
- back
- extendedWaitUntil:
    visible:
      id: doc-title
    timeout: 20000
- takeScreenshot: ${EVIDENCE}/32-citation-route-done
# Paste through the Android foreground field and retain the exact native
# payload for check-record-copy.ts, including its device-local access date.
- runFlow: clipboard.yaml
- copyTextFrom:
    id: ask-question
- evalScript: ${console.log('OPAX_NATIVE_CITATION=' + JSON.stringify(maestro.copiedText))}
