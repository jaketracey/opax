appId: au.com.opax.app
name: 24 Permission denied keeps the chooser available
---
- launchApp:
    clearState: true
    permissions:
      location: unset
- openLink: opax://seat
- extendedWaitUntil:
    visible:
      id: seat-sheet
    timeout: 30000
- scrollUntilVisible:
    element:
      id: use-my-location
    centerElement: true
    timeout: 60000
- tapOn:
    id: use-my-location
- extendedWaitUntil:
    visible: Allow Once
    timeout: 15000
- scrollUntilVisible:
    element: Don’t Allow
    # iOS 26's AX5 permission button extends below its alert viewport. Its
    # visible upper part is tappable; centering this system button cannot work.
    visibilityPercentage: 50
    centerElement: false
    timeout: 300000
- tapOn:
    text: Don’t Allow
    point: '50%,10%'
- scrollUntilVisible:
    element:
      id: location-denied
    centerElement: true
    timeout: 300000
- assertVisible: Location access is off for OPAX.
# The row stays, with the way to turn location on.
- assertVisible:
    id: use-my-location
- assertVisible:
    id: seat-location-settings
- takeScreenshot: ${EVIDENCE}/24-permission-denied
- runFlow:
    file: support/location-manual-seat.yaml
- takeScreenshot: ${EVIDENCE}/24-denied-manual
