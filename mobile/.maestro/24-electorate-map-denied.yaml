appId: au.com.opax.app
name: 24 Permission denied keeps the chooser available
---
- launchApp:
    clearState: true
    permissions:
      location: unset
- tapOn:
    id: tab-your-mp
- scrollUntilVisible:
    element:
      id: use-my-location
    direction: UP
    centerElement: true
    timeout: 300000
- tapOn:
    id: use-my-location
- extendedWaitUntil:
    visible: Allow Once
    timeout: 15000
- scrollUntilVisible:
    element: Don’t Allow
    # iOS 26's AX5 permission button extends below its alert viewport. Its
    # visible upper part is tappable; centering this system button cannot work.
    visibilityPercentage: 50
    centerElement: false
    timeout: 300000
- tapOn:
    text: Don’t Allow
    point: "50%,10%"
- scrollUntilVisible:
    element:
      id: location-denied
    centerElement: true
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/24-permission-denied
- runFlow:
    file: support/location-manual-seat.yaml
- takeScreenshot: ${EVIDENCE}/24-denied-manual
