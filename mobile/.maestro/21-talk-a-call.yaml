appId: au.com.opax.app
name: 21a Talk signed out, consent, a live call, captions, report, and a call on stored consent
# Journey 21 runs as four flows (21-talk-a to -d), each under half the 900 s
# per-flow limit; the single flow ran at 887-900+ s. Each sets up its own
# account. "scripts/e2e.sh <udid> 21" runs all four in order.
#
# The live-call controls sit in a dock that cannot scroll to the centre, so
# their scrolls do not centre: centring swiped five times at about 8 s each
# (the orb never lets the screen settle) and cost about 38 s per control.
---
- launchApp:
    clearState: true
    permissions: {}
# clearState keeps the Keychain and the fixture keeps sessions for the whole
# run, so an earlier Talk flow can leave a voice session. Sign out in the
# e2e-only bridge workbench first, so Talk opens signed out in any order.
- openLink: opax://voice-bridge-test
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible:
      id: voice-bridge-test-title
    timeout: 15000
- scrollUntilVisible:
    timeout: 60000
    element:
      id: voice-logout
    centerElement: true
- tapOn:
    id: voice-logout
- scrollUntilVisible:
    timeout: 60000
    element:
      id: voice-auth
    direction: UP
- extendedWaitUntil:
    visible:
      id: voice-auth
      text: Signed out
    timeout: 15000
- openLink: opax://talk
- tapOn:
    text: Open
    optional: true
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-sign-in
    centerElement: true
- extendedWaitUntil:
    visible:
      id: talk-sign-in
    timeout: 15000
- assertVisible: Voice needs a free OPAX account.
- assertVisible: Accounts and voice are for people aged 16 and over.
- takeScreenshot: ${EVIDENCE}/21-signed-out
- tapOn:
    id: talk-sign-in
- assertVisible:
    id: account-sheet-message
- runFlow:
    file: support/talk-fixture-account.yaml
    env:
      TALK_EMAIL: happy@example.invalid
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-start
    centerElement: true
- assertVisible:
    id: talk-allowance
- takeScreenshot: ${EVIDENCE}/21-ready
- tapOn:
    id: talk-start
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-agree
    centerElement: true
# At AX5 UIKit can report the button visible while its centre is beneath the
# sheet header. Reveal it physically before the one consent tap.
- runFlow:
    when:
      true: ${CONTENT_SIZE === 'accessibility-extra-extra-extra-large'}
    commands:
      - swipe:
          start: 90%, 30%
          end: 90%, 55%
          duration: 600
- takeScreenshot: ${EVIDENCE}/21-consent
- tapOn:
    id: talk-agree
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-status
    direction: UP
- extendedWaitUntil:
    visible: Listening|OPAX is speaking
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/21-live
# Captions are off by default; the transcript is kept for the CC switch.
- assertNotVisible:
    id: talk-turn-agent
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-captions
- tapOn:
    id: talk-captions
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-turn-user
    visibilityPercentage: 10
- assertVisible: .*Synthetic fixture question.*
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-turn-agent
    visibilityPercentage: 10
- assertVisible: .*Synthetic corrected greeting.*
- takeScreenshot: ${EVIDENCE}/21-correction
# Report, withdrawal and time left live in the navigation bar's More menu.
- tapOn: More options
- extendedWaitUntil:
    visible: Report this answer
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/21-report-control
# Two linked records: the menu offers them as a submenu of titles.
- tapOn: Report this answer
- extendedWaitUntil:
    visible: Public receipt records
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/21-report-record-choice
- tapOn: Public receipt records
- extendedWaitUntil:
    visible:
      id: source-destination-url
    timeout: 15000
- assertVisible:
    id: source-destination-url
    text: '^https://opax\.invalid/support\?record=/money/receipts$'
- takeScreenshot: ${EVIDENCE}/21-report-support-path
- tapOn: OK
# The e2e browser preview is a separate native-stack route. Leaving Talk ends
# its call and discards evidence, so explicitly start a fresh fixture call.
# Stored consent must let this call start without another consent prompt.
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-start
    direction: DOWN
    centerElement: true
- tapOn:
    id: talk-start
- extendedWaitUntil:
    visible: Listening|OPAX is speaking
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/21-stored-consent-live
# End the call here. Left open, it would end with the app at the next flow's
# launch, and the fixture then charges its whole reservation, leaving the
# shared happy account no minutes for 21b.
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-end
- tapOn:
    id: talk-end
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-status
    direction: UP
- extendedWaitUntil:
    visible: Call ended. Microphone off.
    timeout: 15000
