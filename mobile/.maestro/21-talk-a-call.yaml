appId: au.com.opax.app
name: 21a Talk signed out, consent, a live call, captions, report, and a call on stored consent
# Journey 21 runs as four flows (21-talk-a to -d), each under half the 900 s
# per-flow limit; the single flow ran at 887-900+ s. Each sets up its own
# account. "scripts/e2e.sh <udid> 21" runs all four in order.
#
# The live-call controls sit in a dock that cannot scroll to the centre, so
# their scrolls do not centre: centring swiped five times at about 8 s each
# (the orb never lets the screen settle) and cost about 38 s per control.
---
- launchApp:
    clearState: true
    permissions: {}
# clearState keeps the Keychain and the fixture keeps sessions for the whole
# run, so an earlier Talk flow can leave a voice session. Sign out in the
# e2e-only bridge workbench first, so Talk opens signed out in any order.
- openLink: opax://voice-bridge-test
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible:
      id: voice-bridge-test-title
    timeout: 15000
- scrollUntilVisible:
    timeout: 60000
    element:
      id: voice-logout
    centerElement: true
- tapOn:
    id: voice-logout
- scrollUntilVisible:
    timeout: 60000
    element:
      id: voice-auth
    direction: UP
- extendedWaitUntil:
    visible:
      id: voice-auth
      text: Signed out
    timeout: 15000
- openLink: opax://talk
- tapOn:
    text: Open
    optional: true
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-sign-in
    centerElement: true
- extendedWaitUntil:
    visible:
      id: talk-sign-in
    timeout: 15000
- assertVisible:
    id: talk-intro
- assertVisible: 'A free OPAX account includes \d+ minutes of voice\.|Talk needs a free OPAX account\.'
# The age line is on the email step only (specs/account.md 5.6).
- assertNotVisible: '.*16 and over.*'
- takeScreenshot: ${EVIDENCE}/21-signed-out
# Sign in pushes the email step inside the Talk sheet.
- tapOn:
    id: talk-sign-in
- extendedWaitUntil:
    visible:
      id: account-email
    timeout: 15000
- assertVisible:
    id: account-age-limit
- takeScreenshot: ${EVIDENCE}/21-sign-in-in-talk
- runFlow:
    file: support/talk-fixture-account.yaml
    env:
      TALK_EMAIL: happy@example.invalid
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-start
    centerElement: true
- assertVisible:
    id: talk-allowance
- takeScreenshot: ${EVIDENCE}/21-ready
- tapOn:
    id: talk-start
# Consent is its own sheet on Ask's shape: the "Machine-written" pill and
# the words are on screen on arrival (sweep 2, item 1: at Large the old
# pinned footer drew them under the buttons), and the buttons end the
# scroll range.
- extendedWaitUntil:
    visible:
      id: talk-consent-sheet
    timeout: 15000
- assertVisible:
    id: talk-consent-machine
- takeScreenshot: ${EVIDENCE}/21-consent
- runFlow:
    file: support/talk-consent.yaml
    env:
      CONSENT_BUTTON: talk-agree
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-status
    direction: UP
- extendedWaitUntil:
    visible: Listening|OPAX is speaking
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/21-live
# Captions are on by default: the transcript shows without a toggle.
- assertVisible:
    id: talk-captions-list
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-turn-user
    visibilityPercentage: 10
- assertVisible: .*Synthetic fixture question.*
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-turn-agent
    visibilityPercentage: 10
- assertVisible: .*Synthetic corrected greeting.*
- takeScreenshot: ${EVIDENCE}/21-correction
# Report, withdrawal and time left live in the navigation bar's More menu.
- tapOn: More options
- extendedWaitUntil:
    visible: Report this answer
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/21-report-control
# Two linked records: the menu offers them as a submenu of titles.
- tapOn: Report this answer
- extendedWaitUntil:
    visible: Public receipt records
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/21-report-record-choice
- tapOn: Public receipt records
- extendedWaitUntil:
    visible:
      id: source-destination-url
    timeout: 15000
- assertVisible:
    id: source-destination-url
    text: '^https://opax\.invalid/support\?record=/money/receipts$'
- takeScreenshot: ${EVIDENCE}/21-report-support-path
- tapOn: Done
# The e2e browser preview is a separate native-stack route. The call belongs
# to Talk's mount, so it may still be open underneath: end it, then start a
# fresh fixture call. Stored consent must let it start without another
# consent prompt.
- runFlow:
    when:
      visible:
        id: talk-end
    commands:
      - tapOn:
          id: talk-end
      - extendedWaitUntil:
          visible:
            id: talk-start
          timeout: 15000
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-start
    direction: DOWN
    centerElement: true
- tapOn:
    id: talk-start
- extendedWaitUntil:
    visible: Listening|OPAX is speaking
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/21-stored-consent-live
# End the call here. Left open, it would end with the app at the next flow's
# launch, and the fixture then charges its whole reservation, leaving the
# shared happy account no minutes for 21b.
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-end
- tapOn:
    id: talk-end
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-status
    direction: UP
- extendedWaitUntil:
    visible: Call ended\.
    timeout: 15000
- assertVisible: Start again
