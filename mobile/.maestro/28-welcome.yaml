appId: au.com.opax.app
name: 28 Welcome on first launch, Continue to the seat step, a postcode answered plainly, choose a seat, no repeat, replay from Account
---
# E2E builds treat the welcome as seen, so other journeys are never blocked.
# The launch argument -OPAXWelcomeTour on asks for the production behaviour.
# Quote "on": unquoted it is a YAML boolean. Bar buttons ("Not now", "Done")
# have no test ids: they are reached by their labels.
- launchApp:
    clearState: true
    permissions:
      location: unset
    arguments:
      OPAXWelcomeTour: 'on'
- extendedWaitUntil:
    visible:
      id: welcome-screen
    timeout: 60000
- extendedWaitUntil:
    notVisible:
      id: welcome-launch-cover
    timeout: 10000
# Full screen: nothing of the app shows behind it.
- assertNotVisible:
    id: tab-today
- assertVisible:
    id: welcome-title
    text: Welcome to OPAX
- assertVisible:
    id: welcome-row-your-mp
- assertVisible:
    id: welcome-row-sourced
- assertVisible:
    id: welcome-row-ask
- scrollUntilVisible:
    element:
      id: welcome-notice
    visibilityPercentage: 50
    timeout: 30000
- assertVisible:
    id: welcome-continue
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/28-welcome
# No location request until "Use my location" is tapped.
- assertNotVisible: Allow Once
- tapOn:
    id: welcome-know
- extendedWaitUntil:
    visible:
      id: welcome-seat
    timeout: 10000
- assertVisible: Your electorate
- assertVisible: Not now
- assertVisible:
    id: welcome-seat-why
- assertVisible:
    id: use-my-location
- assertVisible:
    id: seat-browse-nsw
- assertNotVisible: Allow Once
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/28-seat-step
# A postcode is answered plainly, with the ways on straight after it; the
# location row is offered, never started, so nothing is asked.
- tapOn: Electorate or member.s name
- inputText: '2042'
- extendedWaitUntil:
    visible:
      id: seat-no-results
    timeout: 30000
- assertVisible: OPAX can.t look up postcodes yet.
- assertVisible:
    id: use-my-location
- assertNotVisible: Allow Once
- takeScreenshot: ${EVIDENCE}/28-seat-step-postcode
- eraseText: 4
- inputText: Grayndler
- extendedWaitUntil:
    visible:
      id: seat-row-federal-representatives-nsw-grayndler
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/28-seat-step-typed
- tapOn:
    id: seat-row-federal-representatives-nsw-grayndler
- extendedWaitUntil:
    notVisible:
      id: welcome-seat
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/28-after-choice
# Seen: a relaunch with the same argument goes straight to the app.
- stopApp
- launchApp:
    arguments:
      OPAXWelcomeTour: 'on'
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 60000
- assertNotVisible:
    id: welcome-screen
- takeScreenshot: ${EVIDENCE}/28-relaunch
# Replay from Account: the full welcome slides up; its seat step shows the
# saved seat and "Done", which changes nothing.
- tapOn: Account
- scrollUntilVisible:
    element:
      id: account-replay-tour
    timeout: 90000
    visibilityPercentage: 10
    centerElement: true
- tapOn:
    id: account-replay-tour
- extendedWaitUntil:
    visible:
      id: welcome-screen
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/28-replay
- tapOn:
    id: welcome-know
- extendedWaitUntil:
    visible:
      id: seat-saved-row
    timeout: 10000
# iOS reads the saved row as one label ("Grayndler. Anthony Albanese,
# Labor. Saved."), so match the row by id and its label by pattern.
- assertVisible:
    id: seat-saved-row
    text: '.*Saved.*'
- assertVisible: Done
- takeScreenshot: ${EVIDENCE}/28-replay-seat
- tapOn: Done
- extendedWaitUntil:
    notVisible:
      id: welcome-seat
    timeout: 10000
- assertVisible:
    id: today-screen
- tapOn:
    id: tab-your-mp
- extendedWaitUntil:
    visible:
      id: your-seat-name
    timeout: 30000
- assertVisible: Grayndler.*
