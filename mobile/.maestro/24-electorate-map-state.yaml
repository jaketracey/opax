appId: au.com.opax.app
name: 24 State district from the device location, in the Victorian chooser
---
# TestFlight build 32 (AEArfYzu). Harness sets a Moonee Ponds fix (inside
# Essendon); launch resets location permission. The suggestion is matched on
# the device against bundled outlines: the connection audit sees no request.
- launchApp:
    clearState: true
    permissions:
      location: unset
- openLink: opax://seat
- extendedWaitUntil:
    visible:
      id: seat-sheet
    timeout: 30000
- tapOn: Electorate or member.s name
- inputText: Maribyrnong
- extendedWaitUntil:
    visible:
      id: seat-row-federal-representatives-vic-maribyrnong
    timeout: 30000
- tapOn:
    id: seat-row-federal-representatives-vic-maribyrnong
- extendedWaitUntil:
    notVisible:
      id: seat-sheet
    timeout: 10000
- tapOn:
    id: tab-your-mp
- scrollUntilVisible:
    element:
      id: choose-state-seat
    centerElement: true
    timeout: 300000
- tapOn:
    id: choose-state-seat
- extendedWaitUntil:
    visible: Victorian electorate
    timeout: 15000
- assertVisible: Legislative Assembly districts
- takeScreenshot: ${EVIDENCE}/24-state-chooser
- scrollUntilVisible:
    element:
      id: state-use-my-location
    direction: UP
    centerElement: true
    speed: 20
    timeout: 60000
- tapOn:
    id: state-use-my-location
- extendedWaitUntil:
    visible: Allow Once
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/24-state-location-purpose
- tapOn: Allow Once
- scrollUntilVisible:
    element:
      id: state-seat-location-row
    centerElement: true
    timeout: 300000
- assertVisible:
    id: state-location-suggestion
- assertVisible: .*Essendon.*
- takeScreenshot: ${EVIDENCE}/24-state-suggestion
- tapOn:
    id: state-seat-location-row
- extendedWaitUntil:
    notVisible:
      id: seat-sheet
    timeout: 10000
- scrollUntilVisible:
    element: .*Essendon.*
    centerElement: true
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/24-state-member
