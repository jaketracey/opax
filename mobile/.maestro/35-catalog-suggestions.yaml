appId: au.com.opax.app
name: 35 Grants programs and local party, topic and report suggestions, also at AX5
---
- launchApp:
    clearState: true
    permissions: {}
- tapOn:
    id: tab-search
- tapOn:
    id: search-input
    point: 95%,50%
- inputText: Community
- assertVisible:
    id: search-input
    text: ^Community$
- tapOn:
    point: 1%,50%
    retryTapIfNoChange: false
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: search-kind-menu
    direction: UP
    centerElement: true
    timeout: 90000
- tapOn:
    id: search-kind-menu
- scrollUntilVisible:
    element:
      text: ^Grants$
    timeout: 90000
- tapOn: Grants
- scrollUntilVisible:
    element:
      id: search-submit
    centerElement: true
    timeout: 90000
- tapOn:
    id: search-submit
- scrollUntilVisible:
    element:
      id: records-count
    centerElement: true
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/35-grants-count
- scrollUntilVisible:
    element:
      id: records-result-grant-program-.*
    centerElement: true
    visibilityPercentage: 10
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/35-grant-program
# Grant programs open the native program page (public-money lane, 8 Oct),
# not the in-app browser. Its title heads the page.
- tapOn:
    id: records-result-grant-program-.*
    index: 0
- extendedWaitUntil:
    visible:
      id: program-title
    timeout: 90000
- assertVisible:
    id: program-list
- takeScreenshot: ${EVIDENCE}/35-grant-program-page
- tapOn: { id: BackButton }
- extendedWaitUntil:
    notVisible:
      id: program-list
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible:
    id: search-filters-sheet
- takeScreenshot: ${EVIDENCE}/35-after-grant-close
- scrollUntilVisible:
    element:
      id: search-input
    direction: UP
    centerElement: true
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/35-returned-form
- tapOn:
    id: search-input
    point: 95%,50%
- takeScreenshot: ${EVIDENCE}/35-before-party-edit
- eraseText
- inputText: Labor
- assertVisible:
    id: search-input
    text: ^Labor$
- takeScreenshot: ${EVIDENCE}/35-party-query-typed
- tapOn:
    point: 1%,50%
    retryTapIfNoChange: false
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: search-suggestion-party-Labor
    centerElement: true
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/35-party-suggestion
- tapOn:
    id: search-suggestion-party-Labor
- assertVisible:
    id: party-screen
- tapOn: Search
- scrollUntilVisible:
    element:
      id: search-input
    direction: UP
    centerElement: true
    timeout: 90000
- tapOn:
    id: search-input
    point: 95%,50%
- eraseText
- inputText: Housing
- assertVisible:
    id: search-input
    text: ^Housing$
- tapOn:
    point: 1%,50%
    retryTapIfNoChange: false
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: search-suggestion-topic-housing
    centerElement: true
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/35-topic-suggestion
# Topics open the native topic page (a63cb511f, 7 Oct), not the browser.
- tapOn:
    id: search-suggestion-topic-housing
- extendedWaitUntil:
    visible:
      id: topic-screen
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/35-topic-page
- tapOn: { id: BackButton }
- extendedWaitUntil:
    notVisible:
      id: topic-screen
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible:
    id: search-filters-sheet
- scrollUntilVisible:
    element:
      id: search-suggestion-report-housing
    centerElement: true
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/35-report-suggestion
