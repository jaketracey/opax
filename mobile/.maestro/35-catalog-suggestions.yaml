appId: au.com.opax.app
name: 35 Grants programs from All's Money rows and local party and topic suggestions, also at AX5
---
# Money is a list under All, not a kind: the Grants row runs one read when
# tapped and pushes its list (journeys/search.md 3.4). Party and topic
# suggestions are drawn on the device and open their native pages.
- launchApp:
    clearState: true
    permissions: {}
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-search
- runFlow:
    file: support/search-query.yaml
    env:
      QUERY: Community
      PREFIX: 35
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: search-in-money
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 90000
- scrollUntilVisible:
    element:
      id: search-in-grants
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/35-money-rows
- tapOn:
    id: search-in-grants
- extendedWaitUntil:
    visible:
      id: results-grants
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/35-grants-count
- scrollUntilVisible:
    element:
      id: results-grants-0
    centerElement: true
    visibilityPercentage: 10
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/35-grant-program
# Grant programs open the native program page (public-money lane, 8 Oct),
# not the in-app browser. Its title heads the page.
- tapOn:
    id: results-grants-0
- extendedWaitUntil:
    visible:
      id: program-title
    timeout: 90000
- assertVisible:
    id: program-list
- takeScreenshot: ${EVIDENCE}/35-grant-program-page
- tapOn: { id: BackButton }
- extendedWaitUntil:
    notVisible:
      id: program-list
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${EVIDENCE}/35-after-grant-close
# Back again to Search, where the answered query is kept.
- tapOn: { id: BackButton }
- extendedWaitUntil:
    visible:
      id: search-count
    timeout: 10000
- takeScreenshot: ${EVIDENCE}/35-returned-form
- runFlow: support/search-clear.yaml
- runFlow:
    file: support/search-query.yaml
    env:
      QUERY: Labor
      PREFIX: 35-party
- scrollUntilVisible:
    element:
      id: search-suggestion-party-Labor
    centerElement: true
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/35-party-suggestion
- tapOn:
    id: search-suggestion-party-Labor
- extendedWaitUntil:
    visible:
      id: party-screen
    timeout: 20000
- tapOn: { id: BackButton }
- extendedWaitUntil:
    notVisible:
      id: party-screen
    timeout: 10000
- runFlow: support/search-clear.yaml
- runFlow:
    file: support/search-query.yaml
    env:
      QUERY: Housing
      PREFIX: 35-topic
- scrollUntilVisible:
    element:
      id: search-suggestion-topic-housing
    centerElement: true
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/35-topic-suggestion
# Topics open the native topic page (a63cb511f, 7 Oct), not the browser.
- tapOn:
    id: search-suggestion-topic-housing
- extendedWaitUntil:
    visible:
      id: topic-screen
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/35-topic-page
- tapOn: { id: BackButton }
- extendedWaitUntil:
    notVisible:
      id: topic-screen
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 5000
- assertNotVisible:
    id: filters-screen
