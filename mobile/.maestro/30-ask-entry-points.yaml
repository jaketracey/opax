appId: au.com.opax.app
name: 30 Ask about drafts from records; each starts a new conversation, sends nothing and never stops a running answer
---
- launchApp:
    permissions:
      all: unset
    clearState: true
# A conversation first, so each arrival can be seen to start a new one.
- tapOn:
    id: tab-ask
- tapOn:
    id: ask-starter-0
- runFlow: support/ask-consent.yaml
- extendedWaitUntil:
    visible:
      id: ask-machine-label
    timeout: 180000
- openLink: opax://person/anthony-albanese
- extendedWaitUntil:
    visible:
      id: person-screen-title
    timeout: 60000
- takeScreenshot: ${EVIDENCE}/30-person-entry
- runFlow:
    file: support/open-more.yaml
    env:
      NAME: 'Anthony Albanese'
# The person's More menu says "Ask about <name>" (native menu items take no id).
- tapOn: Ask about Anthony Albanese
- extendedWaitUntil:
    visible:
      id: ask-question
      text: What has Anthony Albanese said in parliament this year\?
    timeout: 15000
# A fresh idle page: the previous conversation is first under Conversations.
- assertVisible:
    id: ask-idle-line
- assertVisible:
    id: ask-conversation-0
- assertNotVisible:
    id: ask-user-question
- assertVisible:
    id: ask-options-line
- takeScreenshot: ${EVIDENCE}/30-speaker-draft
- openLink: opax://party/labor
- extendedWaitUntil:
    visible:
      id: party-title
    timeout: 60000
- takeScreenshot: ${EVIDENCE}/30-party-entry
- runFlow:
    file: support/open-more.yaml
    env:
      NAME: 'Labor'
- tapOn: Ask about .*
- extendedWaitUntil:
    visible:
      id: ask-question
      text: What have Labor members said in parliament this year\?
    timeout: 15000
- openLink: opax://electorate/el_5d600e7f6dca5b72ae04d686
- extendedWaitUntil:
    visible:
      id: electorate-name
    timeout: 60000
- takeScreenshot: ${EVIDENCE}/30-electorate-entry
- runFlow:
    file: support/open-more.yaml
    env:
      NAME: '.*'
- tapOn: Ask about .*
- extendedWaitUntil:
    visible:
      id: ask-question
      text: What has parliament said about .*\?
    timeout: 15000
- assertNotVisible:
    id: ask-status
# A running answer survives an arrival: the draft waits, marked as a new
# conversation, and the composer's button stays Stop until it completes.
# Clear any options left from an earlier draft before the slow question. The
# electorate draft carries none, so there may be no Clear to tap.
- tapOn:
    id: ask-options-clear
    optional: true
- tapOn:
    id: ask-question
- eraseText: 200
- inputText: fixture slow stream
- tapOn:
    id: ask-submit
    enabled: true
- extendedWaitUntil:
    visible:
      id: ask-status
    timeout: 15000
- openLink: opax://bill/au-federal-r7534
- extendedWaitUntil:
    visible:
      id: bill-title
    timeout: 60000
- takeScreenshot: ${EVIDENCE}/30-bill-entry
# On iOS the bill's Ask is a button on the page, not a ⋯ item (the floating
# tab bar covered a bottom toolbar).
- scrollUntilVisible:
    element:
      id: bill-ask
    centerElement: true
    speed: 20
    timeout: 30000
- tapOn:
    id: bill-ask
- extendedWaitUntil:
    visible:
      id: ask-draft-new-conversation
    timeout: 15000
- assertVisible: Starts a new conversation.*
# Stop is the running answer. Its stage line (ask-status) gives way to the
# text 24 s in, which this arrival can outlast, so it is not checked here.
- assertVisible:
    id: ask-stop
- takeScreenshot: ${EVIDENCE}/30-bill-draft-while-running
- extendedWaitUntil:
    visible:
      id: ask-machine-label
    timeout: 90000
# Once the answer completes, Send opens a new conversation with the draft.
- tapOn:
    id: ask-submit
    enabled: true
- extendedWaitUntil:
    visible:
      id: ask-user-question
      text: What did parliament say about the .*
    timeout: 60000
- assertNotVisible:
    id: ask-user-question
    text: fixture slow stream
- openLink: opax://doc/speech-1205524
- extendedWaitUntil:
    visible:
      id: doc-title
    timeout: 60000
- scrollUntilVisible:
    element:
      id: doc-ask
    centerElement: true
    speed: 20
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/30-doc-entry
- tapOn:
    id: doc-ask
- extendedWaitUntil:
    visible:
      id: ask-question
      text: What did .* say about .*\?
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/30-doc-draft
