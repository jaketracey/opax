appId: au.com.opax.app
name: 31 Ask options, chips, saved conversation after relaunch and delete (standard and AX5)
---
- launchApp:
    clearState: true
- tapOn:
    id: tab-ask
- scrollUntilVisible:
    element:
      id: ask-options
    centerElement: true
    timeout: 180000
- tapOn:
    id: ask-options
- takeScreenshot: ${EVIDENCE}/31-options
- scrollUntilVisible:
    element:
      id: ask-from
    centerElement: true
    timeout: 180000
- tapOn:
    id: ask-from
- inputText: '2020'
- scrollUntilVisible:
    element:
      id: ask-party
    centerElement: true
    timeout: 180000
- tapOn:
    id: ask-party
- scrollUntilVisible:
    element:
      id: ask-party-choice-1
    centerElement: true
    timeout: 180000
- tapOn:
    id: ask-party-choice-1
- scrollUntilVisible:
    element:
      id: ask-options-done
    centerElement: true
    speed: 40
    timeout: 300000
- tapOn:
    id: ask-options-done
- scrollUntilVisible:
    element:
      id: ask-chip-party
    centerElement: true
    timeout: 180000
- assertVisible: Remove the party filter, Labor
- takeScreenshot: ${EVIDENCE}/31-chips
- tapOn:
    id: ask-chip-party
- assertNotVisible:
    id: ask-chip-party
- scrollUntilVisible:
    element:
      id: ask-question
    direction: UP
    centerElement: true
    timeout: 180000
- tapOn:
    id: ask-question
- inputText: What did parliament say about this bill?
- scrollUntilVisible:
    element:
      id: ask-submit
    centerElement: true
    timeout: 180000
- tapOn:
    id: ask-submit
- scrollUntilVisible:
    element:
      id: ask-machine-label
    centerElement: true
    visibilityPercentage: 10
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/31-saved-answer
- stopApp
- launchApp
- tapOn:
    id: tab-ask
- scrollUntilVisible:
    element:
      id: ask-saved
    direction: UP
    centerElement: true
    timeout: 180000
- tapOn:
    id: ask-saved
- scrollUntilVisible:
    element:
      id: ask-restore-0
    centerElement: true
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/31-history
- tapOn:
    id: ask-restore-0
- scrollUntilVisible:
    element:
      id: ask-machine-label
    direction: DOWN
    centerElement: true
    visibilityPercentage: 10
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/31-restored
- scrollUntilVisible:
    element:
      id: ask-saved
    direction: UP
    centerElement: true
    timeout: 180000
- tapOn:
    id: ask-saved
- scrollUntilVisible:
    element:
      id: ask-delete-0
    centerElement: true
    visibilityPercentage: 10
    timeout: 180000
- tapOn:
    id: ask-delete-0
- assertVisible: No saved conversations\.
- takeScreenshot: ${EVIDENCE}/31-deleted
- scrollUntilVisible:
    element:
      id: ask-history-done
    centerElement: true
    timeout: 180000
- tapOn:
    id: ask-history-done
