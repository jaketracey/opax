appId: au.com.opax.app
name: 31 Ask options, the options line, Conversations after relaunch, swipe Delete and Delete all
---
- launchApp:
    permissions:
      all: unset
    clearState: true
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-ask
# Options: the shared filter sheet, "Person" not "Speaker", no builder.
- tapOn:
    id: ask-composer-options
- extendedWaitUntil:
    visible: Person
    timeout: 15000
- assertVisible: Options
- assertNotVisible: Speaker
- takeScreenshot: ${EVIDENCE}/31-options
- tapOn: Party
- tapOn: Labor
- tapOn: Done
- extendedWaitUntil:
    visible:
      id: ask-options-line
    timeout: 15000
- assertVisible: Labor
- takeScreenshot: ${EVIDENCE}/31-options-line
- tapOn:
    id: ask-options-clear
- assertNotVisible:
    id: ask-options-line
- tapOn:
    id: ask-question
- inputText: What did parliament say about this bill?
- tapOn:
    id: ask-submit
    enabled: true
- runFlow: support/ask-consent.yaml
- scrollUntilVisible:
    element:
      id: ask-machine-label
    centerElement: false
    visibilityPercentage: 10
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/31-saved-answer
# A cold launch opens Ask idle, the conversation first under Conversations.
- stopApp
- launchApp:
    permissions:
      all: unset
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-ask
- extendedWaitUntil:
    visible:
      id: ask-idle-line
    timeout: 30000
- assertVisible:
    id: ask-conversation-0
- runFlow: support/ask-open-conversations.yaml
- takeScreenshot: ${EVIDENCE}/31-history
# A SwiftUI List: rows are reached by label, not testID.
- tapOn: What did parliament say about this bill\?.*
- scrollUntilVisible:
    element:
      id: ask-machine-label
    direction: DOWN
    centerElement: false
    visibilityPercentage: 10
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/31-restored
# New question sticks across a relaunch.
- tapOn: New question
- extendedWaitUntil:
    visible:
      id: ask-idle-line
    timeout: 10000
- stopApp
- launchApp:
    permissions:
      all: unset
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-ask
- extendedWaitUntil:
    visible:
      id: ask-idle-line
    timeout: 30000
# Swipe Delete deletes at once, with no undo bar.
- runFlow: support/ask-open-conversations.yaml
- swipe:
    from: What did parliament say about this bill\?.*
    direction: LEFT
- tapOn: Delete
- extendedWaitUntil:
    visible: No conversations yet
    timeout: 10000
- assertNotVisible: Undo
- takeScreenshot: ${EVIDENCE}/31-deleted
- tapOn: Done
# Delete all: last in Account › Ask, confirmed, hidden with none saved.
- tapOn:
    id: ask-starter-0
- extendedWaitUntil:
    visible:
      id: ask-machine-label
    timeout: 180000
- openLink: opax://account/ask
- extendedWaitUntil:
    visible:
      id: ask-settings-conversations
    timeout: 15000
- assertVisible:
    id: ask-settings-notice
- tapOn:
    id: ask-settings-delete-all
- tapOn: Delete
- extendedWaitUntil:
    notVisible:
      id: ask-settings-delete-all
    timeout: 10000
- takeScreenshot: ${EVIDENCE}/31-deleted-all
