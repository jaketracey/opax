appId: au.com.opax.app
name: 21b Talk sources, a source record, mute, end, consent withdrawn and declined
# Part of journey 21 (see 21-talk-a-call.yaml). Signs in to the fixture's
# happy account itself; clearState removes stored consent, so this call asks.
# The live-call controls and the record bar cannot scroll to the centre, so
# their scrolls do not centre (centring cost about 38 s per control).
---
- launchApp:
    clearState: true
    permissions: {}
- runFlow:
    file: support/talk-fixture-account.yaml
    env:
      TALK_EMAIL: happy@example.invalid
# Talk's action is pinned at the foot of a screen that does not scroll (the
# idle orb, 13 Nov), so these scrolls only wait for it. Centring it timed
# out on the device whenever lines under it held it low (sweep 2 lane A).
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-start
- tapOn:
    id: talk-start
- runFlow:
    file: support/talk-consent.yaml
    env:
      CONSENT_BUTTON: talk-agree
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-status
    direction: UP
- extendedWaitUntil:
    visible: Listening|OPAX is speaking
    timeout: 15000
# Sources appear as a badge on the call controls and open in a sheet.
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-sources
- takeScreenshot: ${EVIDENCE}/21-sources-badge
- tapOn:
    id: talk-sources
- extendedWaitUntil:
    visible:
      id: talk-source-0
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/21-sources
- tapOn:
    id: talk-source-0
- extendedWaitUntil:
    visible:
      id: bill-title
    timeout: 60000
- takeScreenshot: ${EVIDENCE}/21-source-record
# The record is pushed inside Talk: its bar shows the call's status and End,
# and the native back button returns to the call.
- assertVisible:
    id: talk-record-status
- assertVisible:
    id: talk-record-end
- tapOn: { id: BackButton }
# Type is a call control: it opens the composer, and a second tap closes it.
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-type
    direction: DOWN
- tapOn:
    id: talk-type
- extendedWaitUntil:
    visible:
      id: talk-text
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/21-type
- tapOn:
    id: talk-type
- assertNotVisible:
    id: talk-text
# Captions hide and show from the More menu.
- tapOn: More options
- extendedWaitUntil:
    visible: Hide captions
    timeout: 15000
- tapOn: Hide captions
- assertNotVisible:
    id: talk-captions-list
- tapOn: More options
- extendedWaitUntil:
    visible: Show captions
    timeout: 15000
- tapOn: Show captions
- extendedWaitUntil:
    visible:
      id: talk-captions-list
    timeout: 15000
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-mute
    direction: DOWN
- tapOn:
    id: talk-mute
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-status
    direction: UP
- assertVisible: Muted
- takeScreenshot: ${EVIDENCE}/21-muted
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-end
- tapOn:
    id: talk-end
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-status
    direction: UP
- extendedWaitUntil:
    visible: Call ended\.
    timeout: 15000
- assertVisible: Start again
- takeScreenshot: ${EVIDENCE}/21-ended
- tapOn: More options
- extendedWaitUntil:
    visible: Withdraw voice consent
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/21-menu
- tapOn: Withdraw voice consent
- extendedWaitUntil:
    visible: Voice consent withdrawn\.
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/21-withdrawn
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-start
    direction: UP
- tapOn:
    id: talk-start
- runFlow:
    file: support/talk-consent.yaml
    env:
      CONSENT_BUTTON: talk-not-now
- extendedWaitUntil:
    visible:
      id: talk-start
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/21-consent-declined
