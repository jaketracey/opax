appId: au.com.opax.app
name: 33 Bill text versions, source navigation, Just added and native records
---
- launchApp:
    permissions: {}
- openLink: opax://bill/au-federal-r7534
- extendedWaitUntil:
    visible:
      id: bill-screen
    timeout: 20000
# A tap target: centred at speed 20 (about half a screen per swipe). At
# speed 70 the centring swipe carried the row past the header or the page
# to its end on the reference device (8 Oct, base and branch alike).
- scrollUntilVisible:
    element:
      id: bill-read-text
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 180000
- waitForAnimationToEnd
- tapOn:
    id: bill-read-text
- extendedWaitUntil:
    visible:
      id: bill-text-reader
    timeout: 20000
# The reader opens with its summary and overview above the first text block.
- scrollUntilVisible:
    element:
      id: reader-text-0
    direction: DOWN
    visibilityPercentage: 10
    speed: 20
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/33-bill-text
- scrollUntilVisible:
    element:
      id: bill-text-overview
    direction: UP
    centerElement: true
    speed: 20
    timeout: 180000
- waitForAnimationToEnd
- tapOn:
    id: bill-text-overview
- scrollUntilVisible:
    element:
      id: bill-text-overview-label
    direction: DOWN
    visibilityPercentage: 10
    speed: 20
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/33-overview
# Share as text file is in the bar's ⋯.
- runFlow:
    file: support/open-more.yaml
    env:
      NAME: this bill text
- waitForAnimationToEnd
- tapOn: Share as text file
- assertVisible: 'Share file: au-federal-r7534-r7534-aspassed.txt'
- takeScreenshot: ${EVIDENCE}/33-text-file
- tapOn: OK
# The version's accessible label includes the full stage and date.
- tapOn:
    id: bill-text-version
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/33-version-picker
- tapOn: 'First reading: synthetic fixture, 1 Oct 2026'
- extendedWaitUntil:
    visible:
      id: bill-text-version
      text: 'Version, First reading: synthetic fixture(, 1 October 2026)?'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: bill-text-stage
    direction: UP
    speed: 20
    timeout: 180000
- assertVisible:
    id: bill-text-stage
    text: 'First reading: synthetic fixture'
- takeScreenshot: ${EVIDENCE}/33-version-switched
# Contents hands the chosen section back to the reader; the same choice
# twice still scrolls.
- runFlow: support/bill-text-contents.yaml
- extendedWaitUntil:
    visible:
      id: bill-text-contents-screen
    timeout: 20000
- tapOn:
    id: bill-text-section-1
- extendedWaitUntil:
    visible:
      id: reader-part-title-1
    timeout: 20000
- takeScreenshot: ${EVIDENCE}/33-text-navigation
- scroll
- scroll
- runFlow: support/bill-text-contents.yaml
- extendedWaitUntil:
    visible:
      id: bill-text-contents-screen
    timeout: 20000
- tapOn:
    id: bill-text-section-1
- extendedWaitUntil:
    visible:
      id: reader-part-title-1
    timeout: 20000
- tapOn:
    id: tab-today
- scrollUntilVisible:
    element:
      id: today-records-open
    direction: DOWN
    centerElement: true
    speed: 70
    timeout: 180000
- waitForAnimationToEnd
- tapOn:
    id: today-records-open
- extendedWaitUntil:
    visible:
      id: recent-records
    timeout: 20000
- takeScreenshot: ${EVIDENCE}/33-just-added
- scrollUntilVisible:
    element:
      id: recent-record-1
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- waitForAnimationToEnd
- tapOn:
    id: recent-record-1
- extendedWaitUntil:
    visible:
      id: doc-title
    timeout: 20000
- takeScreenshot: ${EVIDENCE}/33-division-reader
- openLink: opax://doc/press-pmt-reader-fixture
- extendedWaitUntil:
    visible:
      id: doc-title
    timeout: 20000
- takeScreenshot: ${EVIDENCE}/33-release-reader
- scrollUntilVisible:
    element:
      id: reader-text-0
    direction: DOWN
    visibilityPercentage: 10
    speed: 70
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/33-release-text
