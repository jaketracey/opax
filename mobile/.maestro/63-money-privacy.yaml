appId: au.com.opax.app
name: 63 Money privacy, individuals counted, never named
---
# Individuals are never named in a money list: Recipients lists
# organisations, with individual recipients as a footnote; an individual's
# own record says "Individual recipient" or "Individual supplier", has no
# Open row, and says why in its Notes.
- launchApp
- openLink: opax://public-money
- tapOn:
    text: Open
    optional: true
- scrollUntilVisible:
    element:
      id: money-card-grants
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- tapOn:
    id: money-card-grants
- scrollUntilVisible:
    element:
      id: grants-recipients
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- tapOn:
    id: grants-recipients
- scrollUntilVisible:
    element:
      id: grants-recipient-0
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- assertNotVisible: Individual recipient
- scrollUntilVisible:
    element:
      id: grants-individuals
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- assertVisible:
    id: grants-individuals
    text: "[0-9,]+ individual recipients, .*, not named\\."
- takeScreenshot: ${EVIDENCE}/63-recipients-footnote
# A program's individual recipients: one record, addressed without a name.
- openLink: opax://money-item?kind=recipient&jur=federal&program=go7960&recipient=individuals
- tapOn:
    text: Open
    optional: true
- scrollUntilVisible:
    element:
      id: money-item-title
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- assertVisible:
    id: money-item-title
    text: Individual recipients
- assertNotVisible:
    id: money-item-open-organisation
- scrollUntilVisible:
    element:
      id: money-item-record-0
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- tapOn:
    id: money-item-record-0
- scrollUntilVisible:
    element:
      id: money-item-title
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- assertVisible:
    id: money-item-title
    text: Individual recipient
- assertNotVisible:
    id: money-item-open-organisation
- scrollUntilVisible:
    element:
      text: OPAX doesn’t name private individuals.
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 60000
- takeScreenshot: ${EVIDENCE}/63-individual-recipient
# An individual supplier's contract.
- openLink: opax://money-item?kind=contract&agency=a-03eafa685fa589f6a081&id=CN3633263
- tapOn:
    text: Open
    optional: true
- scrollUntilVisible:
    element:
      id: money-item-title
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- assertVisible:
    id: money-item-title
    text: Individual supplier
- assertNotVisible:
    id: money-item-open-organisation
- scrollUntilVisible:
    element:
      text: OPAX doesn’t name private individuals.
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 60000
- takeScreenshot: ${EVIDENCE}/63-individual-supplier
