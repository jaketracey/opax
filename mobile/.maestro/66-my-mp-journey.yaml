appId: au.com.opax.app
name: 66 My MP from first launch to the latest division and the official page
---
# Fixture contract: DATA-7 gives Grayndler's member an aph.gov.au URL;
# Latest 0 is a verified member vote with a bill key and division key.
# The current pinned fixture needs the overlays recorded in Follow-up lines.
- launchApp:
    clearState: true
    permissions:
      location: unset
    arguments:
      OPAXWelcomeTour: 'on'
      OPAXEditionAge: fresh
      OPAXEditionCache: present
- extendedWaitUntil:
    visible:
      id: welcome-screen
    timeout: 60000
- extendedWaitUntil:
    notVisible:
      id: welcome-launch-cover
    timeout: 10000
# budget: first-launch-member
- scrollUntilVisible:
    element:
      id: welcome-continue
    timeout: 30000
# As in 28: on iOS 26.3.1 a tap during the entrance animation is dropped
# and the welcome stays put (14 Nov 2026).
- waitForAnimationToEnd
- tapOn:
    id: welcome-continue
- assertVisible:
    id: welcome-seat
# Focus the native search field explicitly before typing.
- tapOn: Electorate or member.s name
- inputText: Grayndler
- extendedWaitUntil:
    visible:
      id: seat-row-federal-representatives-nsw-grayndler
    timeout: 30000
- tapOn:
    id: seat-row-federal-representatives-nsw-grayndler
- extendedWaitUntil:
    visible:
      id: today-your-mp
    timeout: 60000
- assertVisible:
    id: today-your-mp-member
    text: Your MP, Anthony Albanese.*
# end: first-launch-member
- takeScreenshot: ${EVIDENCE}/66-member
# budget: today-member-profile
- tapOn:
    id: today-your-mp-member
- extendedWaitUntil:
    visible:
      id: person-screen-title
      text: Anthony Albanese
    timeout: 60000
# end: today-member-profile
- assertVisible:
    id: BackButton
    text: Today
- takeScreenshot: ${EVIDENCE}/66-member-profile
# On iOS 26.3.1 a back tap before the push settles is dropped (14 Nov 2026).
- waitForAnimationToEnd
- tapOn:
    id: BackButton
- assertVisible:
    id: today-screen
# budget: today-official-page
# Choosing the seat leaves Today scrolled with the tile's top under the bar;
# on iOS 26.3.1 a long press there opened the profile (14 Nov 2026). Centre it.
- scrollUntilVisible:
    element:
      id: today-your-mp-member
    direction: UP
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd
- longPressOn:
    id: today-your-mp-member
- tapOn: Parliament of Australia page
- extendedWaitUntil:
    visible:
      id: source-destination-url
      text: .*aph\.gov\.au.*
    timeout: 15000
# end: today-official-page
- takeScreenshot: ${EVIDENCE}/66-official-page
- tapOn: Done
