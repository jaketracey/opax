appId: au.com.opax.app
name: 21c Talk a call that runs out of free minutes, then an exhausted allowance
# Part of journey 21 (see 21-talk-a-call.yaml). The deadline helper signs out,
# recreates the fixture's deadline account and signs in to it; clearState
# removes stored consent, so the call asks for it.
---
- launchApp:
    clearState: true
    permissions: {}
- runFlow: support/talk-fixture-deadline.yaml
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-start
    centerElement: true
# The allowance is the one voice-time formatter (specs/account.md 7.6).
- assertVisible:
    id: talk-allowance
    text: '\d+ (min|sec) left|Unlimited'
- tapOn:
    id: talk-start
- runFlow:
    file: support/talk-consent.yaml
    env:
      CONSENT_BUTTON: talk-agree
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-status
    direction: UP
    visibilityPercentage: 10
- extendedWaitUntil:
    visible: You’ve used your voice minutes\.
    timeout: 20000
# With no minutes left, the action is Ask instead, not Start again.
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-ask
    visibilityPercentage: 10
- assertNotVisible:
    id: talk-start
- takeScreenshot: ${EVIDENCE}/21-deadline
- runFlow:
    file: support/talk-fixture-account.yaml
    env:
      TALK_EMAIL: exhausted@example.invalid
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-status
    visibilityPercentage: 10
- assertVisible: You’ve used your voice minutes\.
- assertVisible:
    id: talk-ask
- takeScreenshot: ${EVIDENCE}/21-exhausted
- assertNotVisible:
    id: talk-start
