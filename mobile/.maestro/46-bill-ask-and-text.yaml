appId: au.com.opax.app
name: 46 From a bill in the Bills tab, Ask about this opens a draft; the bill text leads with its summary
---
# The bill is opened from the Bills tab, not by deep link: a deep link can
# land in the Ask tab's own stack, where the old pop-to-Ask worked, so only
# a browsing tab shows a dead "Ask about this" (build 17). Arrival in Ask
# never submits; the draft waits for the reader.
- launchApp
- tapOn:
    id: tab-bills
- extendedWaitUntil:
    visible:
      id: bills-count
    timeout: 20000
- tapOn:
    id: bills-search
- inputText: interactive gambling levy
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: bill-row-au-federal-r7534
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- waitForAnimationToEnd
- tapOn:
    id: bill-row-au-federal-r7534
- extendedWaitUntil:
    visible:
      id: bill-screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: bill-ask
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/46-bill-entry
- tapOn:
    id: bill-ask
- extendedWaitUntil:
    visible:
      id: ask-question
    timeout: 15000
- assertVisible: What did parliament say about the .*\?
- takeScreenshot: ${EVIDENCE}/46-ask-draft
# Back to the bill: the Bills tab keeps its stack.
- tapOn:
    id: tab-bills
- extendedWaitUntil:
    visible:
      id: bill-screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: bill-read-text
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 90000
- waitForAnimationToEnd
- tapOn:
    id: bill-read-text
- extendedWaitUntil:
    visible:
      id: bill-text-reader
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: bill-text-summary-label
    timeout: 20000
- assertVisible:
    id: bill-text-summary-text
- takeScreenshot: ${EVIDENCE}/46-bill-text
- scrollUntilVisible:
    element:
      id: bill-text-read
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/46-bill-text-actions
