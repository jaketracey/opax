appId: au.com.opax.app
name: 46 From a bill in the Bills tab, Ask about this opens a draft; the bill text leads with its summary
---
# The bill is opened from the Bills tab, not by deep link: a deep link can
# land in the Ask tab's own stack, where the old pop-to-Ask worked, so only
# a browsing tab shows a dead "Ask about this" (build 17). "Ask about this"
# switches to the Ask tab and never submits; the draft waits for the reader,
# and Ask's bar leads back to the bill (journeys/ask.md 4.2).
- launchApp
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-bills
- extendedWaitUntil:
    visible:
      id: bills-count
    timeout: 20000
- runFlow: support/bills-search-reveal.yaml
- tapOn:
    text: Search bills
- inputText: interactive gambling levy
- pressKey: Enter
# The search keeps the tab's scope. The bill has passed, so under Before
# parliament (the default; a clean install or another flow's choice) the
# empty state offers Search all bills.
- extendedWaitUntil:
    visible:
      id: bills-search-all|bill-row-au-federal-r7534
    timeout: 30000
- runFlow:
    when:
      visible:
        id: bills-search-all
    commands:
      - tapOn:
          id: bills-search-all
- scrollUntilVisible:
    element:
      id: bill-row-au-federal-r7534
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- waitForAnimationToEnd
- tapOn:
    id: bill-row-au-federal-r7534
- extendedWaitUntil:
    visible:
      id: bill-screen
    timeout: 15000
# Share is in the bar; Ask about this bill and the bill text are rows.
# The bill text is a row under the meta line (P1-3).
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/46-bill-entry
- scrollUntilVisible:
    element:
      id: bill-ask
    timeout: 90000
- tapOn:
    id: bill-ask
- extendedWaitUntil:
    visible:
      id: ask-question
    timeout: 15000
- assertVisible: What did parliament say about the .*\?
- takeScreenshot: ${EVIDENCE}/46-ask-draft
# Back to the bill: Ask's back item returns to the Bills tab, whose stack
# kept the bill.
- tapOn:
    id: ask-back
- extendedWaitUntil:
    visible:
      id: bill-screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: bill-read-text
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 90000
- waitForAnimationToEnd
- tapOn:
    id: bill-read-text
- extendedWaitUntil:
    visible:
      id: bill-text-reader
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: bill-text-summary-label
    timeout: 20000
- assertVisible:
    id: bill-text-summary-text
- takeScreenshot: ${EVIDENCE}/46-bill-text
# On iOS, Ask about this bill is a button after In short, above the text
# (12 Nov 2026); Android keeps it in More.
- runFlow:
    when:
      platform: iOS
    commands:
      - scrollUntilVisible:
          element:
            id: bill-text-ask
          direction: DOWN
          visibilityPercentage: 50
          speed: 20
          timeout: 90000
      - assertVisible:
          id: bill-text-ask
          text: 'Ask about this bill: .*'
      - takeScreenshot: ${EVIDENCE}/46-bill-text-actions
# The text follows the summary.
- scrollUntilVisible:
    element:
      id: reader-text-0
    direction: DOWN
    visibilityPercentage: 10
    speed: 20
    timeout: 90000
