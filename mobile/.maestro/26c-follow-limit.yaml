appId: au.com.opax.app
name: 26c At the 50 follow limit, a page and a row menu say so once and lead to Edit Following
---
# journeys/follow.md 10.1. The launch argument -OPAXSeedFollows 50 asks an
# e2e build to start with 50 saved follows (none of them the first recent
# bill). Quote "50": the argument is read as a string.
- launchApp:
    clearState: true
    arguments:
      OPAXSeedFollows: '50'
- assertVisible:
    id: today-screen-message

# On a page: Follow does not turn on; one line and a plain Edit Following.
- scrollUntilVisible:
    element:
      id: today-bill-0
    timeout: 90000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- tapOn:
    id: today-bill-0
- extendedWaitUntil:
    visible:
      id: bill-screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: bill-follow-off
    timeout: 90000
    centerElement: true
    speed: 20
- tapOn:
    id: bill-follow-off
- extendedWaitUntil:
    visible:
      id: bill-follow-message
      text: You can follow up to 50\. Unfollow one to add this\.
    timeout: 15000
- assertVisible:
    id: bill-follow-off
- takeScreenshot: ${EVIDENCE}/26c-limit-page
- tapOn:
    id: bill-follow-edit-following
# Edit Following pushes /follows in this stack, already in Edit mode.
- extendedWaitUntil:
    visible:
      id: follows-screen
    timeout: 15000
- assertVisible:
    id: follows-editing
- assertVisible: Done
- assertVisible:
    id: follows-unfollow-all
- takeScreenshot: ${EVIDENCE}/26c-limit-edit
- tapOn: Done
- extendedWaitUntil:
    visible:
      id: follows-browsing
    timeout: 15000

# From a row menu: the same sentence in an alert, Edit Following or Cancel.
- tapOn: Today
- assertVisible:
    id: today-screen
- scrollUntilVisible:
    element:
      id: today-bill-0
    timeout: 90000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- longPressOn:
    id: today-bill-0
- tapOn: Follow
- extendedWaitUntil:
    visible: You can follow up to 50\. Unfollow one to add this\.
    timeout: 15000
- assertVisible: Edit Following
- assertVisible: Cancel
- takeScreenshot: ${EVIDENCE}/26c-limit-menu
- tapOn: Cancel
- assertNotVisible: You can follow up to 50\. Unfollow one to add this\.
