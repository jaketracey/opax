appId: au.com.opax.app
name: 42 Grants in the seat, Commonwealth grants, programs, largest, community funding, programs and places
---
- launchApp
- openLink: opax://seat
- assertVisible:
    id: seat-sheet
- tapOn: Electorate or member.s name
- inputText: Grayndler
- tapOn:
    id: seat-row-federal-representatives-nsw-grayndler
- openLink: opax://your-mp
- scrollUntilVisible:
    element:
      id: seat-grants-total
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/42-your-mp-grants
- scrollUntilVisible:
    element:
      id: your-electorate
    direction: UP
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- tapOn:
    id: your-electorate
- scrollUntilVisible:
    element:
      id: electorate-name
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/42-electorate
- scrollUntilVisible:
    element:
      id: seat-grants-total
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/42-seat-grants
# Grants in the seat opens from the hub's seat row until the per-seat
# slice ships (D5): a figure and its source only, nothing national.
- openLink: opax://public-money
- tapOn:
    text: Open
    optional: true
- scrollUntilVisible:
    element:
      id: money-hub-title
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/42-public-money-hub
- scrollUntilVisible:
    element:
      id: money-seat
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- tapOn:
    id: money-seat
- scrollUntilVisible:
    element:
      id: grants-title
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- assertVisible:
    id: grants-title
    text: Grants in Grayndler
- assertVisible: Matched by postcode where one is recorded, so this is a minimum.
- scrollUntilVisible:
    element:
      id: grants-seat-electorate
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- assertVisible:
    id: grants-seat-electorate
    text: Grayndler.*
- assertNotVisible:
    id: grants-row-0
- takeScreenshot: ${EVIDENCE}/42-grants-in-seat
- tapOn: { id: BackButton }
- scrollUntilVisible:
    element:
      id: money-card-grants
    direction: UP
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- tapOn:
    id: money-card-grants
- scrollUntilVisible:
    element:
      id: grants-title
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/42-commonwealth-grants
# The bar search sits under the large title, visible on first appearance.
- tapOn: Grant programs
- inputText: Community Development Grants
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: grants-row-0
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- tapOn:
    id: grants-row-0
- scrollUntilVisible:
    element:
      id: program-title
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/42-program
- scrollUntilVisible:
    element:
      id: program-source
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- tapOn:
    id: program-source
- extendedWaitUntil:
    visible:
      id: program-source-sheet-original-0
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/42-program-source
- tapOn: Done
# A grant row pushes its money item, with the GrantConnect original.
- tapOn:
    id: program-grants
- scrollUntilVisible:
    element:
      id: program-grant-0
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- tapOn:
    id: program-grant-0
- scrollUntilVisible:
    element:
      id: money-item-title
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- scrollUntilVisible:
    element:
      id: money-item-original-0
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/42-grant-item
- tapOn: { id: BackButton }
# The month's largest grants is a row at the foot of the program's list.
- scrollUntilVisible:
    element:
      id: program-largest
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- tapOn:
    id: program-largest
- scrollUntilVisible:
    element:
      id: largest-title
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- assertVisible:
    id: largest-title
    text: Largest grants
- assertVisible:
    id: largest-month
- assertVisible:
    id: largest-rule
- takeScreenshot: ${EVIDENCE}/42-largest
- scrollUntilVisible:
    element:
      id: largest-recipient-0
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- tapOn:
    id: largest-recipient-0
- scrollUntilVisible:
    element:
      id: money-item-title
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/42-largest-item
- tapOn: { id: BackButton }
# Queensland grants from the hub.
- openLink: opax://public-money
- tapOn:
    text: Open
    optional: true
- scrollUntilVisible:
    element:
      id: money-qld
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- tapOn:
    id: money-qld
- scrollUntilVisible:
    element:
      id: grants-title
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/42-qld-grants
# Community funding: figure, stage picker, rows to money items, and the
# CPI table as published. No margin lookup.
- openLink: opax://grants-allocation
- tapOn:
    text: Open
    optional: true
- scrollUntilVisible:
    element:
      id: allocation-title
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- scrollUntilVisible:
    element:
      id: allocation-figure
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/42-allocation
- assertNotVisible:
    id: allocation-figure
- scrollUntilVisible:
    element:
      id: allocation-project-0
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- tapOn:
    id: allocation-project-0
- scrollUntilVisible:
    element:
      id: money-item-title
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/42-project
- tapOn: { id: BackButton }
- scrollUntilVisible:
    element:
      text: Invitations
    direction: UP
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- tapOn:
    text: Invitations
- takeScreenshot: ${EVIDENCE}/42-invitations
- tapOn:
    text: Earlier grants
- takeScreenshot: ${EVIDENCE}/42-history
- scrollUntilVisible:
    element:
      id: allocation-seat-type
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- tapOn:
    id: allocation-seat-type
- scrollUntilVisible:
    element:
      id: seat-type-title
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- assertVisible: ALP Safe
- assertVisible: Actual Grant Value
- takeScreenshot: ${EVIDENCE}/42-seat-type
- scrollUntilVisible:
    element:
      id: seat-type-source
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/42-seat-type-source
# Programs and places: every row opens its own page with the excerpts.
- openLink: opax://connections
- tapOn:
    text: Open
    optional: true
- scrollUntilVisible:
    element:
      id: connections-title
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/42-programs-places
- tapOn: Programs, places and organisations
- inputText: Community Development Grants
- pressKey: Enter
- takeScreenshot: ${EVIDENCE}/42-connections-search
- scrollUntilVisible:
    element:
      id: connection-open-c87ef697d1bd69e428442b36
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- tapOn:
    id: connection-open-c87ef697d1bd69e428442b36
- scrollUntilVisible:
    element:
      id: connection-title
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- scrollUntilVisible:
    element:
      id: connection-excerpt-0
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/42-connection
