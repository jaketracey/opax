appId: au.com.opax.app
name: 24 Electorate outline and on-device location in the seat chooser
---
# Harness sets a Grayndler simulated fix; launch resets location permission.
# Location is one ordinary answer row in the chooser: "From your location",
# no checkmark until it is chosen, one tap to choose.
- launchApp:
    clearState: true
    permissions:
      location: unset
- openLink: opax://seat
- extendedWaitUntil:
    visible:
      id: seat-sheet
    timeout: 30000
- assertVisible: Your electorate
- scrollUntilVisible:
    element:
      id: use-my-location
    centerElement: true
    timeout: 60000
- tapOn:
    id: use-my-location
- extendedWaitUntil:
    visible: Allow Once
    timeout: 15000
- scrollUntilVisible:
    element: Allow Once
    centerElement: false
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/24-location-purpose
- tapOn: Allow Once
- scrollUntilVisible:
    element:
      id: seat-location-row
    centerElement: true
    timeout: 300000
- assertVisible:
    id: location-suggestion
- assertVisible: From your location
- assertVisible: Based on the 2025 boundaries.*
- takeScreenshot: ${EVIDENCE}/24-suggestion
- tapOn:
    id: seat-location-row
- extendedWaitUntil:
    notVisible:
      id: seat-sheet
    timeout: 10000
- tapOn:
    id: tab-your-mp
- extendedWaitUntil:
    visible:
      id: your-seat-name
    timeout: 30000
- assertVisible: Grayndler.*
- scrollUntilVisible:
    element:
      id: your-electorate
    centerElement: true
    timeout: 300000
- tapOn:
    id: your-electorate
- scrollUntilVisible:
    element:
      id: electorate-outline-drawn-pixels-[1-9][0-9]*
    centerElement: true
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/24-native-outline
# One source line under the outline: the boundary and who drew it; "not for
# address allocation" and the original are in its sheet (pass 5, P2-7).
- scrollUntilVisible:
    element:
      id: outline-source
    centerElement: true
    timeout: 300000
- assertVisible: .*2025 election boundary.*
- takeScreenshot: ${EVIDENCE}/24-vintage
- tapOn:
    id: outline-source
- assertVisible: Not for address allocation.*
- takeScreenshot: ${EVIDENCE}/24-allocation-warning
- tapOn: .*Electorate boundary.*
- assertVisible: https://www.aec.gov.au/Electorates/files/2025/AUS-March-2025-esri.zip
- takeScreenshot: ${EVIDENCE}/24-source
- tapOn: OK
