appId: au.com.opax.app
name: 24 Electorate outline and on-device location suggestion
---
# Harness sets a Grayndler simulated fix; launch resets location permission.
- launchApp:
    clearState: true
    permissions:
      location: unset
- tapOn:
    id: tab-your-mp
- scrollUntilVisible:
    element:
      id: use-my-location
    direction: UP
    centerElement: true
    timeout: 300000
- tapOn:
    id: use-my-location
- extendedWaitUntil:
    visible: Allow Once
    timeout: 15000
- scrollUntilVisible:
    element: Allow Once
    centerElement: false
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/24-location-purpose
- tapOn: Allow Once
- scrollUntilVisible:
    element:
      id: location-confirm
    centerElement: true
    timeout: 300000
- scrollUntilVisible:
    element:
      id: location-suggestion
    # At AX5, centering Confirm has scrolled the preceding message above it.
    direction: UP
    centerElement: true
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/24-suggestion
- scrollUntilVisible:
    element:
      id: location-confirm
    centerElement: true
    timeout: 300000
- tapOn:
    id: location-confirm
- extendedWaitUntil:
    visible:
      id: your-seat-name
    timeout: 30000
- assertVisible: Grayndler
- scrollUntilVisible:
    element:
      id: your-electorate
    centerElement: true
    timeout: 300000
- tapOn:
    id: your-electorate
- scrollUntilVisible:
    element:
      id: electorate-outline-drawn-pixels-[1-9][0-9]*
    centerElement: true
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/24-native-outline
# One source line under the outline: the boundary and who drew it; "not for
# address allocation" and the original are in its sheet (pass 5, P2-7).
- scrollUntilVisible:
    element:
      id: outline-source
    centerElement: true
    timeout: 300000
- assertVisible: .*2025 election boundary.*
- takeScreenshot: ${EVIDENCE}/24-vintage
- tapOn:
    id: outline-source
- assertVisible: Not for address allocation.*
- takeScreenshot: ${EVIDENCE}/24-allocation-warning
- tapOn: .*Electorate boundary.*
- assertVisible: https://www.aec.gov.au/Electorates/files/2025/AUS-March-2025-esri.zip
- takeScreenshot: ${EVIDENCE}/24-source
- tapOn: OK
