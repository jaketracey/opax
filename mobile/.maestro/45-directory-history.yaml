appId: au.com.opax.app
name: 45 Electorates, dated representation, bill filters and Votes in parliament
---
- launchApp
- tapOn:
    id: tab-search
- scrollUntilVisible:
    element:
      id: search-browse-electorate
    centerElement: true
    speed: 20
    timeout: 180000
- tapOn:
    id: search-browse-electorate
- extendedWaitUntil:
    visible:
      id: directory-electorate-screen
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/45-electorates-directory
- tapOn:
    text: Electorate, member or state
- inputText: Grayndler
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: directory-electorate-federal-representatives-nsw-grayndler
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/45-electorate-row
- tapOn:
    id: directory-electorate-federal-representatives-nsw-grayndler
- extendedWaitUntil:
    visible:
      id: electorate-name
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/45-native-seat
# Pin the calendar's displayed month, then choose the next day natively.
- openLink: opax://electorate/federal-representatives-nsw-grayndler?asof=2024-01-01
- runFlow:
    file: support/open-more.yaml
    env:
      NAME: Grayndler
- tapOn: View on a date
- assertVisible:
    id: electorate-date-sheet
- assertVisible:
    id: electorate-date-picker
- takeScreenshot: ${EVIDENCE}/45-native-date-picker
- tapOn: '2|Tuesday, 2 January.*'
- tapOn: Done
- scrollUntilVisible:
    element:
      text: Representation on 2 January 2024
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/45-dated-representation
- tapOn: Share Grayndler
- scrollUntilVisible:
    element:
      text: https://opax.invalid/subject/electorate/federal-representatives-nsw-grayndler\?asof=2024-01-02
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/45-dated-share
- tapOn: OK
- scrollUntilVisible:
    element:
      text: Representation history
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/45-representation-history
- tapOn:
    id: tab-bills
- extendedWaitUntil:
    visible:
      id: bills-count
    timeout: 30000
# Filters is the bar's own button; the shared sheet applies each change as
# it is made, and Done only closes it.
- tapOn: Filters.*
- extendedWaitUntil:
    visible:
      id: filters-screen
    timeout: 30000
- tapOn:
    id: filters-row-parliament
- extendedWaitUntil:
    visible:
      id: filters-facet-screen
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/45-bill-parliaments
- scrollUntilVisible:
    element:
      id: filters-choice-48
    centerElement: true
    speed: 20
    timeout: 180000
- tapOn:
    id: filters-choice-48
- scrollUntilVisible:
    element:
      id: filters-row-divided
    centerElement: true
    speed: 20
    timeout: 180000
- tapOn:
    id: filters-row-divided
- scrollUntilVisible:
    element:
      id: filters-row-sort
    centerElement: true
    speed: 20
    timeout: 180000
- tapOn:
    id: filters-row-sort
- extendedWaitUntil:
    visible:
      id: filters-choice-divisions
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/45-bill-sorts
- tapOn:
    id: filters-choice-divisions
- tapOn: Done
- extendedWaitUntil:
    visible:
      id: bills-clear
    timeout: 30000
- assertVisible:
    id: bills-count
    text: '\d+ of \d+ bills'
- takeScreenshot: ${EVIDENCE}/45-filtered-bills
- tapOn:
    id: bills-clear
# Votes in parliament: one header per bill, its votes inset under it.
- scrollUntilVisible:
    element:
      id: bills-votes
    direction: UP
    centerElement: true
    speed: 20
    timeout: 180000
- tapOn:
    id: bills-votes
- extendedWaitUntil:
    visible:
      id: division-history-count
    timeout: 600000
- takeScreenshot: ${EVIDENCE}/45-division-history
- assertVisible: '[\d,]+ votes'
# Search is the native field in the bar, named by its placeholder.
- tapOn: Bill names
- inputText: Interactive Gambling
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: division-history-au-federal-r7534-.*
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/45-division-row
# A time-limited vote names what was decided, with the time limit on its
# chamber/date line; the bill still heads the run.
- assertVisible:
    id: division-history-au-federal-r7534-.*
    text: '(Amendments?|Second reading|Third reading|Remaining stages|Clauses as printed), Senate · 19 Aug 2026 · under a time limit, (Agreed to|Not agreed to), .*'
    index: 0
- assertVisible:
    id: division-history-bill-au-federal-r7534
# Leave out procedural votes: substantive decisions under a time limit
# stay, while the procedural Limitation of debate rows leave.
- tapOn: Filters.*
- extendedWaitUntil:
    visible:
      id: filters-screen
    timeout: 30000
- tapOn:
    id: filters-row-procedural
- tapOn: Done
- extendedWaitUntil:
    visible:
      id: division-history-count
    timeout: 30000
- assertNotVisible: 'Limitation of debate, .*'
- assertVisible: Filters, 1 on
- takeScreenshot: ${EVIDENCE}/45-division-history-filtered
- scrollUntilVisible:
    element:
      id: division-history-source
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
# The vote opens its bill at that vote, expanded; no "Bill divisions" step.
- scrollUntilVisible:
    element:
      id: division-history-au-federal-r7534-0
    direction: UP
    visibilityPercentage: 10
    centerElement: true
    timeout: 60000
- tapOn:
    id: division-history-au-federal-r7534-0
- extendedWaitUntil:
    visible:
      id: bill-screen
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: bill-division-.*-body
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/45-native-bill-vote
