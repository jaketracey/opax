appId: au.com.opax.app
name: 44 Native people and parties directories
---
- launchApp
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-search
- scrollUntilVisible:
    element:
      id: search-browse-person
    centerElement: true
    speed: 20
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/44-search-browse
- tapOn:
    id: search-browse-person
# The list draws its first section at once; the count is the list's foot.
- extendedWaitUntil:
    visible:
      id: directory-group-sitting
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/44-people-directory
# Filters is a bar item, reached by its accessibility label.
- tapOn: Filters
- extendedWaitUntil:
    visible:
      id: filters-screen
    timeout: 10000
- tapOn:
    id: filters-row-party
- scrollUntilVisible:
    element:
      id: filters-choice-Labor
    centerElement: true
    speed: 20
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/44-party-choices
- tapOn:
    id: filters-choice-Labor
- tapOn:
    id: filters-row-chamber
- scrollUntilVisible:
    element:
      id: filters-choice-representatives
    centerElement: true
    speed: 20
    timeout: 180000
- tapOn:
    id: filters-choice-representatives
- scrollUntilVisible:
    element:
      id: filters-row-sort
    centerElement: true
    speed: 20
    timeout: 180000
- tapOn:
    id: filters-row-sort
- takeScreenshot: ${EVIDENCE}/44-sorts
- tapOn:
    id: filters-choice-name
- takeScreenshot: ${EVIDENCE}/44-people-filters
- tapOn: Done
# The native search field has no ID: tap its placeholder.
- tapOn: Name, electorate or state
- inputText: Anthony Albanese
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: directory-person-anthony-albanese
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- waitForAnimationToEnd
- assertVisible:
    id: directory-person-anthony-albanese
    text: Anthony Albanese, Labor.*
- takeScreenshot: ${EVIDENCE}/44-filtered-person-row
- tapOn:
    id: directory-person-anthony-albanese
- extendedWaitUntil:
    visible:
      id: person-screen-title
    timeout: 30000
- assertVisible: Anthony Albanese
- takeScreenshot: ${EVIDENCE}/44-native-person
- tapOn: Parliamentarians
- tapOn:
    text: Search
    index: 0
- scrollUntilVisible:
    element:
      id: search-browse-party
    centerElement: true
    speed: 20
    timeout: 180000
- tapOn:
    id: search-browse-party
- extendedWaitUntil:
    visible:
      id: directory-party-screen
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/44-parties-directory
- tapOn: Party name
- inputText: Labor
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: directory-party-labor
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/44-party-row
- tapOn:
    id: directory-party-labor
- extendedWaitUntil:
    visible:
      id: party-title
    timeout: 30000
- assertVisible: Labor
- takeScreenshot: ${EVIDENCE}/44-native-party
