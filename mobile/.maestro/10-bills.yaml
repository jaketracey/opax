appId: au.com.opax.app
name: 10 Filter and search the bill list, then open a bill
---
# No clearState: a relaunch resets the list's filters, and offline journey
# 04 reads the records earlier journeys saved.
#
# scrollUntilVisible always swipes from the centre of the screen. A speed-70
# swipe moves about 0.8 of a screen and can carry a tall AX5 element past a
# full-visibility check, so whole-element checks and tap targets use speed 20
# (about half a screen per swipe).
- launchApp
- tapOn:
    id: tab-bills
- extendedWaitUntil:
    visible:
      id: bills-count
    timeout: 20000
# Every count comes from the pinned index (generated 29 September 2026). The
# list opens on Before parliament; the scope is a segmented control, or a
# "Showing" menu row at accessibility sizes.
- assertVisible:
    id: bills-count
    text: 119 bills
- assertVisible:
    id: bills-scope
- takeScreenshot: ${EVIDENCE}/10-list
# Filters is the bar's own button. The shared sheet applies each change as
# it is made; Done only closes it.
- tapOn: Filters.*
- extendedWaitUntil:
    visible:
      id: filters-screen
    timeout: 10000
- takeScreenshot: ${EVIDENCE}/10-filters
- tapOn:
    id: filters-row-chamber
- extendedWaitUntil:
    visible:
      id: filters-facet-screen
    timeout: 10000
- tapOn:
    id: filters-choice-representatives
- extendedWaitUntil:
    visible:
      id: filters-result
    timeout: 10000
- tapOn: Done
- extendedWaitUntil:
    visible:
      id: bills-clear
    timeout: 10000
- assertVisible:
    id: bills-count
    text: '\d+ of 119 bills'
- takeScreenshot: ${EVIDENCE}/10-filtered
- tapOn:
    id: bills-clear
- extendedWaitUntil:
    visible:
      id: bills-count
      text: 119 bills
    timeout: 10000
# Search is the native field in the bar, named by its placeholder.
- tapOn: Search bills
- inputText: child support social services
# Return submits and dismisses the keyboard; a swipe can land on the
# keyboard itself at AX5.
- pressKey: Enter
# The only result is below the fold at AX5, and taller than the screen
# (about 1,500pt). It counts as found once part of it shows, then is centred.
# Maestro taps the row's centre and accepts any centre above 0.7 of the
# screen: a speed-70 swipe carried it to y=2, and that tap hit the status bar
# (scrolling the list back to the top). Half-screen swipes stop with the
# centre on screen, below the navigation bar.
- scrollUntilVisible:
    element:
      id: bill-row-au-federal-r7549
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/10-search
- tapOn:
    id: bill-row-au-federal-r7549
- extendedWaitUntil:
    visible:
      id: bill-screen
    timeout: 15000
# Let the cold skeleton crossfade finish before the first content check.
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/10-bill
# The status names its event, never the status word beside a bare date.
- scrollUntilVisible:
    element:
      id: bill-status
    direction: DOWN
    speed: 20
    timeout: 180000
- assertVisible:
    id: bill-status
    text: 'Status: Before parliament\. Introduced, 17 September 2026'
# One meta line: introduced date and chamber; the portfolio has its own line.
- scrollUntilVisible:
    element:
      id: bill-introduced
      text: Introduced 17 Sep 2026 · House of Representatives
    direction: DOWN
    speed: 20
    timeout: 180000
- assertVisible:
    id: bill-portfolio
    text: Social Services portfolio
# Introduced and second reading on one day: one date, both stages under it.
- scrollUntilVisible:
    element:
      id: bill-date-0
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- assertVisible: '17 September 2026: Introduced · House of Representatives; Second reading · House of Representatives'
- assertNotVisible:
    id: bill-date-1
- takeScreenshot: ${EVIDENCE}/10-one-day
# Share is in the bottom toolbar and uses the canonical web path; e2e
# carries a non-resolving origin.
- tapOn: Share
# At AX5 the alert's title pushes the link below its fold: scroll to it.
- scrollUntilVisible:
    element:
      text: https://opax.invalid/bill/au-federal-r7549
    direction: DOWN
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/10-share
- tapOn: OK
