appId: au.com.opax.app
name: 10 Filter and search the bill list, then open a bill
---
# No clearState: a relaunch resets the list's filters, and offline journey
# 04 reads the records earlier journeys saved.
#
# scrollUntilVisible always swipes from the centre of the screen. A speed-70
# swipe moves about 0.8 of a screen and can carry a tall AX5 element past a
# full-visibility check, so whole-element checks and tap targets use speed 20
# (about half a screen per swipe).
- launchApp
- tapOn:
    id: tab-bills
- extendedWaitUntil:
    visible:
      id: bills-count
    timeout: 20000
# Every count comes from the pinned index (generated 29 September 2026).
- assertVisible: 2,989 bills · latest activity first
- takeScreenshot: ${EVIDENCE}/10-list
- tapOn:
    id: bills-filters
# Centre the option before tapping it, so the tap lands on the option.
- scrollUntilVisible:
    element:
      id: bill-filter-status-before_parliament
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 180000
- assertVisible: Before parliament, 119 bills
- takeScreenshot: ${EVIDENCE}/10-filters
- waitForAnimationToEnd
- tapOn:
    id: bill-filter-status-before_parliament
- tapOn: Done
- extendedWaitUntil:
    visible:
      id: bills-chip-status
    timeout: 10000
- assertVisible: Remove the status filter, Before parliament
- scrollUntilVisible:
    element:
      id: bills-count
    direction: DOWN
    speed: 20
    timeout: 180000
- assertVisible: 119 of 2,989 bills · latest activity first
- takeScreenshot: ${EVIDENCE}/10-filtered
- scrollUntilVisible:
    element:
      id: bills-search
    direction: UP
    speed: 70
    timeout: 180000
- tapOn:
    id: bills-search
- inputText: child support social services
# Return submits and dismisses the keyboard; a swipe can land on the
# keyboard itself at AX5.
- pressKey: Enter
# The only result is below the fold at AX5, and taller than the screen
# (about 1,500pt). It counts as found once part of it shows, then is centred.
# Maestro taps the row's centre and accepts any centre above 0.7 of the
# screen: a speed-70 swipe carried it to y=2, and that tap hit the status bar
# (scrolling the list back to the top). Half-screen swipes stop with the
# centre on screen, below the navigation bar.
- scrollUntilVisible:
    element:
      id: bill-row-au-federal-r7549
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/10-search
- tapOn:
    id: bill-row-au-federal-r7549
- extendedWaitUntil:
    visible:
      id: bill-screen
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/10-bill
- scrollUntilVisible:
    element:
      id: bill-status
    direction: DOWN
    speed: 20
    timeout: 180000
- assertVisible: Before parliament, as at 17 September 2026
- scrollUntilVisible:
    element:
      text: Introduced 17 September 2026 in the House of Representatives
    direction: DOWN
    speed: 20
    timeout: 180000
# Introduced and second reading on one day: one date, both stages under it.
- scrollUntilVisible:
    element:
      id: bill-date-0
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- assertVisible: '17 September 2026: Introduced · House of Representatives; Second reading · House of Representatives'
- assertNotVisible:
    id: bill-date-1
- takeScreenshot: ${EVIDENCE}/10-one-day
# Share uses the canonical web path; e2e carries a non-resolving origin.
- tapOn: Share Child Support and Family Assistance Legislation Amendment .*
# At AX5 the alert's title pushes the link below its fold: scroll to it.
- scrollUntilVisible:
    element:
      text: https://opax.invalid/bill/au-federal-r7549
    direction: DOWN
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/10-share
- tapOn: OK
