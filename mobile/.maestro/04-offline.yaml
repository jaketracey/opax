      id: search-cache-state
- assertVisible: Offline · Saved .*
- scrollUntilVisible:
    element:
      id: search-result-anthony-albanese
- takeScreenshot: ${EVIDENCE}/04-offline-search
- tapOn:
    id: search-result-anthony-albanese
- scrollUntilVisible:
    element:
      id: person-party
- scrollUntilVisible:
    element:
      id: person-electorate
- assertVisible: Grayndler
- takeScreenshot: ${EVIDENCE}/04-offline-profile
