appId: au.com.opax.app
name: 04 Read previously saved records with the fixture stopped
---
- launchApp
- tapOn:
    id: tab-search
- scrollUntilVisible:
    element:
      id: search-input
- tapOn:
    id: search-input
- eraseText
- inputText: Anthony Albanese
# Return submits and dismisses the keyboard; a swipe can land on the
# keyboard itself at AX5.
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: search-submit
- tapOn:
    id: search-submit
- scrollUntilVisible:
    element:
      id: search-cache-state
- assertVisible: Saved .* It may be out of date\.
- assertVisible:
    id: search-offline
- scrollUntilVisible:
    element:
      id: search-result-anthony-albanese
- takeScreenshot: ${EVIDENCE}/04-offline-search
- tapOn:
    id: search-result-anthony-albanese
- scrollUntilVisible:
    element:
      id: person-party
- scrollUntilVisible:
    element:
      id: person-electorate
- assertVisible: Grayndler
- takeScreenshot: ${EVIDENCE}/04-offline-profile
