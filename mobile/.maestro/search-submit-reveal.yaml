appId: au.com.opax.app
---
# After the keyboard's Search key: the results' count line is on screen
# and the keyboard has gone (journeys/search.md 3.4).
- extendedWaitUntil:
    visible: '.*"results":true.*'
    timeout: 30000
- waitForAnimationToEnd
- copyTextFrom:
    id: search-geometry
- evalScript: ${output.submitGeometry = JSON.parse(maestro.copiedText)}
- assertTrue:
    condition: ${output.submitGeometry.results && output.submitGeometry.keyboardHeight == 0}
    label: The Search key submits and puts the keyboard away
