    centerElement: true
    timeout: 60000
- scrollUntilVisible:
    element:
      id: quiz-number
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: quiz-number
- inputText: '929297'
- swipe:
    start: 90%,45%
    end: 90%,30%
    duration: 500
- scrollUntilVisible:
    element:
      id: quiz-confirm
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: quiz-confirm
- scrollUntilVisible:
