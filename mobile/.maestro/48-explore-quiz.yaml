appId: au.com.opax.app
name: 48 Record quiz, eight questions, copied result and saved streak
---
- launchApp:
    permissions: {}
- openLink: opax://explore
- assertVisible:
    id: explore-screen
- takeScreenshot: ${EVIDENCE}/48-explore
- tapOn:
    id: explore-quiz
- assertVisible:
