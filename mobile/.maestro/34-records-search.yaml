appId: au.com.opax.app
name: 34 Speeches, filters, sort, cited summary and the results' sources
---
# Speeches is the one scope with Filters and More (Sort, Share) in the bar
# (journeys/search.md 3.5). A change in the Filters sheet is one request and
# shows as one filter line with Clear; Summarise is tap only and cited.
- launchApp:
    clearState: true
    permissions: {}
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-search
- takeScreenshot: ${EVIDENCE}/34-search-form
- runFlow:
    file: support/search-query.yaml
    env:
      QUERY: housing
      PREFIX: 34
- pressKey: Enter
- runFlow:
    file: support/search-scope.yaml
    env:
      SCOPE: Speeches
- scrollUntilVisible:
    element:
      id: search-count
    direction: DOWN
    visibilityPercentage: 1
    speed: 20
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/34-records
- tapOn: ^Filters.*
- extendedWaitUntil:
    visible:
      id: filters-screen
    timeout: 10000
- takeScreenshot: ${EVIDENCE}/34-filters
- scrollUntilVisible:
    element:
      id: filters-years-from
    centerElement: true
    timeout: 90000
- tapOn:
    id: filters-years-from
- tapOn: ^2025$
- tapOn:
    id: filters-years-to
- tapOn: ^2026$
- scrollUntilVisible:
    element:
      id: filters-row-party
    direction: UP
    centerElement: true
    timeout: 90000
- tapOn:
    id: filters-row-party
- extendedWaitUntil:
    visible:
      id: filters-facet-screen
    timeout: 10000
- scrollUntilVisible:
    element:
      id: filters-choice-Labor
    centerElement: true
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/34-party-choices
# A single choice goes back to the sheet by itself.
- tapOn:
    id: filters-choice-Labor
- extendedWaitUntil:
    visible:
      id: filters-screen
    timeout: 10000
- scrollUntilVisible:
    element:
      id: filters-result
    centerElement: true
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/34-filters-set
- tapOn: Done
- extendedWaitUntil:
    notVisible:
      id: filters-screen
    timeout: 10000
- scrollUntilVisible:
    element:
      id: results-filter-summary
    direction: UP
    centerElement: true
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/34-applied-filters
# All's Speeches group shows the same filtered rows, so it carries the same
# line (specs/search.md 2.6.3 item 3, 2.16). Back to Speeches for Sort.
- runFlow:
    file: support/search-scope.yaml
    env:
      SCOPE: All
- scrollUntilVisible:
    element:
      id: search-group-speeches-filters
    direction: DOWN
    centerElement: true
    timeout: 90000
- assertVisible:
    id: search-group-speeches-filters
    text: .*Labor.*
- takeScreenshot: ${EVIDENCE}/34-all-speeches-filters
- runFlow:
    file: support/search-scope.yaml
    env:
      SCOPE: Speeches
# Sort lives in the bar's More menu on Speeches.
- tapOn: More
- tapOn: Sort
- takeScreenshot: ${EVIDENCE}/34-sorts
- tapOn: Newest first
- scrollUntilVisible:
    element:
      id: records-result-0
    centerElement: true
    visibilityPercentage: 10
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/34-result-row
- tapOn:
    id: records-result-0
- extendedWaitUntil:
    visible:
      id: doc-title
    timeout: 20000
- assertVisible:
    id: doc-reader
- takeScreenshot: ${EVIDENCE}/34-native-record
- tapOn: { id: BackButton }
- extendedWaitUntil:
    notVisible:
      id: doc-reader
    timeout: 10000
- assertNotVisible:
    id: filters-screen
# Summarise sits after the third result (pass 5, P1-1) and is tap only.
- assertNotVisible:
    id: records-summary-machine
- scrollUntilVisible:
    element:
      id: results-summarise
    direction: DOWN
    centerElement: true
    timeout: 90000
- tapOn:
    id: results-summarise
- scrollUntilVisible:
    element:
      id: records-summary-machine
    centerElement: true
    visibilityPercentage: 10
    timeout: 90000
- assertVisible:
    id: summary-scope-line
- takeScreenshot: ${EVIDENCE}/34-summary
- scrollUntilVisible:
    element:
      id: records-citation-1
    centerElement: true
    visibilityPercentage: 10
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/34-summary-citation
- tapOn:
    id: records-citation-1
- extendedWaitUntil:
    visible:
      id: doc-title
    timeout: 20000
- takeScreenshot: ${EVIDENCE}/34-citation-native-record
- tapOn: { id: BackButton }
- extendedWaitUntil:
    notVisible:
      id: doc-reader
    timeout: 10000
# The results' one source line is the count line: the notes, coverage and
# originals open from it.
- scrollUntilVisible:
    element:
      id: search-count
    direction: UP
    centerElement: true
    timeout: 90000
- tapOn:
    id: search-count
- extendedWaitUntil:
    visible:
      id: search-sources
    timeout: 10000
- takeScreenshot: ${EVIDENCE}/34-result-notes
- tapOn:
    text: Done
    retryTapIfNoChange: false
- extendedWaitUntil:
    notVisible:
      id: search-sources
    timeout: 10000
# Clear on the filter line goes back to the unfiltered list, from the
# session cache.
- scrollUntilVisible:
    element:
      id: results-filter-clear
    direction: UP
    centerElement: true
    timeout: 90000
- tapOn:
    id: results-filter-clear
    retryTapIfNoChange: false
- extendedWaitUntil:
    notVisible:
      id: results-filter-summary
    timeout: 10000
- assertNotVisible:
    id: filters-screen
- takeScreenshot: ${EVIDENCE}/34-cleared-filters
