appId: au.com.opax.app
name: 58 Ask asks for consent once before the first question; Not now keeps the draft; Report this answer opens Mail or offers Copy report
---
# App Review 5.1.2(i): nothing goes to the third-party AI before the reader
# agrees, once. The consent sheet fits its content and has no Done or close.
- launchApp:
    permissions:
      all: unset
    clearState: true
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-ask
- assertVisible:
    id: ask-screen
- tapOn:
    id: ask-question
- inputText: Who spoke on the interactive gambling levy bill?
- tapOn:
    id: ask-submit
    enabled: true
- extendedWaitUntil:
    visible:
      id: ask-consent
    timeout: 15000
- assertVisible:
    id: ask-consent-what
- assertVisible: .*Progress Agentic RAG.*OpenRouter.*
- assertNotVisible: Done
- takeScreenshot: ${EVIDENCE}/58-consent
# At AX5 the words fill the sheet: scroll to the pill and to each button.
- scrollUntilVisible:
    element:
      id: ask-consent-machine
    timeout: 60000
- scrollUntilVisible:
    element:
      id: ask-consent-continue
    timeout: 60000
- scrollUntilVisible:
    element:
      id: ask-consent-not-now
    timeout: 60000
- takeScreenshot: ${EVIDENCE}/58-consent-actions
# Not now: nothing is sent and the question stays in the composer.
- tapOn:
    id: ask-consent-not-now
- extendedWaitUntil:
    notVisible:
      id: ask-consent
    timeout: 15000
- assertVisible:
    id: ask-question
    text: Who spoke on the interactive gambling levy bill\?
- assertNotVisible:
    id: ask-user-question
- assertNotVisible:
    id: ask-status
- takeScreenshot: ${EVIDENCE}/58-not-now
# Again, then Continue: the held question is sent.
- tapOn:
    id: ask-submit
    enabled: true
- runFlow: support/ask-consent.yaml
- scrollUntilVisible:
    element:
      id: ask-machine-label
    direction: DOWN
    centerElement: true
    visibilityPercentage: 10
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/58-answer
# Report a problem, under the answer's one ⋯ (an @expo/ui Menu).
- scrollUntilVisible:
    element:
      id: ask-answer-menu
    direction: DOWN
    centerElement: true
    timeout: 180000
- tapOn:
    id: ask-answer-menu
- extendedWaitUntil:
    visible: Report a problem
    timeout: 15000
- assertVisible: Copy answer
- assertVisible: Share question
- takeScreenshot: ${EVIDENCE}/58-report-menu
- tapOn: Report a problem
- extendedWaitUntil:
    visible:
      id: ask-report-sheet
    timeout: 15000
- assertVisible: Report this answer
- tapOn:
    id: ask-report-reason-0
- takeScreenshot: ${EVIDENCE}/58-report-sheet
# Email opens Mail; a simulator without Mail says so and offers Copy report.
- tapOn: Email
- runFlow:
    when:
      visible:
        id: ask-report-no-mail
    commands:
      - assertVisible: No email app is set up\.
      - tapOn:
          id: ask-report-copy
      - takeScreenshot: ${EVIDENCE}/58-report-no-mail
      - tapOn: Cancel
- runFlow:
    when:
      notVisible:
        id: ask-screen
    commands:
      - launchApp:
          permissions:
            all: unset
      - runFlow: support/launch-ready.yaml
      - tapOn:
          id: tab-ask
      - runFlow: support/ask-open-conversations.yaml
      - tapOn: Who spoke on the interactive gambling levy bill\?.*
# Consent is asked once: the next question goes straight through.
- tapOn:
    id: ask-question
- inputText: What else was discussed?
- tapOn:
    id: ask-submit
    enabled: true
- scrollUntilVisible:
    element:
      id: ask-user-question
      text: What else was discussed\?
    direction: DOWN
    centerElement: true
    visibilityPercentage: 10
    timeout: 90000
- assertNotVisible:
    id: ask-consent
- takeScreenshot: ${EVIDENCE}/58-second-question
