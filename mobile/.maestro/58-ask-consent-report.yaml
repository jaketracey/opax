appId: au.com.opax.app
name: 58 Ask asks for consent once before the first question; Not now keeps the draft; Report this answer opens the support page
---
# App Review 5.1.2(i): nothing goes to the third-party AI before the reader
# agrees, once. Report this answer is Talk's report path: OPAX's support page
# in the in-app browser (the e2e build shows its address locally).
- launchApp:
    permissions:
      all: unset
    clearState: true
- tapOn:
    id: tab-ask
- assertVisible:
    id: ask-screen
- tapOn:
    id: ask-question
- inputText: Who spoke on the interactive gambling levy bill?
- scrollUntilVisible:
    element:
      id: ask-submit
    centerElement: true
    timeout: 60000
- tapOn:
    id: ask-submit
    enabled: true
- extendedWaitUntil:
    visible:
      id: ask-consent
    timeout: 15000
- assertVisible:
    id: ask-consent-what
- assertVisible:
    id: ask-consent-machine
- takeScreenshot: ${EVIDENCE}/58-consent
- scrollUntilVisible:
    element:
      id: ask-consent-not-now
    timeout: 60000
- assertVisible:
    id: ask-consent-continue
- takeScreenshot: ${EVIDENCE}/58-consent-actions
# Not now: nothing is sent and the question stays in the composer.
- tapOn:
    id: ask-consent-not-now
- extendedWaitUntil:
    notVisible:
      id: ask-consent
    timeout: 15000
- assertVisible:
    id: ask-question
- assertVisible: Who spoke on the interactive gambling levy bill\?
- assertNotVisible:
    id: ask-user-question
- assertNotVisible:
    id: ask-stages
- takeScreenshot: ${EVIDENCE}/58-not-now
# Again, then Continue: the held question is sent.
- scrollUntilVisible:
    element:
      id: ask-submit
    centerElement: true
    timeout: 60000
- tapOn:
    id: ask-submit
    enabled: true
- runFlow: support/ask-consent.yaml
- scrollUntilVisible:
    element:
      id: ask-machine-label
    direction: DOWN
    centerElement: true
    visibilityPercentage: 10
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/58-answer
# Report this answer, under the answer's ⋯.
- scrollUntilVisible:
    element:
      id: ask-answer-more
    direction: DOWN
    centerElement: true
    timeout: 180000
- tapOn:
    id: ask-answer-more
- extendedWaitUntil:
    visible: Report this answer
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/58-report-menu
- tapOn: Report this answer
- extendedWaitUntil:
    visible:
      id: source-destination-url
    timeout: 15000
- assertVisible:
    id: source-destination-url
    text: '^https://opax\.invalid/support$'
- takeScreenshot: ${EVIDENCE}/58-report-support
- tapOn: OK
- scrollUntilVisible:
    element:
      id: ask-report-thanks
    direction: DOWN
    centerElement: true
    visibilityPercentage: 10
    timeout: 90000
- assertVisible: Thanks\. We.ll look at this answer\.
- takeScreenshot: ${EVIDENCE}/58-report-thanks
# Consent is asked once: the next question goes straight through.
- scrollUntilVisible:
    element:
      id: ask-followup-field
    centerElement: true
    speed: 20
    timeout: 90000
- tapOn:
    id: ask-followup-field
- inputText: What else was discussed?
- scrollUntilVisible:
    element:
      id: ask-followup-submit
    centerElement: true
    speed: 20
    timeout: 90000
- tapOn:
    id: ask-followup-submit
- scrollUntilVisible:
    element:
      id: ask-user-question
      text: What else was discussed\?
    direction: DOWN
    centerElement: true
    visibilityPercentage: 10
    timeout: 90000
- assertNotVisible:
    id: ask-consent
- takeScreenshot: ${EVIDENCE}/58-second-question
