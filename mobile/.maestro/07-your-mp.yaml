appId: au.com.opax.app
name: 07 Choose an electorate by member name and restore it after relaunch
---
- launchApp:
    clearState: true
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-your-mp
# No seat: the invitation, never the chooser in place.
- extendedWaitUntil:
    visible:
      id: your-invitation
    timeout: 30000
- assertVisible:
    id: your-invitation-find
- assertVisible:
    id: your-invitation-location
- takeScreenshot: ${EVIDENCE}/07-invitation
- tapOn:
    id: your-invitation-find
# The seat chooser's native search field has no test id: it is reached by
# its placeholder.
- extendedWaitUntil:
    visible:
      id: seat-sheet
    timeout: 15000
- tapOn: Electorate or member.s name
- inputText: Albanese
- extendedWaitUntil:
    visible:
      id: seat-row-federal-representatives-nsw-grayndler
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/07-chooser-match
- tapOn:
    id: seat-row-federal-representatives-nsw-grayndler
- extendedWaitUntil:
    visible:
      id: your-seat-name
    timeout: 15000
- assertVisible:
    id: your-seat-name
    text: Grayndler, New South Wales
- takeScreenshot: ${EVIDENCE}/07-seat
- scrollUntilVisible:
    element:
      id: your-member-anthony-albanese
    centerElement: true
    timeout: 300000
    visibilityPercentage: 100
- waitForAnimationToEnd
# The name and party are on the row itself; inspect its drawing in the capture.
- assertVisible:
    id: your-member-anthony-albanese
    text: Anthony Albanese, Labor.*
- assertVisible:
    id: your-profile-votes
- assertVisible:
    id: your-profile-interests
- assertVisible:
    id: your-profile-pay
- assertVisible:
    id: your-senators
- takeScreenshot: ${EVIDENCE}/07-member
- runFlow:
    file: support/open-your-register.yaml
    env:
      REGISTER_PREFIX: '07'
- takeScreenshot: ${EVIDENCE}/07-lately
- runFlow:
    when:
      visible:
        id: your-latest-.*
        text: .*Voted against an amendment.*
    commands:
      - takeScreenshot: ${EVIDENCE}/07-lately-amendment
- scrollUntilVisible:
    element:
      id: your-electorate-source
    centerElement: true
    timeout: 300000
- assertVisible:
    id: your-electorate
- assertVisible:
    id: your-electorate
    text: .*Census 2021.*
- takeScreenshot: ${EVIDENCE}/07-electorate-card
- scrollUntilVisible:
    element:
      id: your-member-anthony-albanese
    direction: UP
    centerElement: true
    visibilityPercentage: 50
    timeout: 300000
- runFlow:
    file: review-pages.yaml
    env:
      END: your-mp-end
      PREFIX: 07-home
- launchApp
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-your-mp
- extendedWaitUntil:
    visible:
      id: your-seat-name
    timeout: 15000
- assertVisible:
    id: your-seat-name
    text: Grayndler, New South Wales
- takeScreenshot: ${EVIDENCE}/07-restored
# Change and no match, through the bar menu and the chooser sheet.
- runFlow:
    file: support/open-more.yaml
    env:
      NAME: Grayndler
- tapOn: Change electorate
- extendedWaitUntil:
    visible:
      id: seat-sheet
    timeout: 15000
- tapOn: Electorate or member.s name
- inputText: No matching electorate
- extendedWaitUntil:
    visible:
      id: seat-no-results
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/07-no-match
# The first Cancel may only end the search; the sheet's Cancel closes it.
# iOS 26 and later draw the active search's Cancel as a round ✕ named
# Close (iOS 27, 14 Nov 2026); Android's prepared copy maps this Cancel.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: Cancel
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: ^(Cancel|Close)$
- runFlow:
    when:
      visible:
        id: seat-sheet
    commands:
      - runFlow:
          when:
            platform: Android
          commands:
            - tapOn: Cancel
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn: ^(Cancel|Close)$
- assertVisible:
    id: your-seat-name
# Forget: the tab returns to the invitation, with no stale member.
- runFlow:
    file: support/open-more.yaml
    env:
      NAME: Grayndler
- tapOn: Forget my electorate
- tapOn: Forget
- extendedWaitUntil:
    visible:
      id: your-invitation
    timeout: 15000
- assertNotVisible:
    id: your-member-anthony-albanese
- takeScreenshot: ${EVIDENCE}/07-forgotten
