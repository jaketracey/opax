appId: au.com.opax.app
name: 07 Choose an electorate by member name and restore it after relaunch
---
- launchApp:
    clearState: true
- tapOn:
    id: tab-your-mp
# No seat: the invitation, never the chooser in place.
- extendedWaitUntil:
    visible:
      id: your-invitation
    timeout: 30000
- assertVisible:
    id: your-invitation-find
- assertVisible:
    id: your-invitation-location
- takeScreenshot: ${EVIDENCE}/07-invitation
- tapOn:
    id: your-invitation-find
- extendedWaitUntil:
    visible:
      id: seat-search
    timeout: 15000
- tapOn:
    id: seat-search
- inputText: Albanese
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: seat-choice-federal-representatives-nsw-grayndler
    centerElement: true
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/07-chooser-match
- tapOn:
    id: seat-choice-federal-representatives-nsw-grayndler
- extendedWaitUntil:
    visible:
      id: your-seat-name
    timeout: 15000
- assertVisible:
    id: your-seat-name
    text: Grayndler, New South Wales
- takeScreenshot: ${EVIDENCE}/07-seat
- scrollUntilVisible:
    element:
      id: your-member-anthony-albanese-name.*
    centerElement: true
    timeout: 300000
    visibilityPercentage: 100
- waitForAnimationToEnd
# The fixture-only ID checks native line bounds, beyond the full AX label.
- assertVisible:
    id: your-member-anthony-albanese-name-drawn-complete-[1-9][0-9]*
    text: Anthony Albanese
- assertVisible:
    id: your-profile-votes
- assertVisible:
    id: your-profile-interests
- assertVisible:
    id: your-profile-pay
- assertVisible:
    id: your-senators
- takeScreenshot: ${EVIDENCE}/07-member
- runFlow:
    file: support/open-your-register.yaml
    env:
      REGISTER_PREFIX: '07'
- takeScreenshot: ${EVIDENCE}/07-lately
- runFlow:
    when:
      visible: Voted against an amendment
    commands:
      - takeScreenshot: ${EVIDENCE}/07-lately-amendment
- scrollUntilVisible:
    element:
      id: your-electorate-source
    centerElement: true
    timeout: 300000
- assertVisible:
    id: your-electorate
- assertVisible: Census 2021
- takeScreenshot: ${EVIDENCE}/07-electorate-card
- scrollUntilVisible:
    element:
      id: your-member-anthony-albanese
    direction: UP
    centerElement: true
    visibilityPercentage: 50
    timeout: 300000
- runFlow:
    file: review-pages.yaml
    env:
      END: your-mp-end
      PREFIX: 07-home
- launchApp
- tapOn:
    id: tab-your-mp
- extendedWaitUntil:
    visible:
      id: your-seat-name
    timeout: 15000
- assertVisible:
    id: your-seat-name
    text: Grayndler, New South Wales
- takeScreenshot: ${EVIDENCE}/07-restored
# Change and no match, through the bar menu and the chooser sheet.
- runFlow:
    file: support/open-more.yaml
    env:
      NAME: Grayndler
- tapOn: Change electorate
- extendedWaitUntil:
    visible:
      id: seat-search
    timeout: 15000
- tapOn:
    id: seat-search
- inputText: No matching electorate
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: seat-no-results
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/07-no-match
- tapOn: Cancel
- assertVisible:
    id: your-seat-name
# Forget: the tab returns to the invitation, with no stale member.
- runFlow:
    file: support/open-more.yaml
    env:
      NAME: Grayndler
- tapOn: Forget my electorate
- tapOn: Forget
- extendedWaitUntil:
    visible:
      id: your-invitation
    timeout: 15000
- assertNotVisible:
    id: your-member-anthony-albanese
- takeScreenshot: ${EVIDENCE}/07-forgotten
