appId: au.com.opax.app
name: 07 Choose an electorate by member name and restore it after relaunch
---
- launchApp:
    clearState: true
- tapOn:
    id: tab-your-mp
- assertVisible:
    id: seat-empty
- takeScreenshot: ${EVIDENCE}/07-chooser-empty
- tapOn:
    id: seat-search
- inputText: Albanese
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: seat-choice-federal-representatives-nsw-grayndler
    centerElement: true
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/07-chooser-match
- tapOn:
    id: seat-choice-federal-representatives-nsw-grayndler
- extendedWaitUntil:
    visible:
      id: your-seat-name
    timeout: 15000
- assertVisible: Grayndler
- takeScreenshot: ${EVIDENCE}/07-seat
- scrollUntilVisible:
    element:
      id: your-member-anthony-albanese-name.*
    centerElement: true
    timeout: 300000
    visibilityPercentage: 100
- waitForAnimationToEnd
# The fixture-only ID checks native line bounds, beyond the full AX label.
- assertVisible:
    id: your-member-anthony-albanese-name-drawn-complete-[1-9][0-9]*
    text: Anthony Albanese
- takeScreenshot: ${EVIDENCE}/07-member
- runFlow:
    file: support/open-your-register.yaml
    env:
      REGISTER_PREFIX: '07'
- extendedWaitUntil:
    visible:
      id: your-register-source
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/07-register-open
- scrollUntilVisible:
    element:
      id: your-member-anthony-albanese
    direction: UP
    centerElement: true
    visibilityPercentage: 50
    timeout: 300000
- runFlow:
    file: review-pages.yaml
    env:
      END: your-mp-end
      PREFIX: 07-home
- scrollUntilVisible:
    element:
      id: your-senators-end
    direction: UP
    centerElement: true
    timeout: 300000
- assertVisible:
    id: your-senators-end
- takeScreenshot: ${EVIDENCE}/07-senators
- launchApp
- tapOn:
    id: tab-your-mp
- assertVisible:
    id: your-seat-name
- assertVisible: Grayndler
- takeScreenshot: ${EVIDENCE}/07-restored
- scrollUntilVisible:
    element:
      id: change-seat
    timeout: 300000
    centerElement: true
- tapOn:
    id: change-seat
- scrollUntilVisible:
    element:
      id: seat-search
    direction: UP
    centerElement: true
    timeout: 300000
- tapOn:
    id: seat-search
- inputText: No matching electorate
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: seat-no-results
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/07-no-match
- scrollUntilVisible:
    element: Cancel
    centerElement: true
    timeout: 300000
- tapOn: Cancel
