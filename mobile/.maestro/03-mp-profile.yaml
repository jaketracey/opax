appId: au.com.opax.app
name: 03 Read a sourced profile
---
- runFlow: 02-search.yaml
- scrollUntilVisible:
    element:
      id: person-screen-title
    direction: UP
- takeScreenshot: ${EVIDENCE}/03-person-name
- scrollUntilVisible:
    element:
      id: person-party
- assertVisible:
    id: person-party
- scrollUntilVisible:
    element:
      id: person-electorate
    centerElement: true
# One seat row: "Member for Grayndler" over "New South Wales, since …",
# opening the electorate. Place names, never raw IDs ("federal").
- assertVisible:
    id: person-electorate
    text: Member for Grayndler.*
- assertNotVisible: .*· federal.*
- takeScreenshot: ${EVIDENCE}/03-profile
# The source line is the page's last row, so it never reaches the centre:
# centring spent five more swipes and ran past the 20 s default with the row
# in full view (iOS 18.4/18.6, 14 Nov 2026). Scroll it on screen, then one
# swipe settles the page at its end, where the row sits clear of the tab bar
# for the tap below.
- scrollUntilVisible:
    element:
      id: person-figures-source
    timeout: 60000
- swipe:
    start: 50%, 60%
    end: 50%, 30%
- assertVisible:
    id: person-figures-source
- takeScreenshot: ${EVIDENCE}/03-source
# The strip's source line covers the identity rows and the figures; its
# sheet lists every source with its own date and the original records. Sources open in the in-app browser once the sheet has
# gone; e2e shows the destination locally.
- tapOn:
    id: person-figures-source
- assertVisible: Profile sources
- takeScreenshot: ${EVIDENCE}/03-source-sheet
- tapOn: .*OpenAustralia parliamentary service records.*
- extendedWaitUntil:
    visible:
      id: source-destination-url
      text: https://raw\.githubusercontent\.com/openaustralia/openaustralia-parser/master/data/representatives\.csv
    timeout: 15000
- assertVisible: https://raw.githubusercontent.com/openaustralia/openaustralia-parser/master/data/representatives.csv
- takeScreenshot: ${EVIDENCE}/03-source-destination
# At AX5 the URL runs past the screen. Scroll the page to its end in a bounded
# number of swipes (past the end they only bounce) and keep the tail, drawn in
# full: "representatives.csv", never "representative...".
- repeat:
    times: 4
    commands:
      - swipe:
          from:
            id: source-destination-scroll
          direction: UP
- assertVisible:
    id: source-destination-url
- takeScreenshot: ${EVIDENCE}/03-source-destination-end
- tapOn: Done
# Share uses the canonical web path; e2e carries a non-resolving origin.
- tapOn: Share Anthony Albanese
- assertVisible: https://opax.invalid/subject/person/anthony-albanese
- takeScreenshot: ${EVIDENCE}/03-share
- tapOn: OK
