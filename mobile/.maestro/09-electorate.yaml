appId: au.com.opax.app
name: 09 Electorate representation, elections, Census context and sources
---
- launchApp
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-your-mp
# No seat: the invitation. A saved seat: Change electorate in the bar menu.
- extendedWaitUntil:
    visible:
      id: your-mp-screen
    timeout: 30000
- runFlow:
    when:
      visible:
        id: your-invitation-find
    commands:
      - tapOn:
          id: your-invitation-find
- runFlow:
    when:
      visible:
        id: your-seat-name
    commands:
      - tapOn: 'More for .*'
      - tapOn: Change electorate
# The seat chooser's native search field has no test id: it is reached by
# its placeholder.
- extendedWaitUntil:
    visible:
      id: seat-sheet
    timeout: 15000
- tapOn: Electorate or member.s name
- inputText: Grayndler
- extendedWaitUntil:
    visible:
      id: seat-row-federal-representatives-nsw-grayndler
    timeout: 30000
- tapOn:
    id: seat-row-federal-representatives-nsw-grayndler
- scrollUntilVisible:
    element:
      id: your-electorate
    timeout: 300000
    centerElement: true
- tapOn:
    id: your-electorate
- extendedWaitUntil:
    visible:
      id: electorate-name
    timeout: 15000
# Let the cold skeleton crossfade finish before the first content check.
- waitForAnimationToEnd
- assertVisible: Grayndler
- takeScreenshot: ${EVIDENCE}/09-identity
# The representative is one combined label. Inspect the name in the capture.
- scrollUntilVisible:
    element:
      id: electorate-member-anthony-albanese
    speed: 20
    centerElement: true
    timeout: 180000
- waitForAnimationToEnd
- assertVisible:
    id: electorate-member-anthony-albanese
    text: Anthony Albanese, Labor.*
- takeScreenshot: ${EVIDENCE}/09-representative-name-settled
- scrollUntilVisible:
    element:
      id: election-row-0
    centerElement: true
    timeout: 300000
# The large title has scrolled away; the bar carries the seat's name.
- assertVisible: Grayndler
- takeScreenshot: ${EVIDENCE}/09-bar-title
# The newest election opens its own screen, candidates by first preferences.
- tapOn:
    id: election-row-0
- extendedWaitUntil:
    visible:
      id: election-screen
    timeout: 15000
- assertVisible:
    id: election-candidate-0-elected
    text: Elected
- takeScreenshot: ${EVIDENCE}/09-election-open
- tapOn: { id: BackButton }
- extendedWaitUntil:
    visible:
      id: election-row-0
    timeout: 15000
- runFlow:
    file: review-pages.yaml
    env:
      END: electorate-end
      PREFIX: 09-electorate
# The record's source line is the representation block's (pass 5, P2-7).
- scrollUntilVisible:
    element:
      id: electorate-representatives-source
    direction: UP
    centerElement: true
    timeout: 300000
- tapOn:
    id: electorate-representatives-source
- assertVisible: Sources
- takeScreenshot: ${EVIDENCE}/09-original-records
- tapOn: .*OPAX federal roster reconciled against APH, 2026-09-04.*
- assertVisible: https://www.aph.gov.au/Senators_and_Members
- takeScreenshot: ${EVIDENCE}/09-source
- tapOn: OK
- tapOn: Share Grayndler
- assertVisible: https://opax.invalid/subject/electorate/federal-representatives-nsw-grayndler
- takeScreenshot: ${EVIDENCE}/09-share
- tapOn: OK
