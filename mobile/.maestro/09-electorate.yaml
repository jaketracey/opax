appId: au.com.opax.app
name: 09 Electorate representation, elections, Census context and sources
---
- launchApp
- tapOn:
    id: tab-your-mp
- runFlow:
    when:
      notVisible:
        id: seat-search
    commands:
      - scrollUntilVisible:
          element:
            id: change-seat
          timeout: 300000
          centerElement: true
      - tapOn:
          id: change-seat
- scrollUntilVisible:
    element:
      id: seat-search
    direction: UP
    centerElement: true
    timeout: 300000
- tapOn:
    id: seat-search
- inputText: Grayndler
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: seat-choice-federal-representatives-nsw-grayndler
    centerElement: true
    timeout: 300000
- tapOn:
    id: seat-choice-federal-representatives-nsw-grayndler
- scrollUntilVisible:
    element:
      id: your-electorate
    timeout: 300000
    centerElement: true
- tapOn:
    id: your-electorate
- extendedWaitUntil:
    visible:
      id: electorate-name
    timeout: 15000
- assertVisible: Grayndler
- takeScreenshot: ${EVIDENCE}/09-identity
# Check the name itself before the taller row. Its accessibility label alone
# can contain the full string even when TextKit clips the drawn surname.
- scrollUntilVisible:
    element:
      id: electorate-member-anthony-albanese-name
    speed: 20
    centerElement: true
    timeout: 180000
- waitForAnimationToEnd
- assertVisible:
    id: electorate-member-anthony-albanese-name
    text: Anthony Albanese
- takeScreenshot: ${EVIDENCE}/09-representative-name-settled
- scrollUntilVisible:
    element:
      id: election-expand-0
    centerElement: true
    timeout: 300000
- tapOn:
    id: election-expand-0
- takeScreenshot: ${EVIDENCE}/09-election-open
- runFlow:
    file: review-pages.yaml
    env:
      END: electorate-end
      PREFIX: 09-electorate
- scrollUntilVisible:
    element:
      id: electorate-coverage-source
    direction: UP
    centerElement: true
    timeout: 300000
- tapOn:
    id: electorate-coverage-source
- takeScreenshot: ${EVIDENCE}/09-source
- tapOn: OK
- tapOn: Share Grayndler
- assertVisible: https://opax.invalid/subject/electorate/federal-representatives-nsw-grayndler
- takeScreenshot: ${EVIDENCE}/09-share
- tapOn: OK
