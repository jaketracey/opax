appId: au.com.opax.app
name: 37 Party mentions, creditors, returns, follow and Your MP pay
---
- launchApp:
    clearState: true
    permissions: {}
- runFlow:
    file: support/people-open-profile.yaml
    env:
      NAME: Anthony Albanese
      SLUG: anthony-albanese
- scrollUntilVisible:
    element: { id: person-party }
    direction: UP
    speed: 20
    centerElement: true
    timeout: 180000
- tapOn: { id: person-party }
- extendedWaitUntil:
    visible: { id: party-title }
    timeout: 15000
- assertVisible:
    {
      id: '^people-party-title-ms-([0-9]|[1-9][0-9]|[1-9][0-9][0-9]|1[0-9]{3})$',
    }
- takeScreenshot: ${EVIDENCE}/37-party-title
# Labor has no meetings or lobbyists in the default fixture, so PartyAccess
# deliberately renders nothing. Continue with the records the fixture holds.
# Mentions in parliament is a row of "More from the record"; it pushes the
# paged record list.
- scrollUntilVisible:
    element: { id: party-mentions }
    direction: DOWN
    speed: 20
    centerElement: true
    timeout: 180000
- tapOn: { id: party-mentions }
- extendedWaitUntil:
    visible: { id: record-list-row-0 }
    timeout: 30000
- assertVisible: { id: record-list-screen }
- takeScreenshot: ${EVIDENCE}/37-party-mentions
- tapOn: { id: BackButton }
- scrollUntilVisible:
    element: { id: party-debts }
    direction: UP
    speed: 40
    visibilityPercentage: 10
    centerElement: true
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/37-party-debts
# Every year's return is one chart inside Receipts, its table behind the
# chart's own toggle.
- scrollUntilVisible:
    element: { id: party-returns-chart }
    direction: UP
    speed: 40
    visibilityPercentage: 10
    centerElement: true
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/37-returns-chart
- scrollUntilVisible:
    element: { id: party-follow-off }
    direction: UP
    speed: 70
    centerElement: true
    timeout: 180000
- tapOn: { id: party-follow-off }
- assertVisible: { id: party-follow-on }
- takeScreenshot: ${EVIDENCE}/37-party-followed
- tapOn: { id: tab-today }
- scrollUntilVisible:
    element: { id: today-following-collapsed }
    timeout: 90000
- tapOn: { id: today-following-collapsed }
- assertVisible: { id: follows-row-party-labor }
- takeScreenshot: ${EVIDENCE}/37-following-party
- openLink: opax://seat
- assertVisible: { id: seat-sheet }
- tapOn: Electorate or member.s name
- inputText: Grayndler
- tapOn: { id: seat-row-federal-representatives-nsw-grayndler }
- openLink: opax://your-mp
- assertVisible: { id: your-profile-pay }
- tapOn: { id: your-profile-pay }
- scrollUntilVisible:
    element: { id: person-pay-heading }
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/37-your-mp-pay
- scrollUntilVisible:
    element: { id: person-party-receipts }
    timeout: 90000
- tapOn: { id: person-party-receipts }
# This link anchors the party page at Receipts, below its title.
- extendedWaitUntil:
    visible: { id: party-receipts-heading }
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/37-your-mp-receipts
