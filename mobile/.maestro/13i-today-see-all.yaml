appId: au.com.opax.app
name: 13i Today's Bills See all opens its own list, whose scope never leaks into the Bills tab
---
# specs/bills.md 2.8 (named 13b-today-see-all there). Today's "See all"
# pushes /bill-list inside Today with its own scope: New opens All, newest
# first; Passed opens Passed. The Bills tab keeps its own scope (Before
# parliament by default, "119 bills" in the pinned index) either way.
#
# The scope is a segmented control, or a "Showing" menu row at
# accessibility sizes: each change tries the segment, then the menu.
- launchApp:
    clearState: true
- assertVisible:
    id: today-screen-message
- scrollUntilVisible:
    element:
      text: Passed
    timeout: 90000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- waitForAnimationToEnd
- tapOn:
    text: Passed
- extendedWaitUntil:
    visible:
      id: today-bill-0
    timeout: 30000
- tapOn:
    text: See all passed bills
- extendedWaitUntil:
    visible:
      id: bills-count
    timeout: 30000
- assertVisible:
    id: BackButton
    text: Today
# The list is pushed inside Today. Scrolling Today down to its bills minimises
# the bar, and the pushed page inherits that: Today's own button (no id) is
# then the only tab shown. Either way Today is the selected tab.
- assertVisible:
    text: Today
    selected: true
- takeScreenshot: ${EVIDENCE}/13i-see-all-passed
# Change the pushed list's scope to All.
- runFlow:
    when:
      visible:
        id: bills-scope-all
    commands:
      - tapOn:
          id: bills-scope-all
- runFlow:
    when:
      notVisible:
        id: bills-scope-all
    commands:
      - tapOn:
          id: bills-scope
      - tapOn: All
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/13i-pushed-all
- tapOn:
    id: BackButton
- assertVisible:
    id: today-screen
# The Bills tab is still on Before parliament. Today kept its scroll, so its
# bar is still minimised: bring it back first.
- runFlow:
    file: support/restore-tab-bar.yaml
    env:
      TOP_ID: today-screen-message
      TAB_ID: tab-bills
- tapOn:
    id: tab-bills
- extendedWaitUntil:
    visible:
      id: bills-count
    timeout: 30000
- assertVisible:
    id: bills-count
    text: 119 bills
- takeScreenshot: ${EVIDENCE}/13i-tab-unchanged

# The reverse: the Bills tab on Passed, then Today's New "See all" opens All.
- runFlow:
    when:
      visible:
        id: bills-scope-passed
    commands:
      - tapOn:
          id: bills-scope-passed
- runFlow:
    when:
      notVisible:
        id: bills-scope-passed
    commands:
      - tapOn:
          id: bills-scope
      - tapOn: Passed
- waitForAnimationToEnd
- assertNotVisible:
    id: bills-count
    text: 119 bills
- tapOn:
    id: tab-today
- assertVisible:
    id: today-screen
- scrollUntilVisible:
    element:
      text: Passed
    timeout: 90000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- waitForAnimationToEnd
- tapOn:
    text: New
- extendedWaitUntil:
    visible:
      id: today-bill-0
    timeout: 30000
- tapOn:
    text: See all new bills
- extendedWaitUntil:
    visible:
      id: bills-count
    timeout: 30000
- assertVisible:
    id: BackButton
    text: Today
- assertNotVisible:
    id: bills-count
    text: 119 bills
- takeScreenshot: ${EVIDENCE}/13i-see-all-new
- tapOn:
    id: BackButton
# Back on the Bills tab, Passed is kept.
- runFlow:
    file: support/restore-tab-bar.yaml
    env:
      TOP_ID: today-screen-message
      TAB_ID: tab-bills
- tapOn:
    id: tab-bills
- extendedWaitUntil:
    visible:
      id: bills-count
    timeout: 30000
- assertNotVisible:
    id: bills-count
    text: 119 bills
- takeScreenshot: ${EVIDENCE}/13i-tab-passed-kept
