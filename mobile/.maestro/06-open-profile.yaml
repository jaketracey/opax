appId: au.com.opax.app
name: Open a profile from Search and check its party label (PARTY, never NOT_PARTY)
---
# A fresh launch (state kept) starts with an empty field at the top of
# Search; editing a previous query is unreliable at AX5, where a tap can put
# the cursor mid-text.
- launchApp
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-search
- scrollUntilVisible:
    element:
      text: People, bills, topics and more
- tapOn:
    text: People, bills, topics and more
- inputText: ${NAME}
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: search-result-${SLUG}
- tapOn:
    id: search-result-${SLUG}
- extendedWaitUntil:
    visible:
      id: person-screen-title
    timeout: 15000
# Let the cold skeleton crossfade finish before the first content check.
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: person-party
    centerElement: true
- assertVisible:
    id: person-party
    text: ${PARTY}
- assertNotVisible:
    id: person-party
    text: ${NOT_PARTY}
