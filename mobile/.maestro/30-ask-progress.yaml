appId: au.com.opax.app
name: 30 Ask progress over a production-paced stream, a stages-only wait and an error after the stages, below the header
---
- launchApp:
    permissions:
      all: unset
    clearState: true
- tapOn:
    id: tab-ask
- assertVisible:
    id: ask-screen
# 1. A slow stream: stages arrive over about 25 s, then the text streams in.
- tapOn:
    id: ask-question
- inputText: fixture slow stream
- scrollUntilVisible:
    element:
      id: ask-submit
    centerElement: true
    timeout: 60000
- tapOn:
    id: ask-submit
    enabled: true
# Taps settle for seconds, so wait on states with wide windows, not on a
# particular early stage (the stage-by-stage order is covered in Jest).
- extendedWaitUntil:
    visible:
      id: ask-stages
    timeout: 10000
- runFlow: support/ask-progress-geometry.yaml
- assertVisible:
    id: ask-cancel
- takeScreenshot: ${EVIDENCE}/30-progress-live
- extendedWaitUntil:
    visible:
      id: ask-reading
    timeout: 30000
- runFlow: support/ask-progress-geometry.yaml
- takeScreenshot: ${EVIDENCE}/30-progress-writing
# Text on screen while the stream is still open: the transport delivers
# events incrementally, not the whole body at the end.
- extendedWaitUntil:
    visible:
      id: ask-streaming
    timeout: 30000
- assertVisible:
    id: ask-cancel
- takeScreenshot: ${EVIDENCE}/30-progress-streaming
- extendedWaitUntil:
    visible:
      id: ask-machine-label
    timeout: 60000
- assertNotVisible:
    id: ask-progress
- takeScreenshot: ${EVIDENCE}/30-progress-answer
# 2. Stage events only for a long while (the model is still thinking), asked
# from the top composer under an answered question: build 14 scrolled this
# turn behind the navigation bar and left a lone Cancel on an empty page.
- scrollUntilVisible:
    element:
      id: ask-question
    direction: UP
    centerElement: true
    timeout: 90000
- tapOn:
    id: ask-question
- inputText: fixture stages only
- scrollUntilVisible:
    element:
      id: ask-submit
    centerElement: true
    timeout: 60000
- tapOn:
    id: ask-submit
    enabled: true
- extendedWaitUntil:
    visible:
      id: ask-stage-2-active
    timeout: 40000
- extendedWaitUntil:
    visible:
      id: ask-reading
    timeout: 10000
- runFlow: support/ask-progress-geometry.yaml
- assertNotVisible:
    id: ask-streaming
- assertVisible:
    id: ask-cancel
- takeScreenshot: ${EVIDENCE}/30-progress-stages-only
- extendedWaitUntil:
    visible:
      id: ask-machine-label
    timeout: 90000
# 3. From the follow-up field, the stream errors after the stages: a calm
# error with the question kept and Try again.
- scrollUntilVisible:
    element:
      id: ask-followup-field
    centerElement: true
    speed: 20
    timeout: 90000
- tapOn:
    id: ask-followup-field
- inputText: fixture slow error
- scrollUntilVisible:
    element:
      id: ask-followup-submit
    centerElement: true
    speed: 20
    timeout: 90000
- tapOn:
    id: ask-followup-submit
    enabled: true
- extendedWaitUntil:
    visible:
      id: ask-retry
    timeout: 60000
- runFlow: support/ask-progress-geometry.yaml
- assertVisible: The answer could not be finished\. Try again\..*
- assertVisible:
    id: ask-failed-question
    text: fixture slow error
- takeScreenshot: ${EVIDENCE}/30-progress-error
