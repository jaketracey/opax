appId: au.com.opax.app
name: 30 Ask progress, Stop with and without a draft, Try again and the busy wait, below the header
---
- launchApp:
    permissions:
      all: unset
    clearState: true
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-ask
- assertVisible:
    id: ask-screen
# 1. A slow stream: one status line, then the text streams in.
- tapOn:
    id: ask-question
- inputText: fixture slow stream
- tapOn:
    id: ask-submit
    enabled: true
- runFlow: support/ask-consent.yaml
- extendedWaitUntil:
    visible:
      id: ask-status
    timeout: 10000
- runFlow: support/ask-progress-geometry.yaml
- assertVisible:
    id: ask-stop
- assertNotVisible:
    text: Understanding the question
- takeScreenshot: ${EVIDENCE}/30-progress-live
# Text on screen while the stream is still open: the transport delivers
# events incrementally, not the whole body at the end.
- extendedWaitUntil:
    visible:
      id: ask-streaming
    timeout: 40000
- assertVisible:
    id: ask-stop
- takeScreenshot: ${EVIDENCE}/30-progress-streaming
- extendedWaitUntil:
    visible:
      id: ask-machine-label
    timeout: 60000
- assertNotVisible:
    id: ask-progress
- takeScreenshot: ${EVIDENCE}/30-progress-answer
# 2. Stop with an empty composer: the turn goes and the question comes back.
- tapOn:
    id: ask-question
- inputText: fixture stages only
- tapOn:
    id: ask-submit
    enabled: true
- extendedWaitUntil:
    visible:
      id: ask-status
    timeout: 15000
- runFlow: support/ask-progress-geometry.yaml
- takeScreenshot: ${EVIDENCE}/30-progress-stages-only
- tapOn:
    id: ask-stop
- extendedWaitUntil:
    notVisible:
      id: ask-progress
    timeout: 10000
- assertVisible:
    id: ask-question
    text: fixture stages only
- assertNotVisible:
    id: ask-user-question
    text: fixture stages only
- assertNotVisible:
    id: ask-retry
- takeScreenshot: ${EVIDENCE}/30-progress-stopped-restored
# 3. Stop with a draft typed meanwhile: the turn goes, the draft stays.
- tapOn:
    id: ask-submit
    enabled: true
- extendedWaitUntil:
    visible:
      id: ask-status
    timeout: 15000
- tapOn:
    id: ask-question
- inputText: A draft typed meanwhile
- tapOn:
    id: ask-stop
- extendedWaitUntil:
    notVisible:
      id: ask-progress
    timeout: 10000
- assertVisible:
    id: ask-question
    text: A draft typed meanwhile
- takeScreenshot: ${EVIDENCE}/30-progress-stopped-kept
# 4. An error after the status line: one plain sentence, the question kept as
# the turn's heading, and Try again, which clears the composer when it holds
# the same question.
- tapOn:
    id: ask-question
- eraseText: 200
- inputText: fixture slow error
- tapOn:
    id: ask-submit
    enabled: true
- extendedWaitUntil:
    visible:
      id: ask-retry
    timeout: 60000
- runFlow: support/ask-progress-geometry.yaml
- assertVisible:
    id: ask-error
- assertNotVisible: .*Request failed.*
- assertVisible:
    id: ask-failed-question
    text: fixture slow error
- assertVisible:
    id: ask-question
    text: fixture slow error
- takeScreenshot: ${EVIDENCE}/30-progress-error
- tapOn:
    id: ask-retry
- extendedWaitUntil:
    visible:
      id: ask-status
    timeout: 15000
- assertNotVisible:
    id: ask-question
    text: fixture slow error
- extendedWaitUntil:
    visible:
      id: ask-retry
    timeout: 60000
# 5. Rate-limited: "OPAX is busy right now." and Try again waits a moment.
- tapOn:
    id: ask-question
- eraseText: 200
- inputText: fixture rate limited
- tapOn:
    id: ask-submit
    enabled: true
- extendedWaitUntil:
    visible: OPAX is busy right now\.
    timeout: 30000
- assertVisible:
    id: ask-retry
    enabled: false
- takeScreenshot: ${EVIDENCE}/30-progress-busy
