appId: au.com.opax.app
name: 27 Leads and the declared-interests feed
---
# No clearState: offline journey 04 reads the records earlier journeys saved.
#
# JSON-pointer checks: each "# pointer:" line names a value in the pinned
# /discovery.json (or another pinned file, "file#pointer"), and
# tests/leads-journey.test.ts requires the next assertion's text to contain
# it as the app shows it ("as dollars", "as money", "as spoken", "as
# percent", "as millions", "as count", and "as plain" for a caveat in the
# lead page's plain words; a metric object reads "label, value"; a timestamp
# reads as its date). "# pointer-absent:" requires the assertion that
# follows to refuse it.
#
# scrollUntilVisible always swipes from the centre of the screen. Tall AX5
# elements count as found once a tenth shows and are then centred with
# speed-20 swipes (about half a screen each), so a tap lands on them and not
# under the floating tab bar.
- launchApp
- assertVisible:
    id: today-screen-message
- scrollUntilVisible:
    element:
      id: today-leads-open
    direction: DOWN
    timeout: 180000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/27-today-entry
- tapOn:
    id: today-leads-open
# Leads (specs/money.md 2.9): the lede, then one section per kind with
# three cards, "See all" and a source line at its foot. At AX5 the lede
# alone fills the screen: wait for the screen, then scroll.
- extendedWaitUntil:
    visible:
      id: leads-lede
    timeout: 30000
- assertVisible:
    id: leads-lede
    text: Patterns in the public record are leads, not findings\.
- takeScreenshot: ${EVIDENCE}/27-leads
# Companies in both sort by party receipts, so the export's first signal
# (Westpac) is the section's first card, lead-6 after the three contract
# and three party funding cards. The card is one link: its title, its one
# figure and the figure's label (hint "Opens the lead.").
# pointer: /signals/0/title
# pointer: /signals/0/metrics/0 as spoken
- scrollUntilVisible:
    element:
      id: lead-6
      text: 'Westpac Banking Corporation appears in party receipts and contracts\. 77 million dollars, in party receipts\.'
    direction: DOWN
    timeout: 180000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- takeScreenshot: ${EVIDENCE}/27-lead-card
# Each section's source sheet holds the export's date in its Notes.
- scrollUntilVisible:
    element:
      id: leads-source-donor_contract_overlap
    direction: DOWN
    timeout: 180000
    centerElement: true
    speed: 20
- waitForAnimationToEnd
- tapOn:
    id: leads-source-donor_contract_overlap
- extendedWaitUntil:
    visible:
      id: leads-source-donor_contract_overlap-sheet
    timeout: 15000
# The source sheet starts at its medium detent. Expand from the grabber,
# then scroll its content rather than the page behind the sheet.
- runFlow:
    when:
      visible: Half screen
    commands:
      - swipe:
          from:
            text: Half screen
          direction: UP
          duration: 600
      - waitForAnimationToEnd
# pointer: /generated_at
- scrollUntilVisible:
    element:
      text: .*21 September 2026.*
    direction: DOWN
    timeout: 60000
    centerElement: true
    speed: 20
- takeScreenshot: ${EVIDENCE}/27-leads-notes
- tapOn: Done
- extendedWaitUntil:
    notVisible:
      id: leads-source-donor_contract_overlap-sheet
    timeout: 15000
# The export's second signal, the first Party funding card (lead-3): its
# comparison, its chart, then the same rows as a table.
- scrollUntilVisible:
    element:
      id: lead-3
      text: 'United Australia Party: 78% from one donor\. .*'
    direction: UP
    timeout: 300000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- waitForAnimationToEnd
- tapOn:
    id: lead-3
- extendedWaitUntil:
    visible:
      id: lead-heading
    timeout: 30000
- assertVisible:
    id: lead-meta
    text: Lead · Party funding
# pointer: /signals/1/chart/participants/0/name
- scrollUntilVisible:
    element:
      id: lead-takeaway
      text: 78\.4% of recorded receipts came from Mineralogy Pty Ltd\.
    direction: DOWN
    timeout: 180000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- takeScreenshot: ${EVIDENCE}/27-comparison
# pointer: /signals/1/chart/group_total as spoken
- scrollUntilVisible:
    element:
      text: 159 million dollars, in party receipts, 2007–08 to 2024–25
    direction: DOWN
    timeout: 180000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
# The bars are a picture of the rows, not links.
# pointer: /signals/1/chart/participants/0/name
# pointer: /signals/1/chart/participants/0/value as millions
# pointer: /signals/1/chart/participants/0/share as percent
- scrollUntilVisible:
    element:
      id: lead-chart-row-0
      text: Mineralogy Pty Ltd, 124\.7 million dollars, 78\.4 percent
    direction: DOWN
    timeout: 180000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- takeScreenshot: ${EVIDENCE}/27-chart
- scrollUntilVisible:
    element:
      id: lead-table-toggle
      text: Show as table
    direction: DOWN
    timeout: 180000
    centerElement: true
    speed: 20
- waitForAnimationToEnd
- tapOn:
    id: lead-table-toggle
- assertVisible:
    id: lead-table-toggle
    text: Show as chart
# pointer: /signals/1/chart/participants/0/value as money
# pointer: /signals/1/chart/participants/0/record_count as count
- scrollUntilVisible:
    element:
      id: lead-chart-cell-0
      text: Mineralogy Pty Ltd, \$124,655,455 · 78\.4% · 230 records
    direction: UP
    timeout: 180000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- takeScreenshot: ${EVIDENCE}/27-table
# "How this lead was found": the method note and every caveat in plain
# words; the pipeline's own caveat is replaced (specs/money.md 2.10).
# pointer: /signals/1/chart/record_count as count
- scrollUntilVisible:
    element:
      id: lead-note
      text: '973 receipts · .*'
    direction: DOWN
    timeout: 180000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
# pointer: /signals/1/caveats/0 as plain
- scrollUntilVisible:
    element:
      id: lead-caveat-0
      text: This share describes available records only; missing disclosures can materially change it\.
    direction: DOWN
    timeout: 180000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
# pointer: /signals/1/caveats/1 as plain
- scrollUntilVisible:
    element:
      id: lead-caveat-1
      text: At least two positive records and a 25% share are required\. A single reporting period is not imposed\.
    direction: DOWN
    timeout: 180000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
# pointer: /signals/1/caveats/2 as plain
- scrollUntilVisible:
    element:
      id: lead-caveat-2
      text: Annual party receipts include more than gifts\. State, election and referendum disclosures are not included\.
    direction: DOWN
    timeout: 180000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- assertNotVisible:
    text: .*donation_type.*
- takeScreenshot: ${EVIDENCE}/27-lead-method
# The party's money record opens natively in the current tab: the map
# loads, then pushes the record. This also loads the money graph the
# company lead's subject row needs below.
- scrollUntilVisible:
    element:
      id: lead-money-map
    direction: DOWN
    timeout: 180000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- assertVisible:
    id: lead-money-map
    text: Open in the money map
- tapOn:
    id: lead-money-map
- extendedWaitUntil:
    visible:
      id: money-focus-name
      text: United Australia.*
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/27-money-record
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: money-view-summary
    timeout: 90000
# Pushed in the current tab: the tab bar is still there, full or minimised.
- assertVisible: Tab Bar
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: lead-screen
    timeout: 30000
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: leads-screen
    timeout: 30000
# The bar search sits under the large title: one flat list of matching
# cards, each naming its kind, under a caption. Leads is a pushed page, so
# scroll it to its top here (restore-tab-bar pops to the tab root); a pull
# down at the edge reveals the search field when the bar has hidden it.
- scrollUntilVisible:
    element:
      id: leads-lede
    direction: UP
    timeout: 180000
    centerElement: true
    speed: 20
- runFlow:
    when:
      notVisible: Agencies, parties and companies
    commands:
      - swipe:
          start: 97%, 40%
          end: 97%, 75%
          duration: 600
      - waitForAnimationToEnd
- tapOn: Agencies, parties and companies
- inputText: Westpac
- extendedWaitUntil:
    visible:
      id: leads-search-caption
      text: ^\d+ leads? match(es)?$
    timeout: 15000
# pointer: /signals/0/title
- assertVisible:
    id: lead-0
    text: 'Companies in both\. Westpac Banking Corporation appears in party receipts and contracts\. .*'
- takeScreenshot: ${EVIDENCE}/27-search
- tapOn:
    id: lead-0
- extendedWaitUntil:
    visible:
      id: lead-heading
      text: Westpac Banking Corporation
    timeout: 30000
# Companies in both: the two flows side by side, never added together.
- scrollUntilVisible:
    element:
      id: lead-flows-receipts
      text: '\$77m, in 1,041 party receipts'
    direction: DOWN
    timeout: 180000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- assertVisible:
    id: lead-flows-contracts
    text: '\$9\.1m, in 4 government contracts'
- assertVisible:
    id: lead-flows-caveat
    text: Shown beside each other, never added together\.
- takeScreenshot: ${EVIDENCE}/27-flows
# pointer: /signals/0/caveats/0 as plain
- scrollUntilVisible:
    element:
      id: lead-caveat-0
      text: Matching names are not verified legal identities; unrelated entities can share a name\.
    direction: DOWN
    timeout: 180000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
# pointer: /signals/0/caveats/2 as plain
- scrollUntilVisible:
    element:
      id: lead-caveat-2
      text: Annual party receipts include more than gifts\. State, election and referendum disclosures are not included\.
    direction: DOWN
    timeout: 180000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
# Example records push the record's own page, with its original.
- scrollUntilVisible:
    element:
      id: lead-evidence-0
    direction: DOWN
    timeout: 180000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- takeScreenshot: ${EVIDENCE}/27-lead-records
- waitForAnimationToEnd
- tapOn:
    id: lead-evidence-0
# The receipt names its register, not OPAX's local row number.
- scrollUntilVisible:
    element:
      id: money-item-original-0
      text: .*AEC Transparency Register.*
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
# pointer-absent: /signals/0/evidence/0/record_id
- assertNotVisible:
    text: '.*643745.*'
- takeScreenshot: ${EVIDENCE}/27-money-item
- waitForAnimationToEnd
- tapOn:
    id: money-item-original-0
# E2E builds show the checked address locally.
# pointer: /signals/0/evidence/0/url
- extendedWaitUntil:
    visible:
      id: source-destination-url
      text: https://transparency\.aec\.gov\.au/
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/27-lead-source
- tapOn: Done
- extendedWaitUntil:
    visible:
      id: money-item-original-0
    timeout: 15000
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: lead-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: lead-evidence-1
    direction: DOWN
    timeout: 180000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- waitForAnimationToEnd
- tapOn:
    id: lead-evidence-1
# pointer: /signals/0/evidence/1/record_id
- scrollUntilVisible:
    element:
      id: money-item-original-0
      text: .*AusTender register.*CN3407266.*
    direction: DOWN
    timeout: 60000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- takeScreenshot: ${EVIDENCE}/27-money-item-contract
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: lead-screen
    timeout: 30000
# The company's subject row opens its money record (the graph is loaded).
# The lead is a pushed page: scroll it to its top, not to the tab root.
- scrollUntilVisible:
    element:
      id: lead-heading
    direction: UP
    timeout: 180000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- assertVisible:
    id: lead-subject
    text: Westpac Banking Corporation, Donor on the money map
- tapOn:
    id: lead-subject
- extendedWaitUntil:
    visible:
      id: money-record-screen
    timeout: 30000
- assertVisible:
    id: money-focus-name
    text: Westpac Banking Corporation
- takeScreenshot: ${EVIDENCE}/27-subject-record
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: lead-heading
    timeout: 30000
# Return to Leads and dismiss its retained search before popping to Today.
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: leads-screen
    timeout: 30000
- runFlow: support/search-dismiss.yaml
# The declared-interests feed behind Today's recent declarations. Reveal the
# bar, then use the native scroll-to-top tap instead of a retained Leads offset.
- runFlow:
    file: support/restore-tab-bar.yaml
    env:
      TOP_ID: today-screen-message
      TAB_ID: tab-today
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 20000
# Search down from the confirmed top, where Just declared follows the edition.
- scrollUntilVisible:
    element:
      id: today-declarations-all
    direction: DOWN
    timeout: 180000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- waitForAnimationToEnd
- tapOn:
    id: today-declarations-all
- extendedWaitUntil:
    visible:
      id: declarations-screen
    timeout: 30000
- assertVisible:
    id: declarations-screen
- takeScreenshot: ${EVIDENCE}/27-declarations
- tapOn: Filters.*
- assertVisible:
    id: filters-screen
- tapOn:
    id: filters-row-chamber
- assertVisible:
    id: filters-facet-screen
- tapOn:
    id: filters-choice-house
- takeScreenshot: ${EVIDENCE}/27-declarations-filters
- tapOn: Done
- scrollUntilVisible:
    element:
      id: declarations-filter-line
    timeout: 30000
- assertVisible:
    id: declarations-filter-line
    text: .*House of Representatives.*
- takeScreenshot: ${EVIDENCE}/27-declarations-house
# Every row in the filtered list is a House row. At AX5 a row can be taller
# than the screen, so its text is matched where a tenth of it shows.
- scrollUntilVisible:
    element:
      id: declaration-person-0
      text: Andrew Wilkie, .*House of Representatives.*
    direction: DOWN
    timeout: 180000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- assertNotVisible:
    id: declaration-person-0
    text: .*Senate.*
- takeScreenshot: ${EVIDENCE}/27-declarations-house-row
# A member's name narrows the feed; the row opens the native profile.
- tapOn: Member.s name
- inputText: Briskey
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: declarations-total
    timeout: 30000
- scrollUntilVisible:
    element:
      id: declaration-person-0
    direction: DOWN
    timeout: 180000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- waitForAnimationToEnd
- assertVisible:
    id: declarations-screen
- takeScreenshot: ${EVIDENCE}/27-declarations-member
# An active native bar search can consume the first row tap. Keep the
# member filter applied and retry only while the profile has not opened.
- repeat:
    times: 3
    while:
      notVisible:
        id: person-screen-title
    commands:
      - tapOn:
          id: declaration-person-0
          retryTapIfNoChange: false
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: person-screen-title
    timeout: 30000
- assertVisible:
    id: person-screen-title
    text: Jo Briskey
- takeScreenshot: ${EVIDENCE}/27-profile
# Return with the member and chamber filters intact before dismissing search.
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: declarations-screen
    timeout: 30000
- assertVisible:
    id: declaration-person-0
    text: Jo Briskey, .*House of Representatives.*
- runFlow: support/search-dismiss.yaml
- runFlow:
    file: support/restore-tab-bar.yaml
    env:
      TOP_ID: today-screen-message
      TAB_ID: tab-today
