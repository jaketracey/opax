appId: au.com.opax.app
name: 12 Search empty states with a way on, and native electorate suggestions
---
# Every empty state has a way on (journeys/search.md 3.9): All with nothing
# offers Ask OPAX; a scope with nothing offers Show all results, which keeps
# the query.
- launchApp:
    clearState: true
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-search
- runFlow:
    file: support/search-query.yaml
    env:
      QUERY: zzzznevermatchingcatalog
      PREFIX: 12-empty
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: search-empty
    timeout: 90000
    visibilityPercentage: 1
- assertVisible:
    id: search-empty-ask
- takeScreenshot: ${EVIDENCE}/12-empty
- runFlow:
    file: support/search-scope.yaml
    env:
      SCOPE: People
- scrollUntilVisible:
    element:
      id: search-empty-all-results
    timeout: 90000
    centerElement: true
- takeScreenshot: ${EVIDENCE}/12-empty-people
- tapOn:
    id: search-empty-all-results
- scrollUntilVisible:
    element:
      id: search-empty-ask
    timeout: 90000
    visibilityPercentage: 1
- assertNotVisible:
    id: search-empty-all-results
- takeScreenshot: ${EVIDENCE}/12-empty-all-again
- launchApp:
    clearState: true
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-search
- runFlow:
    file: support/search-query.yaml
    env:
      QUERY: Grayndler
      PREFIX: 12-electorate
# Swipe on the content: iOS visibility checks can see rows behind the keyboard.
- swipe:
    start: 90%, 40%
    end: 90%, 20%
- scrollUntilVisible:
    element:
      id: search-suggestion-electorate-.*
    timeout: 90000
    centerElement: true
    visibilityPercentage: 1
- takeScreenshot: ${EVIDENCE}/12-electorate-suggestion
- tapOn:
    id: search-suggestion-electorate-.*
- extendedWaitUntil:
    visible:
      id: electorate-name
    timeout: 20000
- assertVisible: Grayndler
- takeScreenshot: ${EVIDENCE}/12-native-electorate
- runFlow:
    file: review-pages.yaml
    env:
      END: election-row-0
      PREFIX: 12-native-representation
