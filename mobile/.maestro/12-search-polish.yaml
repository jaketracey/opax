appId: au.com.opax.app
name: 12 Search alternate kinds and native electorate suggestions
---
- launchApp:
    clearState: true
- tapOn:
    id: tab-search
- tapOn:
    id: search-input
- inputText: zzzznevermatchingcatalog
- scrollUntilVisible:
    element:
      id: search-submit
    timeout: 90000
    direction: UP
- tapOn:
    id: search-submit
- scrollUntilVisible:
    element:
      id: search-empty
    timeout: 90000
    visibilityPercentage: 1
- takeScreenshot: ${EVIDENCE}/12-empty
- scrollUntilVisible:
    element:
      id: search-empty-pay
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/12-other-kinds
- tapOn:
    id: search-empty-pay
- scrollUntilVisible:
    element:
      id: search-empty
    timeout: 90000
    visibilityPercentage: 1
- assertVisible: No results for .*zzzznevermatchingcatalog.* in pay.*
- takeScreenshot: ${EVIDENCE}/12-empty-pay
- launchApp:
    clearState: true
- tapOn:
    id: tab-search
- tapOn:
    id: search-input
- inputText: Grayndler
- scrollUntilVisible:
    element:
      id: search-suggestion-electorate-.*
    timeout: 90000
    visibilityPercentage: 1
- takeScreenshot: ${EVIDENCE}/12-electorate-suggestion
- tapOn:
    id: search-suggestion-electorate-.*
- extendedWaitUntil:
    visible:
      id: electorate-name
    timeout: 20000
- assertVisible: Grayndler
- takeScreenshot: ${EVIDENCE}/12-native-electorate
