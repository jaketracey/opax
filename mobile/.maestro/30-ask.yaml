appId: au.com.opax.app
name: 30 Ask idle, a starter, the answer with its records, a follow-up, a clarify turn and the seat starter
---
- launchApp:
    permissions:
      all: unset
    clearState: true
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-ask
- assertVisible:
    id: ask-screen
# Idle (journeys/ask.md 4.1): one line, Try asking, no builder, no options row.
- assertVisible:
    id: ask-idle-line
- assertVisible:
    id: ask-starter-0
- assertNotVisible:
    text: Build a question
- assertNotVisible:
    id: ask-options-line
- assertNotVisible:
    id: ask-draft-new-conversation
- takeScreenshot: ${EVIDENCE}/30-ask
# A starter asks at once (consent first on a cleared install).
- tapOn:
    id: ask-starter-0
- runFlow: support/ask-consent.yaml
- scrollUntilVisible:
    element:
      id: ask-machine-label
    direction: DOWN
    centerElement: true
    visibilityPercentage: 10
    timeout: 180000
- assertVisible:
    id: ask-user-question
- takeScreenshot: ${EVIDENCE}/30-answer
# Records cited lead with the marks' numerals; the first opens its record.
- scrollUntilVisible:
    element:
      id: ask-records-cited
    direction: DOWN
    centerElement: true
    timeout: 90000
- assertVisible: Records cited \(\d+\)
# The answer's sources sheet: one dated line, no repeated serif titles.
- scrollUntilVisible:
    element:
      id: ask-answer-sources
    direction: DOWN
    centerElement: true
    timeout: 90000
- assertVisible:
    id: ask-answer-sources
    text: 'Answered .*Source: OPAX'
- tapOn:
    id: ask-answer-sources
- extendedWaitUntil:
    visible:
      text: Done
    timeout: 10000
- takeScreenshot: ${EVIDENCE}/30-answer-sources
- tapOn:
    text: Done
    retryTapIfNoChange: false
- extendedWaitUntil:
    notVisible:
      id: ask-sources-question
    timeout: 10000
- scrollUntilVisible:
    element:
      id: ask-citation-1
    direction: DOWN
    centerElement: true
    visibilityPercentage: 10
    timeout: 180000
- tapOn:
    id: ask-citation-1
- scrollUntilVisible:
    element:
      id: bill-title
    centerElement: true
    visibilityPercentage: 10
    timeout: 180000
- assertVisible: Interactive Gambling \(Cost Recovery Levy\) Bill 2026
- takeScreenshot: ${EVIDENCE}/30-native-bill
# An intentional native back swipe, inside this journey's held device lock.
- swipe:
    start: 1%,50%
    end: 90%,50%
    duration: 500
- assertVisible:
    id: ask-screen
# The composer stays docked above the tab bar while reading.
- assertVisible:
    id: ask-question
- scrollUntilVisible:
    element:
      id: ask-followup-0
    direction: DOWN
    centerElement: true
    visibilityPercentage: 10
    speed: 40
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/30-followups
- tapOn:
    id: ask-followup-0
- scrollUntilVisible:
    element:
      id: ask-user-question
      text: Who spoke for and against.*
    direction: DOWN
    centerElement: true
    visibilityPercentage: 10
    timeout: 180000
- assertNotVisible: 'Understood as: .*'
- takeScreenshot: ${EVIDENCE}/30-answered-as
# A typed follow-up from the docked composer.
- tapOn:
    id: ask-question
- inputText: What else was discussed?
- tapOn:
    id: ask-submit
    enabled: true
- scrollUntilVisible:
    element:
      id: ask-user-question
      text: What else was discussed\?
    direction: DOWN
    centerElement: true
    visibilityPercentage: 10
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/30-typed-followup
# Too short to search on: a clarify turn whose suggestion fills the composer
# (it is a guess, so it never sends), with Search OPAX beside it.
- extendedWaitUntil:
    visible:
      id: ask-machine-label
    timeout: 90000
- tapOn:
    id: ask-question
- inputText: High
- tapOn:
    id: ask-submit
    enabled: true
- scrollUntilVisible:
    element:
      id: ask-clarify-question
    direction: DOWN
    centerElement: true
    visibilityPercentage: 10
    timeout: 90000
- assertVisible: Name a person, party, bill or topic\.
- assertVisible:
    id: ask-search-opax
- assertVisible:
    id: ask-clarify-suggestion
- takeScreenshot: ${EVIDENCE}/30-clarify
- tapOn:
    id: ask-clarify-suggestion
- assertVisible:
    id: ask-question
    text: What did parliament say about the Interactive Gambling.*
- assertVisible:
    id: ask-clarify
# New question clears to idle; the conversation is first under Conversations.
- tapOn: New question
- extendedWaitUntil:
    visible:
      id: ask-idle-line
    timeout: 10000
# Ask's ScrollView dismisses the keyboard interactively during a downward
# drag. Start on its idle content and finish below the keyboard's edge.
- swipe:
    start: 50%, 30%
    end: 50%, 90%
    duration: 600
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: tab-your-mp
    timeout: 15000
- assertVisible:
    id: ask-conversation-0
# The seat starter fills the composer with the member and Speeches; nothing is sent.
- tapOn:
    id: tab-your-mp
- runFlow: support/location-manual-seat.yaml
- tapOn:
    id: tab-ask
- scrollUntilVisible:
    element:
      id: ask-starter-seat
    centerElement: true
    timeout: 60000
- tapOn:
    id: ask-starter-seat
- assertVisible:
    id: ask-question
    text: What has .* said in parliament this year\?
- assertVisible:
    id: ask-options-line
- assertVisible: .*Speeches
- assertNotVisible:
    id: ask-status
- takeScreenshot: ${EVIDENCE}/30-seat-starter
