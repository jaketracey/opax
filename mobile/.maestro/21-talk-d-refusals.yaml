appId: au.com.opax.app
name: 21d Talk refusal states, voice disabled, the monthly budget closed and a dropped connection
# Part of journey 21 (see 21-talk-a-call.yaml). Each state signs in to its own
# fixture account through the helper, which signs out first.
---
- launchApp:
    clearState: true
    permissions: {}
- runFlow:
    file: support/talk-fixture-account.yaml
    env:
      TALK_EMAIL: disabled@example.invalid
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-status
    visibilityPercentage: 10
- assertVisible: Voice is taking a break\.
# Voice off offers the typed version of the same thing.
- assertVisible:
    id: talk-ask
- assertVisible: Ask instead
- takeScreenshot: ${EVIDENCE}/21-disabled
- assertNotVisible:
    id: talk-start
- runFlow:
    file: support/talk-fixture-account.yaml
    env:
      TALK_EMAIL: budget@example.invalid
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-status
    visibilityPercentage: 10
- assertVisible: Voice is closed for the rest of this month\.
- assertVisible:
    id: talk-ask
- takeScreenshot: ${EVIDENCE}/21-budget
- assertNotVisible:
    id: talk-start
- runFlow:
    file: support/talk-fixture-account.yaml
    env:
      TALK_EMAIL: drop@example.invalid
# Talk's action is pinned at the foot of a screen that does not scroll (the
# idle orb, 13 Nov), so these scrolls only wait for it. Centring it timed
# out on the device whenever lines under it held it low (sweep 2 lane A).
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-start
# clearState removed stored consent, so this call asks first. The consent
# sheet covers Start; tap Agree, then wait for the dropped connection.
- tapOn:
    id: talk-start
- runFlow:
    file: support/talk-consent.yaml
    env:
      CONSENT_BUTTON: talk-agree
- scrollUntilVisible:
    timeout: 60000
    element:
      id: talk-status
    direction: UP
    visibilityPercentage: 10
- extendedWaitUntil:
    visible: (The call dropped|Couldn.t connect)[.].*
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/21-drop
- tapOn: Done
