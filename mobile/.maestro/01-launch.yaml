appId: au.com.opax.app
name: 01 Launch, reach every tab and the navigation-bar sheets
---
# scrollUntilVisible always swipes from the centre of the screen, clear of the
# leading edge, so no scroll can start a back-swipe.
- launchApp:
    clearState: true
    permissions: {}
# E2E builds treat the welcome as seen; the launch ends on Today.
- assertNotVisible:
    id: welcome-screen
- assertVisible:
    id: today-screen
- assertVisible:
    id: today-screen-message
- takeScreenshot: ${EVIDENCE}/01-today
# Wait for the Today catalog itself: before it loads the page is short, and
# the footer is on screen with nothing above it.
- scrollUntilVisible:
    element:
      id: today-bill-0
    direction: DOWN
    visibilityPercentage: 1
    timeout: 60000
# Today is a long feed (about 25 screens at AX5). The footer is the last
# element, so fast swipes cannot carry past it; the bound is time, not swipes.
- scrollUntilVisible:
    element:
      id: today-screen-footer
    direction: DOWN
    speed: 70
    timeout: 300000
    centerElement: true
- takeScreenshot: ${EVIDENCE}/01-today-footer
- runFlow:
    file: support/restore-tab-bar.yaml
    env:
      TOP_ID: today-screen-message
      TAB_ID: tab-your-mp
- tapOn:
    id: tab-your-mp
- assertVisible:
    id: your-invitation
- tapOn:
    id: tab-bills
- extendedWaitUntil:
    visible:
      id: bills-count
    timeout: 300000
- tapOn:
    id: tab-search
- assertVisible:
    id: search-screen
- tapOn:
    id: tab-today
# Restore the full bar before leaving Today, which retains its position.
- runFlow:
    file: support/restore-tab-bar.yaml
    env:
      TOP_ID: today-screen-message
      TAB_ID: tab-ask
- assertVisible:
    id: today-screen-message
# Signed-out readers see Talk in the composer; its deep link shows the gate.
- tapOn:
    id: tab-ask
- assertVisible:
    id: ask-question
- assertVisible:
    id: ask-talk
- openLink: opax://talk
- tapOn:
    text: Open
    optional: true
# Sign in sits in the sheet's pinned footer, so it never reaches the centre:
# centring spent five swipes of about 7 s each (the orb never settles) and ran
# out of time with the button in full view (iOS 18.4/18.6, 14 Nov 2026).
- scrollUntilVisible:
    element:
      id: talk-sign-in
    timeout: 30000
- assertVisible:
    id: talk-sign-in
- assertNotVisible:
    id: talk-start
- takeScreenshot: ${EVIDENCE}/01-talk-sheet
- tapOn: Done
- tapOn:
    id: tab-today
- assertVisible:
    id: today-screen-message
- tapOn: Account
- assertVisible:
    id: account-sheet
- takeScreenshot: ${EVIDENCE}/01-account-sheet
- tapOn: Done
- assertVisible:
    id: today-screen-message
