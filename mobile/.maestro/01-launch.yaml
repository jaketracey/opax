appId: au.com.opax.app
name: 01 Launch, reach every tab and the navigation-bar sheets
---
- launchApp:
    clearState: true
- assertVisible:
    id: today-screen
- assertVisible:
    id: today-screen-message
- takeScreenshot: ${EVIDENCE}/01-today
- scrollUntilVisible:
    element:
      id: today-screen-footer
    timeout: 90000
    centerElement: true
- takeScreenshot: ${EVIDENCE}/01-today-footer
- tapOn:
    id: tab-your-mp
- assertVisible:
    id: your-mp-screen-message
- tapOn:
    id: tab-bills
- extendedWaitUntil:
    visible:
      id: bills-count
    timeout: 20000
- tapOn:
    id: tab-search
- assertVisible:
    id: search-screen
- tapOn:
    id: tab-today
# Today is taller with the edition card; a slow simulator needs more than the
# default 20 seconds to swipe back up from the footer.
- scrollUntilVisible:
    element:
      id: today-screen-message
    direction: UP
    timeout: 90000
- assertVisible:
    id: today-screen-message
# Talk and Account and about are navigation-bar buttons on every root screen.
- tapOn: Talk to OPAX
- assertVisible:
    id: talk-sheet-message
- takeScreenshot: ${EVIDENCE}/01-talk-sheet
- tapOn: Done
- assertVisible:
    id: today-screen-message
- tapOn: Account and about
- assertVisible:
    id: account-sheet-message
- takeScreenshot: ${EVIDENCE}/01-account-sheet
- tapOn: Done
- assertVisible:
    id: today-screen-message
