appId: au.com.opax.app
name: 57b iPad - build 32 feedback, Search focus, directory labels and filter, a former member's records
---
# iPad only (OPAX QA iPad 13). As in journey 53, taps miss under iPadOS 26
# Windowed Apps, so set Full-Screen Apps first and restore Windowed Apps.
- runFlow: support/ipad-full-screen-apps.yaml
- launchApp:
    clearState: true
    permissions: {}
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 90000
# Idle Search: no placeholder rows; a short tap focuses the field each time.
- openLink: opax://search
- extendedWaitUntil:
    visible:
      id: search-split-empty
    timeout: 60000
- assertNotVisible:
    id: search-suggestions-loading
- repeat:
    times: 20
    commands:
      - tapOn:
          text: People, bills, topics and more
      - inputText: Albanese
      - assertVisible:
          text: ^Albanese$
      - eraseText: 12
- takeScreenshot: ${EVIDENCE}/57b-search
# The directory names its order; Hockey reads the party he sat for.
- openLink: opax://directory?kind=person
- extendedWaitUntil:
    visible:
      id: directory-person-screen
    timeout: 60000
- assertVisible: Parliamentarians
- tapOn:
    text: Name, electorate or state
- inputText: Joe Hockey
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: directory-person-joe-hockey
    timeout: 30000
- assertNotVisible: .*Formerly LIB.*
- assertNotVisible: .*Formerly Liberal.*
- takeScreenshot: ${EVIDENCE}/57b-directory-hockey
# The shared directory sheet applies its sitting switch immediately.
- tapOn: Filters.*
- assertVisible:
    id: filters-screen
- tapOn:
    id: filters-row-sitting
- tapOn: Done
- assertVisible:
    id: directory-filter-line
- tapOn: Filters.*
- tapOn:
    id: filters-row-sitting
- tapOn: Done
# Shorten's record in the pane: Labor's receipts and his divisions.
- tapOn:
    text: Name, electorate or state
- eraseText: 20
- inputText: Bill Shorten
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: directory-person-bill-shorten
    timeout: 30000
- tapOn:
    id: directory-person-bill-shorten
- extendedWaitUntil:
    visible:
      id: person-screen-title
    timeout: 30000
- assertVisible:
    id: person-former
- scrollUntilVisible:
    element: Labor party receipts
    centerElement: true
    speed: 20
    timeout: 120000
- takeScreenshot: ${EVIDENCE}/57b-shorten
- runFlow: support/ipad-windowed-apps.yaml
