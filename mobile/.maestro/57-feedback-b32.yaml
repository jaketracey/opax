appId: au.com.opax.app
name: 57 TestFlight build 32 feedback - Search focus, Browse, directory labels and filter, a former member's records
---
# AD-10Dcy and ANiiV6Bw: idle Search answers a short tap at once (no freeze
# while the suggestion roster builds) and draws no placeholder rows in Browse.
- launchApp
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-search
- scrollUntilVisible:
    element:
      text: People, bills, topics and more
    direction: UP
    centerElement: true
    speed: 20
    timeout: 60000
- assertNotVisible:
    id: search-suggestions-loading
- takeScreenshot: ${EVIDENCE}/57-search-idle
# A short tap, not the long-press workaround: twenty focus, type and clear
# rounds, each asserting the field holds exactly what was typed.
- repeat:
    times: 20
    commands:
      - tapOn:
          text: People, bills, topics and more
      - inputText: Albanese
      - assertVisible:
          text: ^Albanese$
      - eraseText: 12
      - hideKeyboard
- takeScreenshot: ${EVIDENCE}/57-search-after-typing
# Browse opens the directory; its order is named; a former member's label is
# the party they sat for, with no "Formerly" (AILRB_Cd, ACzcQOFB).
- scrollUntilVisible:
    element:
      id: search-browse-person
    centerElement: true
    speed: 20
    timeout: 60000
- tapOn:
    id: search-browse-person
- extendedWaitUntil:
    visible:
      id: directory-person-screen
    timeout: 30000
- assertVisible: Parliamentarians
- takeScreenshot: ${EVIDENCE}/57-directory
- tapOn:
    text: Name, electorate or state
- inputText: Joe Hockey
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: directory-person-joe-hockey
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 60000
- assertNotVisible: .*Formerly LIB.*
- assertNotVisible: .*Formerly Liberal.*
- takeScreenshot: ${EVIDENCE}/57-directory-hockey
# At AX5 the row is taller than the screen: return to the field first.
- scrollUntilVisible:
    element:
      text: Name, electorate or state
    direction: UP
    centerElement: true
    speed: 20
    timeout: 60000
- tapOn:
    text: Name, electorate or state
- eraseText: 20
- hideKeyboard
# ALUtpHq6: Sitting members only, beside Voting record and Portrait.
- tapOn: Filters.*
- assertVisible:
    id: filters-screen
- tapOn:
    id: filters-row-sitting
- takeScreenshot: ${EVIDENCE}/57-filters-sitting
- tapOn: Done
- extendedWaitUntil:
    visible:
      id: directory-person-screen
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/57-directory-sitting-only
# ANGYQm3w: Bill Shorten's page links his votes and Labor's receipts. The
# tester opened it from Parliamentarians (Search's People results keep only
# members of the dated release, which he is not). A relaunch clears filters.
- launchApp
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-search
- scrollUntilVisible:
    element:
      id: search-browse-person
    centerElement: true
    speed: 20
    timeout: 60000
- tapOn:
    id: search-browse-person
- extendedWaitUntil:
    visible:
      id: directory-person-screen
    timeout: 30000
- tapOn:
    text: Name, electorate or state
- inputText: Bill Shorten
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: directory-person-bill-shorten
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 60000
- tapOn:
    id: directory-person-bill-shorten
- extendedWaitUntil:
    visible:
      id: person-screen-title
    timeout: 30000
- assertVisible:
    id: person-former
- scrollUntilVisible:
    element:
      id: person-party-receipts
    centerElement: true
    speed: 20
    timeout: 120000
- takeScreenshot: ${EVIDENCE}/57-shorten-receipts
- scrollUntilVisible:
    element:
      id: person-votes-summary
    direction: UP
    centerElement: true
    speed: 20
    timeout: 120000
- assertNotVisible:
    text: Voting record not linked
- takeScreenshot: ${EVIDENCE}/57-shorten-votes
