appId: au.com.opax.app
---
# There is no submit button any more: the keyboard's Search key submits.
# Check the native frame instead: a real software keyboard is up and no
# results have been drawn yet (typing never searches).
- copyTextFrom:
    id: search-geometry
- evalScript: ${output.geometry = JSON.parse(maestro.copiedText)}
- assertTrue:
    condition: ${output.geometry.keyboardHeight > 100 && !output.geometry.results}
    label: A real keyboard is open and nothing has been searched while typing
