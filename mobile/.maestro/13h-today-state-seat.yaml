appId: au.com.opax.app
name: 13h Today with a federal and a Victorian state seat saved
---
# OPAXSeat federal+state saves Melbourne and a Victorian district. Your
# representatives is one group: the federal member's row, then the state
# lower-house member's row, then the senators link, under one source line.
# While the election record says the Legislative Assembly is dissolved (its
# caretaker date has passed and the roster's date for the district is before
# election day), the state row is four lines and names no member: the
# parliament and house, the district, that the Assembly is dissolved for
# the election, and the last member. The old state seat card is gone.
# Today draws no authorisation line; the election block has its own.
- launchApp:
    clearState: true
    arguments:
      OPAXSeat: federal+state
- extendedWaitUntil:
    visible:
      id: today-your-mp
    timeout: 60000
- assertVisible:
    id: today-reps-heading
    text: Your representatives
- assertVisible:
    id: today-rep-federal
    text: .*, Federal member for Melbourne
- assertVisible:
    id: today-rep-state-dissolved
    text: Victoria, Legislative Assembly\. .*\. Assembly dissolved for the \d+ \w+ election\. Last member. .*
- assertNotVisible:
    id: today-rep-state
- scrollUntilVisible:
    element:
      id: today-your-mp-sources
    timeout: 90000
    centerElement: true
    speed: 20
- assertVisible:
    id: today-reps-senators
    text: Senators for Victoria.*
- takeScreenshot: ${EVIDENCE}/13h-representatives
- assertNotVisible:
    id: today-state-seat
- assertNotVisible:
    id: today-state-seat-header
# The row opens the last member's profile.
- tapOn:
    id: today-rep-state-dissolved
- extendedWaitUntil:
    visible:
      id: person-screen-title
    timeout: 60000
- takeScreenshot: ${EVIDENCE}/13h-state-member-profile
