appId: au.com.opax.app
name: 13h Today with a federal and a Victorian state seat saved
---
# OPAXSeat federal+state saves Melbourne and a Victorian district. Your
# representatives is one group: the federal member's row, then the state
# lower-house member's row, then the senators link, under one source line.
# The Victorian Legislative Assembly dissolved on 3 November 2026 for the 28
# November election, so at this capture date the state row says who last
# held the district, never "member for". The old state seat card is gone.
# Today draws no authorisation line; the election block has its own.
- launchApp:
    clearState: true
    arguments:
      OPAXSeat: federal+state
- extendedWaitUntil:
    visible:
      id: today-your-mp
    timeout: 60000
- assertVisible:
    id: today-reps-heading
    text: Your representatives
- assertVisible:
    id: today-rep-federal
    text: .*, Federal member for Melbourne
- assertVisible:
    id: today-rep-state
    text: .*, last held .* in the Victorian Legislative Assembly
- scrollUntilVisible:
    element:
      id: today-your-mp-sources
    timeout: 90000
    centerElement: true
    speed: 20
- assertVisible:
    id: today-reps-senators
    text: Senators for Victoria.*
- takeScreenshot: ${EVIDENCE}/13h-representatives
- assertNotVisible:
    id: today-state-seat
- assertNotVisible:
    id: today-state-seat-header
# The state row opens that member's profile.
- tapOn:
    id: today-rep-state
- extendedWaitUntil:
    visible:
      id: person-screen-title
    timeout: 60000
- takeScreenshot: ${EVIDENCE}/13h-state-member-profile
