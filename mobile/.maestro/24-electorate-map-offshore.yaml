appId: au.com.opax.app
name: 24 Offshore has no match and the manual chooser works
---
- launchApp:
    clearState: true
- tapOn:
    id: tab-your-mp
- scrollUntilVisible:
    element:
      id: use-my-location
    direction: UP
    centerElement: true
    timeout: 300000
- tapOn:
    id: use-my-location
- extendedWaitUntil:
    visible: Allow Once
    timeout: 15000
- tapOn: Allow Once
- extendedWaitUntil:
    visible:
      id: location-no-match
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/24-offshore-no-match
- runFlow:
    file: support/location-manual-seat.yaml
- takeScreenshot: ${EVIDENCE}/24-offshore-manual
