appId: au.com.opax.app
name: 24 Offshore has no match and the manual chooser works
---
- launchApp:
    clearState: true
    permissions:
      location: unset
- openLink: opax://seat
- extendedWaitUntil:
    visible:
      id: seat-sheet
    timeout: 30000
- scrollUntilVisible:
    element:
      id: use-my-location
    centerElement: true
    timeout: 60000
- tapOn:
    id: use-my-location
- extendedWaitUntil:
    visible: Allow Once
    timeout: 15000
- scrollUntilVisible:
    element: Allow Once
    centerElement: false
    timeout: 300000
- tapOn: Allow Once
- scrollUntilVisible:
    element:
      id: location-no-match
    centerElement: true
    timeout: 300000
- assertVisible: Your location isn.t inside a federal electorate. Search by name instead.
- takeScreenshot: ${EVIDENCE}/24-offshore-no-match
- runFlow:
    file: support/location-manual-seat.yaml
- takeScreenshot: ${EVIDENCE}/24-offshore-manual
