appId: au.com.opax.app
name: 07 Choose a state district explicitly where a verified roster exists
---
- launchApp:
    clearState: true
- openLink: opax://seat
- extendedWaitUntil:
    visible:
      id: seat-sheet
    timeout: 30000
- tapOn: Electorate or member.s name
- inputText: Ballarat
- extendedWaitUntil:
    visible:
      id: seat-row-federal-representatives-vic-ballarat
    timeout: 30000
- tapOn:
    id: seat-row-federal-representatives-vic-ballarat
- extendedWaitUntil:
    notVisible:
      id: seat-sheet
    timeout: 10000
- tapOn:
    id: tab-your-mp
- runFlow:
    file: support/open-your-register.yaml
    env:
      REGISTER_PREFIX: 07-state
- extendedWaitUntil:
    visible:
      id: your-latest-source
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/07-state-register-open
- scrollUntilVisible:
    element:
      id: choose-state-seat
    timeout: 300000
    centerElement: true
- takeScreenshot: ${EVIDENCE}/07-state-choice-needed
- tapOn:
    id: choose-state-seat
# The Victorian chooser: districts and regions, one title in the bar.
- extendedWaitUntil:
    visible: Victorian electorate
    timeout: 15000
- tapOn: District, region or member.s name
- inputText: Wendouree
- extendedWaitUntil:
    visible:
      id: seat-row-vic-vic-la-vic-wendouree
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/07-state-chooser
- tapOn:
    id: seat-row-vic-vic-la-vic-wendouree
- extendedWaitUntil:
    notVisible:
      id: seat-sheet
    timeout: 10000
- scrollUntilVisible:
    element:
      id: your-state-member-juliana-addison
    timeout: 300000
    centerElement: true
    visibilityPercentage: 50
- takeScreenshot: ${EVIDENCE}/07-state-member
- runFlow:
    file: review-pages.yaml
    env:
      END: your-mp-end
      PREFIX: 07-state-details
- launchApp
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-your-mp
- scrollUntilVisible:
    element:
      id: your-state-member-juliana-addison
    timeout: 300000
    centerElement: true
    visibilityPercentage: 50
- takeScreenshot: ${EVIDENCE}/07-state-restored
- runFlow:
    file: review-pages.yaml
    env:
      END: your-mp-end
      PREFIX: 07-state-restored-details
# Changing the district replaces the old one; the saved one carries a
# checkmark in the chooser.
- openLink: opax://seat?scope=vic
- extendedWaitUntil:
    visible: Victorian electorate
    timeout: 15000
- tapOn: District, region or member.s name
- inputText: Eureka
- extendedWaitUntil:
    visible:
      id: seat-row-vic-vic-la-vic-eureka
    timeout: 30000
- tapOn:
    id: seat-row-vic-vic-la-vic-eureka
- extendedWaitUntil:
    notVisible:
      id: seat-sheet
    timeout: 10000
- assertNotVisible:
    id: your-state-member-juliana-addison
- takeScreenshot: ${EVIDENCE}/07-state-replaced
- scrollUntilVisible:
    element:
      id: your-seat-name
    direction: UP
    centerElement: true
    timeout: 300000
- assertVisible: Ballarat.*
