appId: au.com.opax.app
name: 23 Native money map, held figures, original source and ranked list
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: today-screen-message
    timeout: 120000
# From Today the money map is one card into Public money (w5-today): the
# Public money tile, then its Parties card. Back reads "Public money", then
# "Today".
- scrollUntilVisible:
    element:
      text: Public money.*
    centerElement: true
    timeout: 120000
- takeScreenshot: ${EVIDENCE}/23-today-entry
- tapOn:
    text: Public money.*
    waitToSettleTimeoutMs: 1000
- scrollUntilVisible:
    element:
      id: money-card-parties
    centerElement: true
    timeout: 120000
- tapOn:
    id: money-card-parties
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: BackButton
      text: Public money
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/23-parties-entry
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: BackButton
      text: Today
    timeout: 30000
- tapOn:
    id: BackButton
- assertVisible:
    id: today-screen
# The map itself, by its link: pushed in the Today stack.
- openLink: opax://money
- scrollUntilVisible:
    element:
      id: money-map-(canvas|drawn-frames-.*-pixels-.*)
    centerElement: true
    visibilityPercentage: 10
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: money-map-drawn-frames-[2-9][0-9]*-pixels-[1-9][0-9]*
    timeout: 90000
# The map is pushed in the Today stack, so its back button names Today. The
# bar can stay minimised on a pushed page at its top; the flow's end returns
# to the Today root and asserts the full bar there.
- assertVisible:
    id: BackButton
    text: Today
- assertVisible:
    id: money-view-summary
- takeScreenshot: ${EVIDENCE}/23-orbit-0
# A sideways drag on the scene orbits it without a preview tap.
- swipe:
    start: 30%, 42%
    end: 70%, 42%
    duration: 1000
- takeScreenshot: ${EVIDENCE}/23-orbit-1
- swipe:
    start: 70%, 44%
    end: 30%, 39%
    duration: 1000
- takeScreenshot: ${EVIDENCE}/23-orbit-2
# This accessible action writes the same from/to params as the Years row.
- runFlow:
    file: support/money-screen-scroll.yaml
    env:
      TARGET_ID: money-test-year
- tapOn:
    id: money-test-year
- runFlow:
    file: support/money-screen-scroll-up.yaml
    env:
      TARGET_ID: money-title
# Filters is a bar button opening the Filters sheet; changes apply live.
- tapOn: Filters(, on)?
- extendedWaitUntil:
    visible:
      id: filters-screen
    timeout: 15000
- assertVisible:
    id: filters-row-years
- takeScreenshot: ${EVIDENCE}/23-filters
- tapOn:
    id: filters-row-industry
- extendedWaitUntil:
    visible:
      id: filters-choice-unions
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/23-industry
# A checkmark row: choosing one returns to the sheet.
- tapOn:
    id: filters-choice-unions
- extendedWaitUntil:
    visible:
      id: filters-row-contracts
    timeout: 15000
- tapOn:
    id: filters-row-contracts
- assertVisible:
    id: filters-reset
- takeScreenshot: ${EVIDENCE}/23-layers
- tapOn: Done
- extendedWaitUntil:
    visible:
      id: money-view-summary
      text: Donations to parties in 2024–25, union donors only
    timeout: 30000
# The focus action invokes the same callback as a tap on a node: it pushes
# the node's money record.
- runFlow:
    file: support/money-screen-scroll.yaml
    env:
      TARGET_ID: money-test-focus
- tapOn:
    id: money-test-focus
- extendedWaitUntil:
    visible:
      id: money-focus-name
      text: Labor
    timeout: 30000
- assertVisible:
    id: money-record-screen
- assertVisible:
    id: money-record-originals
- scrollUntilVisible:
    element:
      id: money-focus-amount
    centerElement: true
    visibilityPercentage: 10
    timeout: 90000
# One figure says the amount, its receipts and its year; all years beside it.
- assertVisible: 69 million dollars, in 3,929 receipts, 2024–25
- scrollUntilVisible:
    element:
      id: money-record-donations-all-years
    centerElement: true
    visibilityPercentage: 10
    timeout: 30000
- assertVisible: 'All years, \$[0-9,]+ · 60,551 receipts · 1998–99 to 2025–26'
- takeScreenshot: ${EVIDENCE}/23-focus-amount
# One source line opens the sheet; the original opens from it.
- scrollUntilVisible:
    element:
      id: money-source
    centerElement: true
    timeout: 120000
- tapOn:
    id: money-source
- extendedWaitUntil:
    visible:
      id: money-source-sheet-original-0
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/23-source-sheet
- tapOn:
    id: money-source-sheet-original-0
- scrollUntilVisible:
    element:
      id: source-destination-url
    centerElement: true
    timeout: 30000
- assertVisible: 'https://transparency\.aec\.gov\.au/'
- takeScreenshot: ${EVIDENCE}/23-source
# Done on the Original page returns to the Sources sheet stacked under it;
# a second Done (the sheet's bar button, which takes no id) closes it.
- tapOn: Done
- extendedWaitUntil:
    visible:
      id: money-source-sheet
    timeout: 15000
- tapOn: Done
- extendedWaitUntil:
    notVisible:
      id: money-source-sheet
    timeout: 15000
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: money-view-summary
    timeout: 30000
# The List view: Donors first, with the cut in its caption.
- runFlow:
    file: support/money-screen-list.yaml
- scrollUntilVisible:
    element:
      id: money-donor-caption
    centerElement: true
    timeout: 60000
- assertVisible:
    id: money-donor-caption
    text: Largest in 2024–25 among the 250 largest donors since 1998–99
- scrollUntilVisible:
    element:
      id: money-donor-0
    centerElement: true
    timeout: 120000
# No rank number; name, years and parties, then the amount.
- assertVisible:
    id: money-donor-0
    text: Mining and Energy Union, 2024–25 · 1 party, 4,102,022 dollars
- takeScreenshot: ${EVIDENCE}/23-list
- tapOn:
    id: money-donor-0
- extendedWaitUntil:
    visible:
      id: money-focus-name
      text: Mining and Energy Union
    timeout: 30000
- assertVisible:
    id: money-record-screen
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: money-donor-0
    timeout: 30000
# Reset filters from the sheet: the list returns to every year and industry.
- runFlow:
    file: support/money-screen-scroll-up.yaml
    env:
      TARGET_ID: money-title
- tapOn: Filters(, on)?
- extendedWaitUntil:
    visible:
      id: filters-reset
    timeout: 15000
- tapOn:
    id: filters-reset
- tapOn: Done
- extendedWaitUntil:
    visible:
      id: money-view-summary
      text: Donations to parties, .*, and public money to donors on the map
    timeout: 30000
- runFlow:
    file: support/money-screen-scroll.yaml
    env:
      TARGET_ID: money-donor-caption
- assertVisible:
    id: money-donor-caption
    text: The 250 largest donors since 1998–99, largest first
# Individual donors are one footnote under the list, never a row.
- runFlow:
    file: support/money-screen-scroll.yaml
    env:
      TARGET_ID: money-individual-donors
- assertVisible:
    id: money-individual-donors
    text: '100 individual donors, \$147\.4m, not named\.'
- takeScreenshot: ${EVIDENCE}/23-list-all-years
# See all opens every donor on the map.
- runFlow:
    file: support/money-screen-scroll-up.yaml
    env:
      TARGET_ID: money-donors-all
- tapOn:
    id: money-donors-all
- extendedWaitUntil:
    visible:
      id: money-donors-screen
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: money-donors-caption
      text: '[0-9,]+ donors, largest first'
    timeout: 30000
- assertVisible:
    id: money-donor-0
- takeScreenshot: ${EVIDENCE}/23-donors
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: money-donors-all
    timeout: 30000
# Parties: Labor first; each row pushes its record.
- runFlow:
    file: support/money-screen-scroll.yaml
    env:
      TARGET_ID: money-party-0
- assertVisible:
    id: money-party-0
    text: Labor.*
- tapOn:
    id: money-party-0
- extendedWaitUntil:
    visible:
      id: money-focus-name
      text: Labor
    timeout: 30000
- tapOn:
    id: BackButton
# Public money: the contracts held by donors on the map.
- runFlow:
    file: support/money-screen-scroll.yaml
    env:
      TARGET_ID: money-public-contracts
- tapOn:
    id: money-public-contracts
- extendedWaitUntil:
    visible:
      id: money-record-contracts
    timeout: 30000
- scrollUntilVisible:
    element:
      id: money-focus-amount
    centerElement: true
    visibilityPercentage: 10
    timeout: 30000
- assertVisible: .*in contracts to donors on the map, .*
- takeScreenshot: ${EVIDENCE}/23-list-public-money
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: money-view-summary
    timeout: 30000
# Back to the Today root, which kept its place at the Public money entry.
- runFlow:
    file: support/restore-tab-bar.yaml
    env:
      TOP_ID: today-screen-message
      TAB_ID: tab-today
