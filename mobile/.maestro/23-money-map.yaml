appId: au.com.opax.app
name: 23 Native money map, held figures, original source and ranked list
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      id: today-money-map
    centerElement: true
    timeout: 120000
- tapOn:
    id: today-money-map
- scrollUntilVisible:
    element:
      id: money-map-(canvas|drawn-frames-.*-pixels-.*)
    centerElement: true
    visibilityPercentage: 10
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: money-map-drawn-frames-[2-9][0-9]*-pixels-[1-9][0-9]*
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/23-orbit-0
- swipe:
    start: 30%, 42%
    end: 70%, 42%
    duration: 1000
- takeScreenshot: ${EVIDENCE}/23-orbit-1
- swipe:
    start: 70%, 44%
    end: 30%, 39%
    duration: 1000
- takeScreenshot: ${EVIDENCE}/23-orbit-2
# This accessible action uses the same year setter as the adjustable rails.
- runFlow:
    file: support/money-screen-scroll.yaml
    env:
      TARGET_ID: money-test-year
      SCROLL_START: "97%, 85%"
      SCROLL_END: "97%, 30%"
- tapOn:
    id: money-test-year
- runFlow:
    file: support/money-screen-scroll.yaml
    env:
      TARGET_ID: money-filters
      SCROLL_START: "97%, 30%"
      SCROLL_END: "97%, 85%"
- tapOn:
    id: money-filters
- runFlow:
    file: support/money-screen-scroll.yaml
    env:
      TARGET_ID: money-from-year
      SCROLL_START: "97%, 85%"
      SCROLL_END: "97%, 30%"
- takeScreenshot: ${EVIDENCE}/23-from-year
- runFlow:
    file: support/money-screen-scroll.yaml
    env:
      TARGET_ID: money-to-year
      SCROLL_START: "97%, 85%"
      SCROLL_END: "97%, 30%"
- takeScreenshot: ${EVIDENCE}/23-to-year
- runFlow:
    file: support/money-screen-scroll.yaml
    env:
      TARGET_ID: money-industry
      SCROLL_START: "97%, 85%"
      SCROLL_END: "97%, 30%"
- tapOn:
    id: money-industry
- runFlow:
    file: support/money-screen-scroll.yaml
    env:
      TARGET_ID: money-industry-unions
      SCROLL_START: "97%, 85%"
      SCROLL_END: "97%, 30%"
- tapOn:
    id: money-industry-unions
- runFlow:
    file: support/money-screen-scroll.yaml
    env:
      TARGET_ID: money-layer-contracts
      SCROLL_START: "97%, 85%"
      SCROLL_END: "97%, 30%"
- tapOn:
    id: money-layer-contracts
- takeScreenshot: ${EVIDENCE}/23-layers
# The focus action invokes the same scene focus and sheet callback as a tap.
- runFlow:
    file: support/money-screen-scroll.yaml
    env:
      TARGET_ID: money-test-focus
      SCROLL_START: "97%, 85%"
      SCROLL_END: "97%, 30%"
- tapOn:
    id: money-test-focus
- extendedWaitUntil:
    visible:
      id: money-focus-name
      text: Labor
    timeout: 30000
- scrollUntilVisible:
    element:
      id: money-focus-amount
    centerElement: true
    visibilityPercentage: 10
    timeout: 90000
- assertVisible: '69,010,542 dollars, Disclosed receipts'
- takeScreenshot: ${EVIDENCE}/23-focus-amount
- scrollUntilVisible:
    element:
      id: money-focus-years
    centerElement: true
    timeout: 90000
- assertVisible: 'Financial years, 2024–25'
- assertVisible: 'Receipts, 3,929'
- takeScreenshot: ${EVIDENCE}/23-focus-years
- scrollUntilVisible:
    element:
      id: money-source
    centerElement: true
    timeout: 120000
- tapOn:
    id: money-source
- scrollUntilVisible:
    element:
      id: source-destination-url
    centerElement: true
    timeout: 30000
- assertVisible: 'https://transparency\.aec\.gov\.au/'
- takeScreenshot: ${EVIDENCE}/23-source
- scrollUntilVisible:
    element:
      id: source-destination-ok
    centerElement: true
    timeout: 30000
- tapOn:
    id: source-destination-ok
- tapOn: Done
- runFlow:
    file: support/money-screen-scroll.yaml
    env:
      TARGET_ID: money-mode-list
      SCROLL_START: "97%, 30%"
      SCROLL_END: "97%, 85%"
- tapOn:
    id: money-mode-list
- scrollUntilVisible:
    element:
      id: money-donor-0
    centerElement: true
    timeout: 120000
- assertVisible: '1\. Mining and Energy Union, \$4,102,022 disclosed donations.*2024–25'
- takeScreenshot: ${EVIDENCE}/23-list
- scrollUntilVisible:
    element:
      id: money-donor-parties-0
    centerElement: true
    timeout: 30000
- assertVisible:
    id: money-donor-parties-0
    text: Labor
- scrollUntilVisible:
    element:
      id: money-donor-source-0
    centerElement: true
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/23-list-source
