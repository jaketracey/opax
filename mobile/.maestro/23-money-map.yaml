appId: au.com.opax.app
name: 23 Native money map, held figures, original source and ranked list
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: today-screen-message
    timeout: 120000
# From Today the money map is one card into Public money (w5-today): the
# Public money tile, then its Parties card. Back reads "Public money", then
# "Today".
- scrollUntilVisible:
    element:
      text: Public money.*
    centerElement: true
    timeout: 120000
- takeScreenshot: ${EVIDENCE}/23-today-entry
- tapOn:
    text: Public money.*
    waitToSettleTimeoutMs: 1000
- scrollUntilVisible:
    element:
      id: money-card-parties
    centerElement: true
    timeout: 120000
- tapOn:
    id: money-card-parties
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: BackButton
      text: Public money
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/23-parties-entry
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: BackButton
      text: Today
    timeout: 30000
- tapOn:
    id: BackButton
- assertVisible:
    id: today-screen
# The map itself, by its link: pushed in the Today stack. The stage fills
# the screen; its testID says how many pixels Skia drew once the layout
# settled (e2e builds read the native raster back).
- openLink: opax://money
# A fresh simulator asks before opening a scheme link from the test runner.
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible:
      id: money-map-(canvas|drawn-pixels-.*)
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: money-map-drawn-pixels-[1-9][0-9]*
    timeout: 90000
# The map is pushed in the Today stack, so its back button names Today. The
# bar can stay minimised on a pushed page at its top; the flow's end returns
# to the Today root and asserts the full bar there.
- assertVisible:
    id: BackButton
    text: Today
- assertVisible:
    id: money-view-summary
- takeScreenshot: ${EVIDENCE}/23-map-0
# A drag on the stage pans the map (momentum follows the finger).
- swipe:
    start: 30%, 50%
    end: 70%, 50%
    duration: 1000
- takeScreenshot: ${EVIDENCE}/23-map-1
- swipe:
    start: 70%, 52%
    end: 30%, 47%
    duration: 1000
- takeScreenshot: ${EVIDENCE}/23-map-2
# This accessible action writes the same from/to params as the Years row.
- runFlow:
    file: support/money-screen-scroll.yaml
    env:
      TARGET_ID: money-test-year
- tapOn:
    id: money-test-year
# Filters is a bar button opening the Filters sheet; changes apply live.
- tapOn: Filters(, on)?
- extendedWaitUntil:
    visible:
      id: filters-screen
    timeout: 15000
- assertVisible:
    id: filters-row-years
- takeScreenshot: ${EVIDENCE}/23-filters
- tapOn:
    id: filters-row-industry
# Expand the medium sheet before using Maestro's centre-of-screen scroll.
- runFlow:
    when:
      visible: Half screen
    commands:
      - swipe:
          from:
            text: Half screen
          direction: UP
          duration: 600
      - waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: filters-choice-unions
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 60000
- takeScreenshot: ${EVIDENCE}/23-industry
# Industry allows multiple choices, so selection keeps the list open.
- tapOn:
    id: filters-choice-unions
- tapOn:
    id: BackButton
    text: Filters
- extendedWaitUntil:
    visible:
      id: filters-row-contracts
    timeout: 15000
- tapOn:
    id: filters-row-contracts
- assertVisible:
    id: filters-reset
- takeScreenshot: ${EVIDENCE}/23-layers
- tapOn: Done
- extendedWaitUntil:
    visible:
      id: money-view-summary
      text: Money to parties in 2024–25, union donors only
    timeout: 30000
# The focus action invokes the same callback as a tap on a node: it pushes
# the node's money record.
- runFlow:
    file: support/money-screen-scroll.yaml
    env:
      TARGET_ID: money-test-focus
- tapOn:
    id: money-test-focus
- extendedWaitUntil:
    visible:
      id: money-focus-name
      text: Labor
    timeout: 30000
- assertVisible:
    id: money-record-screen
- scrollUntilVisible:
    element:
      id: money-focus-amount
    centerElement: true
    visibilityPercentage: 10
    timeout: 90000
# One figure says the amount, its disclosure records and year; all years beside it.
- assertVisible: 69 million dollars, in 3,929 disclosure records, 2024–25
- scrollUntilVisible:
    element:
      id: money-record-donations-all-years
    centerElement: true
    visibilityPercentage: 10
    timeout: 30000
- assertVisible: 'All years, \$[0-9,]+ · 60,551 disclosure records · 1998–99 to 2025–26'
- takeScreenshot: ${EVIDENCE}/23-focus-amount
# Originals follows the money section and its 15 donor rows.
- scrollUntilVisible:
    element:
      id: money-record-originals
    direction: DOWN
    centerElement: true
    timeout: 120000
- assertVisible:
    id: money-record-originals
# The source is above Originals. Pull it clear of the bar before centring
# upwards: screen-bounds visibility alone includes the covered bar area.
- swipe:
    start: 50%, 40%
    end: 50%, 60%
    duration: 600
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: money-source
    direction: UP
    centerElement: true
    timeout: 120000
- waitForAnimationToEnd
# One source line opens the sheet; the original opens from it.
- tapOn:
    id: money-source
- extendedWaitUntil:
    visible:
      id: money-source-sheet-original-0
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/23-source-sheet
- tapOn:
    id: money-source-sheet-original-0
- scrollUntilVisible:
    element:
      id: source-destination-url
    centerElement: true
    timeout: 30000
- assertVisible: 'https://transparency\.aec\.gov\.au/'
- takeScreenshot: ${EVIDENCE}/23-source
# Done on the Original page returns to the Sources sheet stacked under it;
# a second Done (the sheet's bar button, which takes no id) closes it.
- tapOn: Done
- extendedWaitUntil:
    visible:
      id: money-source-sheet
    timeout: 15000
- tapOn: Done
- extendedWaitUntil:
    notVisible:
      id: money-source-sheet
    timeout: 15000
- tapOn:
    id: BackButton
# Back lands on the map with its summary line and filters as they were.
- extendedWaitUntil:
    visible:
      id: money-screen
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: money-view-summary
      text: Money to parties in 2024–25, union donors only
    timeout: 30000
# The List view: Donors first, with the cut in its caption.
- runFlow:
    file: support/money-screen-list.yaml
- scrollUntilVisible:
    element:
      id: money-donor-caption
    centerElement: true
    timeout: 60000
- assertVisible:
    id: money-donor-caption
    text: Largest in 2024–25 among the 250 largest donors since 1998–99
- scrollUntilVisible:
    element:
      id: money-donor-0
    centerElement: true
    timeout: 120000
# No rank number; name, years and parties, then the amount.
- assertVisible:
    id: money-donor-0
    text: Mining and Energy Union, 2024–25 · 1 party, 4,102,022 dollars
- takeScreenshot: ${EVIDENCE}/23-list
- tapOn:
    id: money-donor-0
- extendedWaitUntil:
    visible:
      id: money-focus-name
      text: Mining and Energy Union
    timeout: 30000
- assertVisible:
    id: money-record-screen
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: money-donor-0
    timeout: 30000
# Reset filters from the sheet: the list returns to every year and industry.
- tapOn: Filters(, on)?
# Reset sits under the facets and Show toggles: below the fold at the sheet's
# half-height detent. A plain scroll moves the map behind the sheet, so drag
# inside the sheet itself until Reset is on screen.
- extendedWaitUntil:
    visible:
      id: filters-screen
    timeout: 15000
- repeat:
    while:
      notVisible:
        id: filters-reset
    times: 4
    commands:
      - swipe:
          start: 50%, 90%
          end: 50%, 62%
          duration: 500
      - waitForAnimationToEnd
- tapOn:
    id: filters-reset
- tapOn: Done
# The List view keeps its scroll position across the sheet; the summary sits
# under the title, so scroll back up to it.
- runFlow:
    file: support/money-screen-scroll-up.yaml
    env:
      TARGET_ID: money-view-summary
- extendedWaitUntil:
    visible:
      id: money-view-summary
      text: Money to parties, .*, and public money to donors on the map
    timeout: 30000
- runFlow:
    file: support/money-screen-scroll.yaml
    env:
      TARGET_ID: money-donor-caption
- assertVisible:
    id: money-donor-caption
    text: The 250 largest donors since 1998–99, largest first
# Every donor is a row under its own name, down to the last of the 20.
- runFlow:
    file: support/money-screen-scroll.yaml
    env:
      TARGET_ID: money-donor-19
- assertVisible:
    id: money-donor-19
- takeScreenshot: ${EVIDENCE}/23-list-all-years
# See all is above the last row. Centre it on the way back up so its
# 44-point action does not stop under the navigation bar.
- scrollUntilVisible:
    element:
      id: money-donors-all
    direction: UP
    centerElement: true
    speed: 20
    timeout: 120000
- waitForAnimationToEnd
- tapOn:
    id: money-donors-all
- extendedWaitUntil:
    visible:
      id: money-donors-screen
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: money-donors-caption
      text: '[0-9,]+ donors, largest first'
    timeout: 30000
- assertVisible:
    id: money-donor-0
- takeScreenshot: ${EVIDENCE}/23-donors
- tapOn:
    id: BackButton
- extendedWaitUntil:
    visible:
      id: money-donors-all
    timeout: 30000
# Parties: Labor first; each row pushes its record.
# Centre the row itself. An extra fixed swipe can push it under the nav bar.
- scrollUntilVisible:
    element:
      id: money-party-0
    direction: DOWN
    centerElement: true
    visibilityPercentage: 100
    speed: 20
    timeout: 120000
- waitForAnimationToEnd
- assertVisible:
    id: money-party-0
    text: Labor.*
- tapOn:
    id: money-party-0
- extendedWaitUntil:
    visible:
      id: money-focus-name
      text: Labor
    timeout: 30000
- tapOn:
    id: BackButton
# Public money: the contracts held by donors on the map.
- scrollUntilVisible:
    element:
      id: money-public-contracts
    direction: DOWN
    centerElement: true
    visibilityPercentage: 100
    speed: 20
    timeout: 120000
- waitForAnimationToEnd
- tapOn:
    id: money-public-contracts
- extendedWaitUntil:
    visible:
      id: money-record-contracts
    timeout: 30000
- scrollUntilVisible:
    element:
      id: money-focus-amount
    centerElement: true
    visibilityPercentage: 10
    timeout: 30000
- assertVisible: .*in contracts to donors on the map, .*
- takeScreenshot: ${EVIDENCE}/23-list-public-money
- tapOn:
    id: BackButton
# The List keeps its Public money offset; its summary is above the rows.
- extendedWaitUntil:
    visible:
      id: money-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: money-view-summary
    direction: UP
    centerElement: true
    speed: 20
    timeout: 120000
- extendedWaitUntil:
    visible:
      id: money-view-summary
    timeout: 30000
# Back to the Today root, which kept its place at the Public money entry.
- runFlow:
    file: support/restore-tab-bar.yaml
    env:
      TOP_ID: today-screen-message
      TAB_ID: tab-today
