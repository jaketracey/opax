appId: au.com.opax.app
name: 28g A federal seat with no member recorded, chosen from Today
---
# journeys/first-launch.md 4.9. Run on its own, by path, against a fixture
# roster with Grayndler's member removed:
#   OPAX_FIXTURE_ROSTER=vacant scripts/e2e.sh <udid> .maestro/28g-vacant-seat.yaml
# The chooser still lists the seat ("No member recorded yet"); Today's tile
# names the seat, says so in one line in place of the member, opens the
# electorate and keeps its dated line.
- launchApp:
    clearState: true
    arguments:
      OPAXSeat: none
      OPAXWelcomeDeclined: none
- extendedWaitUntil:
    visible:
      id: today-screen
    timeout: 60000
- scrollUntilVisible:
    element:
      id: today-invitation
    direction: DOWN
    timeout: 90000
    centerElement: true
    speed: 20
- scrollUntilVisible:
    element:
      id: today-invitation-find
    direction: DOWN
    timeout: 90000
    centerElement: true
    speed: 20
- tapOn:
    id: today-invitation-find
- extendedWaitUntil:
    visible:
      id: seat-sheet
    timeout: 15000
- tapOn: Electorate or member.s name
- inputText: Grayndler
- extendedWaitUntil:
    visible:
      id: seat-row-federal-representatives-nsw-grayndler
      text: .*No member recorded yet.*
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/28g-seat-row
- tapOn:
    id: seat-row-federal-representatives-nsw-grayndler
- extendedWaitUntil:
    visible:
      id: today-your-mp
    timeout: 30000
- assertVisible:
    id: today-your-mp-vacant
    text: Your electorate, Grayndler\. No member is recorded for this seat yet\.
- assertNotVisible:
    id: today-your-mp-member
- scrollUntilVisible:
    element:
      id: today-your-mp-sources
      text: Updated \d{1,2} \w{3} \d{4}.*
    timeout: 90000
    centerElement: true
    speed: 20
- takeScreenshot: ${EVIDENCE}/28g-today-card
