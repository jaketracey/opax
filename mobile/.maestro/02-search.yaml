appId: au.com.opax.app
name: 02 Search the public people catalog
---
- launchApp:
    clearState: true
    permissions: {}
- tapOn:
    id: tab-search
- runFlow:
    file: support/search-query.yaml
    env:
      QUERY: Anthony Albanese
      PREFIX: 02
# Return submits and dismisses the keyboard; a swipe can land on the
# keyboard itself at AX5.
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: search-submit
- tapOn:
    id: search-submit
- scrollUntilVisible:
    element:
      id: search-result-anthony-albanese
- takeScreenshot: ${EVIDENCE}/02-search
- tapOn:
    id: search-result-anthony-albanese
- extendedWaitUntil:
    visible:
      id: person-screen-title
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/02-person-name
- scrollUntilVisible:
    element:
      id: person-party
