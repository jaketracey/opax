appId: au.com.opax.app
name: 13b Today with no daily edition published
---
# Run on its own, by path, against the no-edition fixture:
#   OPAX_FIXTURE_EDITION=absent scripts/e2e.sh <udid> .maestro/13b-today-no-edition.yaml
# The fixture then answers the edition as the Worker does when none is posted
# (404 edition_not_published). clearState, so no saved edition stands in.
- launchApp:
    clearState: true
- assertVisible:
    id: today-screen-message
# The feeds still load: wait for them, so the edition read has answered too.
- scrollUntilVisible:
    element:
      id: today-bill-0
    timeout: 90000
    visibilityPercentage: 1
    centerElement: true
- scrollUntilVisible:
    element:
      id: today-screen-message
    timeout: 90000
    direction: UP
# No section, no placeholder and no error: the card simply is not there.
- assertNotVisible:
    id: today-edition
- assertNotVisible:
    id: today-edition-loading
- assertNotVisible:
    id: today-edition-error
- assertNotVisible: Daily edition
# No seat saved: find the invitation, Bills and daily pair by id. The
# optional election block can occupy the slot after the invitation.
- assertVisible:
    id: today-invitation
- takeScreenshot: ${EVIDENCE}/13b-no-edition
# The block (header, New and Passed, three bills) is about 600 pt tall:
# full visibility while centring never settles, so half of it is enough.
- scrollUntilVisible:
    element:
      id: today-bills
    direction: DOWN
    timeout: 90000
    visibilityPercentage: 50
    centerElement: true
    speed: 20
- assertVisible:
    id: today-bills
- scrollUntilVisible:
    element:
      id: today-pair
    direction: UP
    timeout: 30000
    visibilityPercentage: 10
- assertVisible:
    id: today-pair
- takeScreenshot: ${EVIDENCE}/13b-daily-pair
