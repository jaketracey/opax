appId: au.com.opax.app
---
# Swipe at the trailing edge, clear of the scene (a sideways drag orbits it)
# and of its Fit map button. The page holds no inline controls: the scene,
# two figure blocks, or the List view's sections.
- repeat:
    times: 18
    while:
      notVisible:
        id: ${TARGET_ID}
    commands:
      - swipe:
          start: 97%, 30%
          end: 97%, 85%
          duration: 600
- assertVisible:
    id: ${TARGET_ID}
