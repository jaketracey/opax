appId: au.com.opax.app
---
# Keep page scrolling outside the native canvas, whose one-finger pan orbits.
- repeat:
    times: 18
    while:
      notVisible:
        id: ${TARGET_ID}
    commands:
      - swipe:
          start: 97%, 30%
          end: 97%, 85%
          duration: 600
- assertVisible:
    id: ${TARGET_ID}
