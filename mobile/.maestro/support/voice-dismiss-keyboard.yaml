appId: au.com.opax.app
---
# Always drag above the keyboard first. scrollUntilVisible skips the drag when
# the heading is already visible, leaving the numeric keyboard over the buttons.
- swipe:
    start: 90%, 40%
    end: 90%, 15%
    duration: 600
- scrollUntilVisible:
    element:
      id: voice-bridge-test-title
    direction: UP
- tapOn:
    id: voice-bridge-test-title
