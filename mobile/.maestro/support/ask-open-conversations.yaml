appId: au.com.opax.app
name: Open Conversations from the bar's clock or the idle page's See all conversations
---
- runFlow:
    when:
      visible:
        id: ask-see-all-conversations
    commands:
      - tapOn:
          id: ask-see-all-conversations
- runFlow:
    when:
      notVisible:
        id: ask-history-screen
    commands:
      # "Your conversations" until chrome.ts takes the journey's name.
      - tapOn: '(Your c|C)onversations'
- extendedWaitUntil:
    visible:
      id: ask-history-screen
    timeout: 15000
