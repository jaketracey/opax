appId: au.com.opax.app
name: iPad Windowed Apps (the simulator default), restored
---
- launchApp:
    appId: com.apple.Preferences
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      text: Multitasking & Gestures
    timeout: 30000
- tapOn:
    text: Multitasking & Gestures
    waitToSettleTimeoutMs: 3000
- extendedWaitUntil:
    visible:
      text: Windowed Apps
    timeout: 30000
- tapOn:
    text: Windowed Apps
    waitToSettleTimeoutMs: 3000
- waitForAnimationToEnd
