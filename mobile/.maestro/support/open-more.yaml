appId: au.com.opax.app
name: Open the page bar menu
---
- extendedWaitUntil:
    visible: 'More for ${NAME}'
    timeout: 30000
# Prefer the native bar id. Android and iPad pane buttons share the label
# but have different ids. Remember the chosen branch before the menu opens.
- evalScript: ${output.openMoreTapped = false}
- runFlow:
    when:
      visible:
        id: header-more
        text: 'More for ${NAME}'
    commands:
      - tapOn:
          id: header-more
          text: 'More for ${NAME}'
      - evalScript: ${output.openMoreTapped = true}
- runFlow:
    when:
      true: ${!output.openMoreTapped}
    commands:
      - tapOn: 'More for ${NAME}'
