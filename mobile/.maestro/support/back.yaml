appId: au.com.opax.app
name: Go back one screen
---
# iOS 26 gives the navigation bar's back button the id BackButton. iOS 18
# gives it none: it reads as the previous screen's title, or "Back" when that
# does not fit. BACK names that title. The topmost match is the bar's button,
# above any tab of the same name. (A swipe from the left edge did not go back
# on iOS 18.6: Maestro's drag never starts the edge gesture.)
# Android replaces this file with its back key (android/support/back.yaml).
- evalScript: ${output.backTapped = false}
- runFlow:
    when:
      visible:
        id: BackButton
    commands:
      - tapOn:
          id: BackButton
      - evalScript: ${output.backTapped = true}
- runFlow:
    when:
      true: ${!output.backTapped}
    commands:
      - tapOn:
          text: "^(${typeof BACK === 'undefined' ? 'Back' : BACK}|Back)$"
          index: 0
- waitForAnimationToEnd
