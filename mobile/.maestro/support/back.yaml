appId: au.com.opax.app
name: Go back one screen
---
# iOS 26 gives the navigation bar's back button the id BackButton. iOS 18
# gives it none: it reads as the previous screen's title, or "Back" when that
# does not fit. BACK names that title (escaped here for the regex). The tap is
# kept above the tab bar, so a missing back button fails here rather than
# tapping a tab of the same name, which would pop to the root and pass. (A
# swipe from the left edge did not go back on iOS 18.6: Maestro's drag never
# starts the edge gesture.)
# Android replaces this file with its back key (android/support/back.yaml).
- evalScript: '${output.backTitle = (typeof BACK === ''undefined'' ? ''Back'' : BACK).split('''').map(c => ''^$.|?*+()[]''.indexOf(c) < 0 ? c : ''\\'' + c).join('''')}'
- evalScript: ${output.backTapped = false}
- runFlow:
    when:
      visible:
        id: BackButton
    commands:
      - tapOn:
          id: BackButton
      - evalScript: ${output.backTapped = true}
- runFlow:
    when:
      true: ${!output.backTapped}
    commands:
      - tapOn:
          text: "^(${output.backTitle}|Back)$"
          above:
            id: tab-today
          index: 0
- waitForAnimationToEnd
