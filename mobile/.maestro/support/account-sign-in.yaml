appId: au.com.opax.app
---
# A tap while a scroll is still settling is absorbed by the scroll view
# (seen at AX5), so every tap waits for the screen to settle first.
# From Account and about, signed out: sign in with ${ACCOUNT_EMAIL} and the
# fixture's synthetic code. The fixture never sends email.
- scrollUntilVisible:
    element:
      id: account-sign-in-start
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: account-sign-in-start
- scrollUntilVisible:
    element:
      id: account-email
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: account-email
- inputText: ${ACCOUNT_EMAIL}
# Return sends: at AX5 a keyboard swipe would land on the keys.
- pressKey: Enter
# Waits for the code step and brings the field above the keyboard; a full
# code submits by itself.
- scrollUntilVisible:
    element:
      id: account-code
    centerElement: true
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: account-code
- inputText: '01234567'
