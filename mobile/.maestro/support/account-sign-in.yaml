appId: au.com.opax.app
---
# From Account and about, signed out: sign in with ${ACCOUNT_EMAIL} and the
# fixture's synthetic code. The fixture never sends email.
# Tap targets are reached by scrolling down from above, never centred: at AX5
# centring overshoots a tall button under the sheet's header, and a tap there
# hits the header. Each tap also waits for the screen to settle.
- scrollUntilVisible:
    element:
      id: account-sign-in-start
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: account-sign-in-start
- scrollUntilVisible:
    element:
      id: account-email
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: account-email
- inputText: ${ACCOUNT_EMAIL}
# Return sends: at AX5 a keyboard swipe would land on the keys.
- pressKey: Enter
# The code step can open mid-page; start from its heading.
- scrollUntilVisible:
    element:
      text: Enter the code
    direction: UP
    timeout: 30000
- scrollUntilVisible:
    element:
      id: account-code
    timeout: 30000
- waitForAnimationToEnd
- tapOn:
    id: account-code
# A full code submits by itself.
- inputText: '01234567'
