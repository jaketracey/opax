appId: au.com.opax.app
---
# Hierarchy visibility includes views underneath native controls. Measure the
# whole question and progress/error against the inline bar's visible controls,
# scroll viewport, composer, tab bar and keyboard. UIKit's retained large-title
# frame and keyboard-controller scroll insets are not visible occlusion edges.
# Re-read while the reveal scroll settles; missing measurements fail closed.
- copyTextFrom:
    id: search-geometry
- runScript: ask-progress-visible.js
- repeat:
    while:
      true: ${!output.askVisible}
    times: 8
    commands:
      - waitForAnimationToEnd:
          timeout: 1000
      - copyTextFrom:
          id: search-geometry
      - runScript: ask-progress-visible.js
- assertTrue:
    condition: ${output.askVisible}
    label: The whole question and progress or error are readable between the visible bar controls and composer
