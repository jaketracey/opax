appId: au.com.opax.app
name: Return to the tab root and reveal the native tab bar
---
# The bar minimises on scroll down (minimizeBehavior onScrollDown) and a
# pushed page inherits that. A pushed page already at its top cannot bring it
# back, so go back to the tab root first, where scrolling up expands it.
#
# TAB_ID is the tab to assert once the full bar shows. Reveal the bar before
# looking for content: TOP_ID may be below the current position or removed.
- repeat:
    times: 12
    while:
      visible:
        id: BackButton
    commands:
      - tapOn:
          id: BackButton
      - waitForAnimationToEnd
# A short downward content scroll followed by an upward one expands the bar,
# including at the top or bottom of a root. Never chase a content anchor here.
- repeat:
    times: 3
    while:
      notVisible:
        id: ${TAB_ID}
    commands:
      - swipe:
          start: 97%, 60%
          end: 97%, 45%
          duration: 600
      - swipe:
          start: 97%, 30%
          end: 97%, 85%
          duration: 600
- waitForAnimationToEnd
- assertVisible:
    id: ${TAB_ID}
# Existing callers use TOP_ID to verify the root's top. A status-bar tap
# invokes the native scroll-to-top action regardless of the retained offset.
- tapOn:
    point: 50%, 1%
# This wait succeeds even if animation outlasts its timeout, so a missed
# status-bar tap still reaches the bounded fallback instead of failing early.
- waitForAnimationToEnd:
    timeout: 5000
- repeat:
    times: 12
    while:
      notVisible:
        id: ${TOP_ID}
    commands:
      - swipe:
          start: 97%, 30%
          end: 97%, 85%
          duration: 600
- assertVisible:
    id: ${TOP_ID}
