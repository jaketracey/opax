appId: au.com.opax.app
name: Return to the tab root and reveal the native tab bar
---
# The bar minimises on scroll down (minimizeBehavior onScrollDown) and a
# pushed page inherits that. A pushed page already at its top cannot bring it
# back, so go back to the tab root first, where scrolling up expands it.
#
# TOP_ID is an anchor on the tab root: its first element, or the entry the
# flow left it at (a root keeps its scroll position). TAB_ID is the tab to
# assert once the full bar shows.
- repeat:
    times: 12
    while:
      visible:
        id: BackButton
    commands:
      - tapOn:
          id: BackButton
      - waitForAnimationToEnd
# Scroll up on the root, at the edge, until the anchor shows.
- repeat:
    times: 160
    while:
      notVisible:
        id: ${TOP_ID}
    commands:
      - swipe:
          start: 97%, 30%
          end: 97%, 85%
          duration: 600
- assertVisible:
    id: ${TOP_ID}
# A root already at its top: scroll down a little, then back up. The upward
# scroll is what expands a minimised bar.
- runFlow:
    when:
      notVisible:
        id: ${TAB_ID}
    commands:
      - swipe:
          start: 97%, 60%
          end: 97%, 45%
          duration: 600
      - swipe:
          start: 97%, 40%
          end: 97%, 75%
          duration: 600
- waitForAnimationToEnd
- assertVisible:
    id: ${TAB_ID}
