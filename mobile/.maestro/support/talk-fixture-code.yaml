appId: au.com.opax.app
---
- scrollUntilVisible:
    timeout: 60000
    element:
      id: voice-email
    direction: UP
    centerElement: true
- tapOn:
    id: voice-email
- eraseText: 100
- inputText: ${VOICE_EMAIL}
- runFlow: talk-dismiss-keyboard.yaml
- scrollUntilVisible:
    timeout: 60000
    element:
      id: voice-request-code
    centerElement: true
- tapOn:
    id: voice-request-code
- scrollUntilVisible:
    timeout: 60000
    element:
      id: voice-code
    centerElement: true
- tapOn:
    id: voice-code
- eraseText: 100
- inputText: '01234567'
- runFlow: talk-dismiss-keyboard.yaml
- scrollUntilVisible:
    timeout: 60000
    element:
      id: voice-consume-code
    centerElement: true
- tapOn:
    id: voice-consume-code
# Disabled voice deliberately returns signed-out status even after successful
# authentication. Check the fixture's code acknowledgement instead.
- scrollUntilVisible:
    timeout: 60000
    element:
      id: voice-message
    direction: UP
- assertVisible:
    id: voice-message
    text: Code consumed
