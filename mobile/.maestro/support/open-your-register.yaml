appId: au.com.opax.app
# Lately replaced the register disclosure: scroll until its rows and their
# source line are drawn. The name is kept for the flows that call it.
---
- scrollUntilVisible:
    element:
      id: your-latest-source
    centerElement: true
    speed: 20
    timeout: 300000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/${REGISTER_PREFIX}-register-target-settled
- assertVisible:
    id: your-latest-source
