appId: au.com.opax.app
name: Choose a Search scope by its label
---
# SCOPE is the label: All, People, Bills or Speeches. The segments are a
# SwiftUI picker on iOS (each segment reached by its id and label); from AX3
# they become the `search-scope-menu` pop-up button.
- scrollUntilVisible:
    element:
      id: search-scope.*
    direction: UP
    centerElement: true
    speed: 20
    timeout: 30000
- runFlow:
    when:
      visible:
        id: search-scope-menu
    commands:
      - tapOn:
          id: search-scope-menu
      - tapOn: ^${SCOPE}$
- runFlow:
    when:
      notVisible:
        id: search-scope-menu
    commands:
      # Each segment carries its own id (search-scope-people, ...). XCUITest
      # lists the SwiftUI picker beside `search-scope`, not inside it, on
      # iOS 18.6 and 27.0 alike, so `childOf: search-scope` found nothing.
      - tapOn:
          id: search-scope-(all|people|bills|speeches)
          text: ^${SCOPE}$
- waitForAnimationToEnd
