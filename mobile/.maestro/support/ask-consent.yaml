appId: au.com.opax.app
---
# A cleared install's first question asks for consent once (App Review
# 5.1.2(i)); Continue sends the held question. Later questions go straight on.
# At AX3 and AX5 the words fill the sheet and Continue is reached by
# scrolling; the scroll view is capped at the sheet's height, so its range
# ends at the buttons (build 61: it ran below the sheet and stopped above
# Continue). The whole button must show before the tap, not a sliver.
# No centerElement: at AX5 it overshoots under the sheet's header.
- extendedWaitUntil:
    visible:
      id: ask-consent
    timeout: 15000
- scrollUntilVisible:
    element:
      id: ask-consent-continue
    visibilityPercentage: 100
    timeout: 60000
- tapOn:
    id: ask-consent-continue
- extendedWaitUntil:
    notVisible:
      id: ask-consent
    timeout: 15000
