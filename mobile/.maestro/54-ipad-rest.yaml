appId: au.com.opax.app
name: 54 iPad remaining screens and rotation
---
- launchApp:
    appId: com.apple.Preferences
- waitForAnimationToEnd
- tapOn:
    text: Multitasking & Gestures
    waitToSettleTimeoutMs: 3000
- tapOn:
    text: Full-Screen Apps
    waitToSettleTimeoutMs: 3000
- waitForAnimationToEnd
- launchApp:
    clearState: true
    permissions: {}
- extendedWaitUntil:
    visible:
      id: today-screen-message
    timeout: 90000
- setOrientation: LANDSCAPE_LEFT
- openLink: opax://your-mp
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible:
      id: seat-search
    timeout: 90000
- tapOn:
    id: seat-search
- inputText: Grayndler
- pressKey: Enter
- tapOn:
    id: seat-choice-federal-representatives-nsw-grayndler
- extendedWaitUntil:
    visible:
      id: your-seat-name
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/54-your-mp-landscape
- scrollUntilVisible:
    element:
      id: your-pay
    direction: DOWN
    centerElement: true
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/54-your-mp-money-landscape
- openLink: opax://electorate/federal-representatives-nsw-grayndler
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
