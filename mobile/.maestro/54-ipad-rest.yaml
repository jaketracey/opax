    permissions: {}
    arguments:
      OPAXSeat: federal
      OPAXEditionAge: fresh
      OPAXEditionCache: present
- assertVisible:
    id: today-screen-message
- setOrientation: LANDSCAPE_LEFT
- openLink: opax://your-mp
- extendedWaitUntil:
    visible:
      id: your-seat-name
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/54-your-mp-landscape
- openLink: opax://person/anthony-albanese?section=pay
