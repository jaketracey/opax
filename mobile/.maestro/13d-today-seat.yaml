appId: au.com.opax.app
name: 13d Today with a seat saved, the Your MP tile first, one link to the profile
---
# OPAXSeat federal saves Grayndler before the first paint (e2e builds only).
# Your MP is one compact tile: the portrait, the name, the party, the
# electorate and one plain line, read as one element. It opens the profile;
# no votes, declarations, bills or senators draw on Today. The tile's own
# dated line closes it. A push from Today keeps the tab bar and its back
# button reads "Today".
- launchApp:
    clearState: true
    arguments:
      OPAXSeat: federal
      OPAXEditionAge: fresh
      OPAXEditionCache: present
- extendedWaitUntil:
    visible:
      id: today-your-mp
    timeout: 60000
- assertVisible:
    id: today-rep-federal
    text: Anthony Albanese, .*, Federal member for Grayndler
- assertVisible:
    id: today-reps-heading
    text: Your representatives
# Senators have one link row, never rows of their own.
- assertVisible:
    id: today-reps-senators
    text: Senators for New South Wales.*
# The device saves no state district outside Victoria: the federal row alone.
- assertNotVisible:
    id: today-rep-state
- assertNotVisible:
    id: today-invitation
- assertNotVisible:
    id: today-your-mp-latest-0
- assertNotVisible:
    id: today-senators
- scrollUntilVisible:
    element:
      id: today-your-mp-sources
      text: Updated \d{1,2} \w{3} \d{4}.*
    timeout: 90000
    centerElement: true
    speed: 20
- takeScreenshot: ${EVIDENCE}/13d-your-mp
# Case A with a seat: the edition follows the card.
- scrollUntilVisible:
    element:
      id: today-edition
    timeout: 90000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- takeScreenshot: ${EVIDENCE}/13d-edition-after-card
# The row opens the member's profile.
- scrollUntilVisible:
    element:
      id: today-screen-message
    direction: UP
    timeout: 90000
- waitForAnimationToEnd
- tapOn:
    id: today-rep-federal
- extendedWaitUntil:
    visible:
      id: person-screen-title
      text: Anthony Albanese
    timeout: 60000
- assertVisible:
    id: BackButton
    text: Today
- assertVisible:
    id: tab-today
- takeScreenshot: ${EVIDENCE}/13d-profile
- tapOn:
    id: BackButton
- assertVisible:
    id: today-screen
