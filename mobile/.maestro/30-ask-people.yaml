appId: au.com.opax.app
name: 30 People in this answer shows each verified portrait and leaves people without one blank
---
- launchApp:
    permissions:
      all: unset
    clearState: true
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-ask
- assertVisible:
    id: ask-screen
- assertVisible:
    id: tab-ask
    selected: true
- tapOn:
    id: ask-question
- inputText: fixture people
- tapOn:
    id: ask-submit
    enabled: true
- runFlow: support/ask-consent.yaml
- scrollUntilVisible:
    element:
      id: ask-people
    direction: DOWN
    centerElement: true
    visibilityPercentage: 10
    timeout: 180000
- assertVisible: People in this answer
# Three rows show; the rest are one tap away.
- scrollUntilVisible:
    element:
      id: ask-people-more
    direction: DOWN
    centerElement: true
    visibilityPercentage: 100
    timeout: 60000
- tapOn:
    id: ask-people-more
# TestFlight 8 Oct: every row here was a blank circle.
- scrollUntilVisible:
    element:
      id: ask-person-portrait-mary-aldred-blank
    direction: DOWN
    visibilityPercentage: 100
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: ask-person-portrait-sarah-witty
    timeout: 60000
- assertVisible:
    id: ask-person-portrait-mike-freelander
# The 2025 intake has no published portrait yet: blank, never a namesake.
- assertVisible:
    id: ask-person-portrait-matt-smith-blank
- assertNotVisible:
    id: ask-person-portrait-matt-smith
- takeScreenshot: ${EVIDENCE}/30-ask-people

# A person opened from an answer stays in Ask's stack.
- tapOn:
    id: ask-person-sarah-witty
- extendedWaitUntil:
    visible:
      id: person-screen-title
    timeout: 60000
- assertVisible:
    id: BackButton
    text: Ask
