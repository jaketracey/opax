appId: au.com.opax.app
name: 30 People in this answer shows each verified portrait and leaves people without one blank
---
- launchApp:
    permissions:
      all: unset
    clearState: true
- tapOn:
    id: tab-ask
- assertVisible:
    id: ask-screen
- tapOn:
    id: ask-question
- inputText: fixture people
- scrollUntilVisible:
    element:
      id: ask-submit
    centerElement: true
    timeout: 60000
- tapOn:
    id: ask-submit
    enabled: true
- runFlow: support/ask-consent.yaml
- scrollUntilVisible:
    element:
      id: ask-people-card
    direction: DOWN
    centerElement: true
    visibilityPercentage: 10
    timeout: 180000
# TestFlight 8 Oct: every row here was a blank circle.
- scrollUntilVisible:
    element:
      id: ask-person-portrait-mary-aldred-blank
    direction: DOWN
    visibilityPercentage: 100
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: ask-person-portrait-sarah-witty
    timeout: 60000
- assertVisible:
    id: ask-person-portrait-mike-freelander
# The 2025 intake has no published portrait yet: blank, never a namesake.
- assertVisible:
    id: ask-person-portrait-matt-smith-blank
- assertNotVisible:
    id: ask-person-portrait-matt-smith
- takeScreenshot: ${EVIDENCE}/30-ask-people
