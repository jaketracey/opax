appId: au.com.opax.app
name: Submission reviewer reading walkthrough
---
- launchApp:
    clearState: true
    permissions: {}
    arguments:
      OPAXWelcomeTour: 'on'
      OPAXEditionAge: fresh
      OPAXEditionCache: present
- assertVisible:
    id: welcome-screen
- scrollUntilVisible:
    element:
      id: welcome-know
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/review-01-welcome
- tapOn:
    id: welcome-know
- assertVisible:
    id: welcome-seat
- tapOn: Not now
- assertVisible:
    id: today-screen-message
- takeScreenshot: ${EVIDENCE}/review-02-today
- tapOn:
    id: tab-your-mp
- tapOn:
    id: your-invitation-find
- assertVisible:
    id: seat-sheet
- takeScreenshot: ${EVIDENCE}/review-03-chooser
- tapOn: Electorate or member.s name
- inputText: Grayndler
- tapOn:
    id: seat-row-federal-representatives-nsw-grayndler
- assertVisible:
    id: your-seat-name
- takeScreenshot: ${EVIDENCE}/review-04-your-mp
- tapOn:
    id: your-member-anthony-albanese
- assertVisible:
    id: person-screen-title
- takeScreenshot: ${EVIDENCE}/review-05-profile
- scrollUntilVisible:
    element:
      id: person-votes-heading
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/review-05-votes
- scrollUntilVisible:
    element:
      id: person-interests-heading
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/review-05-interests
- scrollUntilVisible:
    element:
      id: person-pay-heading
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/review-05-pay
- scrollUntilVisible:
    element:
      id: person-expenses-heading
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/review-05-expenses
- openLink: opax://electorate/federal-representatives-nsw-grayndler
- extendedWaitUntil:
    visible:
      id: electorate-screen
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/review-06-electorate
- scrollUntilVisible:
    element:
      id: electorate-census
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/review-06b-context
- tapOn:
    id: tab-bills
- assertVisible:
    id: bills-count
- tapOn: Search bills
- inputText: Interactive Gambling
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: bill-row-au-federal-r7534
    timeout: 90000
- tapOn:
    id: bill-row-au-federal-r7534
- assertVisible:
    id: bill-title
- takeScreenshot: ${EVIDENCE}/review-07-bill
- scrollUntilVisible:
    element:
      id: bill-speech-0
    timeout: 120000
- tapOn:
    id: bill-speech-0
- assertVisible:
    id: doc-title
- takeScreenshot: ${EVIDENCE}/review-09-reader
- runFlow:
    file: support/open-more.yaml
    env:
      NAME: this record
- tapOn: Citation formats…
- assertVisible:
    id: doc-citations
- takeScreenshot: ${EVIDENCE}/review-10-cite
- openLink: opax://doc/speech-1205524
- extendedWaitUntil:
    visible:
      id: doc-title
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/review-11-reader
- scrollUntilVisible:
    element:
      id: doc-similar
    timeout: 120000
- tapOn:
    id: doc-similar
- scrollUntilVisible:
    element:
      id: doc-similar-0
    timeout: 60000
- takeScreenshot: ${EVIDENCE}/review-11-similar
- openLink: opax://account/about
- extendedWaitUntil:
    visible:
      id: about-screen
    timeout: 90000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/review-12-about
- scrollUntilVisible:
    element:
      id: about-deceased-notice
    timeout: 60000
- takeScreenshot: ${EVIDENCE}/review-12-about-notice
# Support, privacy and sources live on Account.
- tapOn:
    id: BackButton
- scrollUntilVisible:
    element:
      id: account-support
    timeout: 60000
- tapOn:
    id: account-support
- assertVisible: https://opax.invalid/support
- takeScreenshot: ${EVIDENCE}/review-13-support
- tapOn: OK
- tapOn:
    id: account-privacy
- assertVisible: https://opax.invalid/privacy
- takeScreenshot: ${EVIDENCE}/review-14-privacy
- tapOn: OK
- scrollUntilVisible:
    element:
      id: account-sources
    direction: UP
    timeout: 60000
- tapOn:
    id: account-sources
- assertVisible:
    id: sources-screen
- takeScreenshot: ${EVIDENCE}/review-15-sources
- openLink: opax://account/sources/portraits
- tapOn: Name or photographer
- inputText: Sheena Watt
- hideKeyboard
- scrollUntilVisible:
    element:
      id: sources-portrait-sheena-watt
    timeout: 60000
- assertVisible: Gabagool2005.*CC0.*Wikimedia Commons, cropped.*
- takeScreenshot: ${EVIDENCE}/review-16-cropped-credit
- openLink: opax://search
- assertVisible: People, bills, topics and more
- runFlow:
    file: support/search-query.yaml
    env:
      QUERY: Albanese
      PREFIX: review-17
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: search-result-anthony-albanese
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/review-18-search-results
