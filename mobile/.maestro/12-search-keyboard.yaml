appId: au.com.opax.app
name: 12 Search keyboard submits once with the Search key and keeps the native insets
---
# The settled 3 pt check discriminates at standard size; the AX5 baseline was 2 pt.
# Transients are checked separately from the fixture probe (250 ms samples).
# There is no submit button: the keyboard's Search key is the one way to
# search (journeys/search.md 3.4), so each submit here is one Enter.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: today-screen-message
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/12-keyboard-cold-today
- copyTextFrom:
    id: search-geometry
- evalScript: ${output.today = JSON.parse(maestro.copiedText); console.log('COLD_TODAY ' + maestro.copiedText)}
- assertTrue:
    condition: ${Math.abs(output.today.offset.y + output.today.adjustedInset.top) <= 3}
    label: Today cold launch starts at its native top inset
- stopApp
- openLink: opax://search
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible:
      id: search-screen
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/12-keyboard-cold-search
- copyTextFrom:
    id: search-geometry
- evalScript: ${output.cold = JSON.parse(maestro.copiedText); console.log('COLD_SEARCH ' + maestro.copiedText)}
- assertTrue:
    condition: ${Math.abs(output.cold.offset.y + output.cold.adjustedInset.top) <= 3}
    label: Search cold launch starts at its native top inset
- runFlow:
    file: support/search-query.yaml
    env:
      QUERY: Albanese
      PREFIX: 12-keyboard
- extendedWaitUntil:
    visible: '.*"keyboardHeight":[1-9][0-9]{2}.*'
    timeout: 10000
- waitForAnimationToEnd
- runFlow: search-keyboard-reveal.yaml
- copyTextFrom:
    id: search-geometry
- evalScript: ${output.typed = JSON.parse(maestro.copiedText); console.log('TYPED ' + maestro.copiedText)}
- assertTrue:
    condition: ${output.typed.keyboardHeight > 100 && !output.typed.results}
    label: A real software keyboard is open before the first submit
- takeScreenshot: ${EVIDENCE}/12-keyboard-before-first-tap
# A single key press; nothing retries a swallowed submit.
- pressKey: Enter
- runFlow: search-submit-reveal.yaml
- copyTextFrom:
    id: search-geometry
- evalScript: ${output.first = JSON.parse(maestro.copiedText); console.log('FIRST_SUBMIT ' + maestro.copiedText)}
# Pass 5 (P1-1): an answered search stops asking, so no submit control is
# drawn once the results are up. Since 9 Nov the app has no submit control
# (the Search key submits) and the probe's "button" is the field itself, so
# the geometry no longer carries that check (sweep 2 lane A).
- assertTrue:
    condition: ${output.first.results && output.first.keyboardHeight == 0}
    label: One Search key press submits, dismisses the keyboard and draws no submit control
- takeScreenshot: ${EVIDENCE}/12-keyboard-after-first-tap
# The same query again: empty the field, type it, submit. The session cache
# answers it, and the keyboard must behave the same way.
- runFlow: support/search-clear.yaml
- runFlow:
    file: support/search-query.yaml
    env:
      QUERY: Albanese
      PREFIX: 12-keyboard-repeat
- extendedWaitUntil:
    visible: '.*"keyboardHeight":[1-9][0-9]{2}.*'
    timeout: 10000
- waitForAnimationToEnd
- runFlow: search-keyboard-reveal.yaml
- copyTextFrom:
    id: search-geometry
- evalScript: ${output.repeat = JSON.parse(maestro.copiedText); console.log('REPEAT_TYPED ' + maestro.copiedText)}
- assertTrue:
    condition: ${output.repeat.keyboardHeight > 100 && !output.repeat.results}
    label: Same-query repeat has the keyboard open and no results yet
- pressKey: Enter
- runFlow: search-submit-reveal.yaml
- copyTextFrom:
    id: search-geometry
- evalScript: ${output.second = JSON.parse(maestro.copiedText); console.log('SECOND_SUBMIT ' + maestro.copiedText)}
- assertTrue:
    condition: ${output.second.results && output.second.keyboardHeight == 0}
    label: Same-query second submission submits once and dismisses the keyboard
- takeScreenshot: ${EVIDENCE}/12-keyboard-after-second-tap
# Dismissing the keyboard without the Search key never searches.
- runFlow: support/search-clear.yaml
- runFlow:
    file: support/search-query.yaml
    env:
      QUERY: Albanese
      PREFIX: 12-keyboard-dismiss
- extendedWaitUntil:
    visible: '.*"keyboardHeight":[1-9][0-9]{2}.*'
    timeout: 10000
- waitForAnimationToEnd
- runFlow: search-keyboard-reveal.yaml
- copyTextFrom:
    id: search-geometry
- evalScript: ${output.focus = JSON.parse(maestro.copiedText); console.log('BEFORE_DISMISS ' + maestro.copiedText)}
- assertTrue:
    condition: ${output.focus.keyboardHeight > 100 && !output.focus.results}
    label: The query is unsubmitted before dismissing without a search
- hideKeyboard
- waitForAnimationToEnd
- copyTextFrom:
    id: search-geometry
- evalScript: ${output.dismiss = JSON.parse(maestro.copiedText); console.log('AFTER_DISMISS ' + maestro.copiedText)}
- assertTrue:
    condition: ${output.dismiss.keyboardHeight == 0 && !output.dismiss.results}
    label: Dismissing the keyboard does not search
- takeScreenshot: ${EVIDENCE}/12-keyboard-dismissed
# The same scroll view must still drive the native large title.
- swipe:
    start: 90%, 70%
    end: 90%, 30%
    speed: 20
- waitForAnimationToEnd
- copyTextFrom:
    id: search-geometry
- evalScript: ${output.collapsed = JSON.parse(maestro.copiedText); console.log('COLLAPSED ' + maestro.copiedText)}
- assertTrue:
    condition: ${output.collapsed.nav.height < output.cold.nav.height - 20}
    label: Scrolling still collapses the native large title
- takeScreenshot: ${EVIDENCE}/12-keyboard-title-collapsed
