appId: au.com.opax.app
name: 11 Read a bill, its machine summary, votes and speeches
---
# No clearState: a relaunch resets the list, and offline journey 04 reads
# the records earlier journeys saved.
#
# scrollUntilVisible always swipes from the centre of the screen. A speed-70
# swipe moves about 0.8 of a screen: it only brings an element into view
# (any part showing counts), since it can carry a tall AX5 element past a
# full-visibility check. Whole-element checks and tap targets use speed 20
# (about half a screen per swipe).
#
# Tap targets are centred first. From iOS 26 the tab bar floats over the
# bottom of the page, and a link drawn under it still counts as visible: the
# tap hits the tab, and the Bills tab pops back to the list. Each group of
# steps on the bill page first checks the page is still shown, so a lost
# page fails at once rather than after a long scroll.
- launchApp
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-bills
- extendedWaitUntil:
    visible:
      id: bills-count
    timeout: 20000
# Search is the native field in the bar, named by its placeholder. Before
# parliament is the opening scope: All holds the passed bill.
# Segments at most sizes; at accessibility sizes a "Showing" menu row.
- runFlow:
    when:
      visible:
        id: bills-scope-all
    commands:
      - tapOn:
          id: bills-scope-all
- runFlow:
    when:
      notVisible:
        id: bills-scope-all
    commands:
      - tapOn:
          id: bills-scope
      - tapOn: All
- runFlow: support/bills-search-reveal.yaml
- tapOn: Search bills
- inputText: interactive gambling levy
- pressKey: Enter
# At the largest text sizes a bill row is taller than the screen: it counts
# as found once part of it shows, then is centred so the tap lands on it.
- scrollUntilVisible:
    element:
      id: bill-row-au-federal-r7534
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- waitForAnimationToEnd
- tapOn:
    id: bill-row-au-federal-r7534
- extendedWaitUntil:
    visible:
      id: bill-screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: bill-status
    direction: DOWN
    speed: 20
    timeout: 180000
# The status names its event: Royal Assent on 26 Aug, never "Passed 26 Aug".
- assertVisible:
    id: bill-status
    text: 'Status: Passed\. Royal Assent, 26 August 2026'
- takeScreenshot: ${EVIDENCE}/11-bill
# The machine summary's pill comes first; its stored attribution opens from it.
- assertVisible:
    id: bill-screen
# Long jumps aim fast at the element (any part showing counts), then step
# gently until the whole of it shows.
- scrollUntilVisible:
    element:
      id: bill-summary-label
    direction: DOWN
    visibilityPercentage: 1
    speed: 70
    timeout: 180000
- scrollUntilVisible:
    element:
      id: bill-summary-label
    direction: DOWN
    speed: 20
    timeout: 60000
# The navy pill, not a status capsule; its note opens from it.
- assertVisible:
    id: bill-summary-label
    text: Machine-written
- takeScreenshot: ${EVIDENCE}/11-summary
# At AX5 the whole votes section is too tall to appear in the iOS
# hierarchy; the first vote's container does. Third readings and other
# substantive votes come first; procedural votes wait in their own group.
# A substantive question put under a time limit is not procedural, so the
# time-limited amendment leads and the committee vote is third.
- assertVisible:
    id: bill-screen
- scrollUntilVisible:
    element:
      id: bill-division-0
    direction: DOWN
    visibilityPercentage: 1
    speed: 70
    timeout: 180000
- scrollUntilVisible:
    element:
      id: bill-division-0-title
    direction: DOWN
    speed: 20
    timeout: 60000
- assertVisible:
    id: bill-division-0-title
    text: Amendment
- assertVisible:
    id: bill-division-0-more
    text: 'Amendment, Senate · 19 Aug 2026 · under a time limit, Not agreed, 11 ayes, 24 noes'
- scrollUntilVisible:
    element:
      id: bill-division-2-title
    direction: DOWN
    speed: 20
    timeout: 60000
- assertVisible:
    id: bill-division-2-title
    text: In committee
- assertVisible:
    id: bill-division-2-more
    text: 'In committee, Senate · 19 Aug 2026, Not agreed, 11 ayes, 29 noes'
# A tap during scroll momentum only stops the scroll on iOS: settle first.
- scrollUntilVisible:
    element:
      id: bill-division-2-more
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: bill-division-2-more
# Expanded in place: Labor, then the Coalition, then the crossbench, each
# party by label and count in words.
- assertVisible:
    id: bill-screen
- scrollUntilVisible:
    element:
      id: bill-division-2-splits-labor
    direction: DOWN
    speed: 20
    timeout: 60000
- assertVisible: Labor, no ayes, 24 noes
- scrollUntilVisible:
    element:
      id: bill-division-2-splits-greens
    direction: DOWN
    speed: 20
    timeout: 60000
- assertVisible: Greens, 9 ayes, no noes
- takeScreenshot: ${EVIDENCE}/11-party-splits
- assertVisible:
    id: bill-screen
- scrollUntilVisible:
    element:
      id: bill-divisions-procedural
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 60000
- assertVisible: Procedural votes \(1\)
- waitForAnimationToEnd
- tapOn:
    id: bill-divisions-procedural
- scrollUntilVisible:
    element:
      id: bill-division-10-title
    direction: DOWN
    speed: 20
    timeout: 60000
- assertVisible:
    id: bill-division-10-title
    text: Limitation of debate
- takeScreenshot: ${EVIDENCE}/11-procedural
# Every division's count is one tap from its source: the block's one source
# line opens a sheet listing each count. Sources open in the in-app browser;
# e2e shows the destination locally.
- assertVisible:
    id: bill-screen
- scrollUntilVisible:
    element:
      id: bill-divisions-source
    direction: DOWN
    visibilityPercentage: 1
    speed: 70
    timeout: 180000
- scrollUntilVisible:
    element:
      id: bill-divisions-source
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 60000
- waitForAnimationToEnd
- tapOn:
    id: bill-divisions-source
- extendedWaitUntil:
    visible:
      id: bill-divisions-source-sheet-original-0
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/11-division-sources
- tapOn:
    id: bill-divisions-source-sheet-original-0
- scrollUntilVisible:
    element:
      text: https://theyvoteforyou.org.au/divisions/senate/2026-08-19/.*
    direction: DOWN
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/11-division-source
# iOS presents Original over Sources, as in 13: Done closes each. Android
# leaves both with Back, which its prepared copy makes of this OK.
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: OK
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: Done
      - extendedWaitUntil:
          visible:
            id: bill-divisions-source-sheet-original-0
          timeout: 15000
      - tapOn: Done
      - extendedWaitUntil:
          notVisible:
            id: bill-divisions-source-sheet-original-0
          timeout: 15000
# Near the end of the page an element cannot be centred: scroll to it only.
- assertVisible:
    id: bill-screen
- scrollUntilVisible:
    element:
      id: bill-speeches
    direction: DOWN
    visibilityPercentage: 1
    speed: 70
    timeout: 180000
# One pill for the block's machine-written briefs.
- scrollUntilVisible:
    element:
      id: bill-speeches-label
    direction: DOWN
    speed: 20
    timeout: 60000
- assertVisible:
    id: bill-speeches-label
    text: Machine-written
- scrollUntilVisible:
    element:
      id: bill-speech-.*
      text: .*Tony Burke.*
    direction: UP
    speed: 20
    timeout: 180000
- assertVisible:
    id: bill-screen
- takeScreenshot: ${EVIDENCE}/11-speech
# After the speeches, one row searches every speech for the bill.
- scrollUntilVisible:
    element:
      id: bill-speeches-search
    direction: DOWN
    speed: 20
    timeout: 60000
- assertVisible: 'Search speeches for "Interactive Gambling \(Cost Recovery Levy\) Bill 2026"'

# An exposure draft: released, not introduced, with its consultation.
- launchApp
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-bills
- extendedWaitUntil:
    visible:
      id: bills-count
    timeout: 20000
# Segments at most sizes; at accessibility sizes a "Showing" menu row.
- runFlow:
    when:
      visible:
        id: bills-scope-all
    commands:
      - tapOn:
          id: bills-scope-all
- runFlow:
    when:
      notVisible:
        id: bills-scope-all
    commands:
      - tapOn:
          id: bills-scope
      - tapOn: All
- runFlow: support/bills-search-reveal.yaml
- tapOn: Search bills
- inputText: digital duty of care
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: bill-row-au-federal-ed-online-safety-digital-duty-of-care-2026
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- waitForAnimationToEnd
- tapOn:
    id: bill-row-au-federal-ed-online-safety-digital-duty-of-care-2026
- extendedWaitUntil:
    visible:
      id: bill-screen
    timeout: 15000
- assertVisible:
    id: bill-status
    text: 'Status: Exposure draft\. Status as at, 8 September 2026'
- takeScreenshot: ${EVIDENCE}/11-exposure-draft
- scrollUntilVisible:
    element:
      id: bill-introduced
    direction: DOWN
    speed: 20
    timeout: 180000
- assertVisible:
    id: bill-introduced
    text: Released 8 Sep 2026
- assertVisible:
    id: bill-portfolio
    text: Communications portfolio
# At AX5 the consultation line is about 350pt tall: a speed-70 swipe carried
# it from the bottom edge to above the top, so aim fast, then step gently.
- assertVisible:
    id: bill-screen
- scrollUntilVisible:
    element:
      id: bill-consultation
    direction: DOWN
    visibilityPercentage: 1
    speed: 70
    timeout: 180000
- scrollUntilVisible:
    element:
      text: Consultation opened 8 Sep 2026.*
    direction: DOWN
    speed: 20
    timeout: 60000
- takeScreenshot: ${EVIDENCE}/11-consultation
- assertVisible:
    id: bill-screen
- scrollUntilVisible:
    element:
      id: bill-summary-label
    direction: DOWN
    visibilityPercentage: 1
    speed: 70
    timeout: 180000
- scrollUntilVisible:
    element:
      id: bill-summary-label
    direction: DOWN
    speed: 20
    timeout: 60000
- assertVisible:
    id: bill-summary-label
    text: Machine-written
- takeScreenshot: ${EVIDENCE}/11-exposure-summary
