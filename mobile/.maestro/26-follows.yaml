appId: au.com.opax.app
name: 26 Follow a member, a bill and an electorate; Today shows what changed
---
# Run on its own, by path, against the changed-data fixture:
#   OPAX_FIXTURE_DATA=changed scripts/e2e.sh <udid> .maestro/26-follows.yaml
# The fixture serves the pinned catalogs until the app revalidates the bill or
# register index (Today's pull to refresh), then one new declared entry for
# Anthony Albanese and the Ending Financial Abuse bill as passed. clearState,
# so nothing is followed and every first read is unconditional.
#
# Rows grow past the screen at AX5: whole-row checks match a tenth of the row,
# centred with half-screen (speed 20) swipes.
- launchApp:
    clearState: true
- assertVisible:
    id: today-screen-message

# A bill: the first recently introduced bill is the Ending Financial Abuse bill.
# Before any follow, Today has no Following block: the bills come next.
- scrollUntilVisible:
    element:
      id: today-bill-0
    timeout: 90000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- assertNotVisible:
    id: today-following
- takeScreenshot: ${EVIDENCE}/26-today-empty
- waitForAnimationToEnd
- tapOn:
    id: today-bill-0
- extendedWaitUntil:
    visible:
      id: bill-screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: bill-follow-off
    timeout: 90000
    centerElement: true
    speed: 20
- assertVisible:
    id: bill-follow-off
    text: Follow Child Support and Family Assistance Legislation Amendment .*
- tapOn:
    id: bill-follow-off
- extendedWaitUntil:
    visible:
      id: bill-follow-on
    timeout: 15000
- assertVisible:
    id: bill-follow-message
    text: Changes will show on Today.
- takeScreenshot: ${EVIDENCE}/26-bill-following
# Back to Today's root, so the Today tab opens there later.
- tapOn: Today
- assertVisible:
    id: today-screen

# A parliamentarian, from Search.
- tapOn:
    id: tab-search
- scrollUntilVisible:
    element:
      text: People, bills, topics and more
    centerElement: true
    timeout: 300000
- tapOn:
    text: People, bills, topics and more
- inputText: Anthony Albanese
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: search-result-anthony-albanese
    centerElement: true
    timeout: 300000
- tapOn:
    id: search-result-anthony-albanese
- extendedWaitUntil:
    visible:
      id: person-screen-title
    timeout: 15000
- scrollUntilVisible:
    element:
      id: person-follow-off
    timeout: 90000
    centerElement: true
    speed: 20
- assertVisible:
    id: person-follow-off
    text: Follow Anthony Albanese
- tapOn:
    id: person-follow-off
- extendedWaitUntil:
    visible:
      id: person-follow-on
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/26-person-following

# An electorate, from the member's seat row ("Member for Grayndler, House
# of Representatives, …" since pass 3B), by its test ID.
- scrollUntilVisible:
    element:
      id: person-electorate
      text: Member for Grayndler.*
    timeout: 90000
    centerElement: true
    speed: 20
- tapOn:
    id: person-electorate
- extendedWaitUntil:
    visible:
      id: electorate-name
    timeout: 15000
- scrollUntilVisible:
    element:
      id: electorate-follow-off
    timeout: 90000
    centerElement: true
    speed: 20
- assertVisible:
    id: electorate-follow-off
    text: Follow Grayndler
- tapOn:
    id: electorate-follow-off
- extendedWaitUntil:
    visible:
      id: electorate-follow-on
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/26-electorate-following

# Nothing has changed yet: Today folds Following into one row with the count.
- tapOn:
    id: tab-today
- assertVisible:
    id: today-screen
# Today keeps its scroll position; at AX5 that is below Following, so
# start from the top and search down.
- scrollUntilVisible:
    element:
      id: today-screen-message
    direction: UP
    timeout: 90000
- scrollUntilVisible:
    element:
      id: today-following-collapsed
      text: Following, 3
    timeout: 90000
    centerElement: true
    speed: 20
- takeScreenshot: ${EVIDENCE}/26-today-following
- assertNotVisible:
    id: today-following-bill-au-federal-r7549
- assertNotVisible:
    id: today-following-electorate-el_5d600e7f6dca5b72ae04d686
- takeScreenshot: ${EVIDENCE}/26-today-no-changes

# Pull to refresh: the catalogs revalidate and the fixture's changes arrive.
- scrollUntilVisible:
    element:
      id: today-screen-message
    direction: UP
    timeout: 90000
- swipe:
    start: 50%, 30%
    end: 50%, 85%
    duration: 800
- waitForAnimationToEnd
# Two of the three changed: a Following header with See all, then only the
# changed follows as rows. The electorate has no change and no row.
- scrollUntilVisible:
    element:
      id: today-following-all
    timeout: 90000
    centerElement: true
    speed: 20
- assertNotVisible:
    id: today-following-collapsed
- takeScreenshot: ${EVIDENCE}/26-today-changed
- scrollUntilVisible:
    element:
      id: today-following-bill-au-federal-r7549
      text: '.*, Bill, 1 change since \d+ \w+ 20\d\d, Now passed; was before parliament, ParlInfo bill records, as at 1 October 2026'
    timeout: 90000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/26-today-bill-changed
- scrollUntilVisible:
    element:
      id: today-following-person-person_2b850aa643795ce8902f754b
      text: 'Anthony Albanese, Parliamentarian, 1 change since \d+ \w+ 20\d\d, 1 new declared entry, Register of Members’ Interests, as at 4 September 2026'
    timeout: 90000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- takeScreenshot: ${EVIDENCE}/26-today-member-changed
- assertNotVisible:
    id: today-following-electorate-el_5d600e7f6dca5b72ae04d686

# Opening the bill marks it seen and its row goes; the member still shows
# its change.
# At AX5 the row (about 1,370pt) outgrows the screen, and Maestro taps its
# centre. A row already a tenth visible is never centred, so come at it from
# the top: the half-screen scroll then stops with its centre on screen.
- scrollUntilVisible:
    element:
      id: today-screen-message
    direction: UP
    timeout: 90000
- scrollUntilVisible:
    element:
      id: today-following-bill-au-federal-r7549
    direction: DOWN
    timeout: 90000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- waitForAnimationToEnd
- tapOn:
    id: today-following-bill-au-federal-r7549
- extendedWaitUntil:
    visible:
      id: bill-screen
    timeout: 15000
# At AX5 the title alone outgrows the screen; scroll to the switch.
- scrollUntilVisible:
    element:
      id: bill-follow-on
    timeout: 90000
    centerElement: true
    speed: 20
- tapOn: Today
- assertVisible:
    id: today-screen
- scrollUntilVisible:
    element:
      id: today-screen-message
    direction: UP
    timeout: 90000
- scrollUntilVisible:
    element:
      id: today-following-person-person_2b850aa643795ce8902f754b
    timeout: 90000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- assertNotVisible:
    id: today-following-bill-au-federal-r7549
- takeScreenshot: ${EVIDENCE}/26-today-bill-seen

# /follows from Today by the header's See all (Your MP no longer has a
# Following section). The member's new declared entry puts them in Changed,
# the first group.
- scrollUntilVisible:
    element:
      id: today-following-all
    direction: UP
    timeout: 90000
    centerElement: true
    speed: 20
- tapOn:
    id: today-following-all
- extendedWaitUntil:
    visible:
      id: follows-screen
    timeout: 15000
- assertVisible:
    id: follows-changed
- assertNotVisible: Following \d+ of at most 50
- assertNotVisible: Saved on this iPhone.*
- takeScreenshot: ${EVIDENCE}/26-following
# Edit, then the electorate's minus button unfollows it at once.
- tapOn: Edit
- extendedWaitUntil:
    visible:
      id: follows-editing
    timeout: 15000
- scrollUntilVisible:
    element:
      id: follows-remove-electorate-el_5d600e7f6dca5b72ae04d686
    timeout: 90000
    centerElement: true
    speed: 20
- takeScreenshot: ${EVIDENCE}/26-following-edit
- tapOn:
    id: follows-remove-electorate-el_5d600e7f6dca5b72ae04d686
- extendedWaitUntil:
    notVisible:
      id: follows-row-electorate-el_5d600e7f6dca5b72ae04d686
    timeout: 15000
- tapOn: Done
- extendedWaitUntil:
    visible:
      id: follows-browsing
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/26-following-unfollowed

# Follows, and what was seen, survive a relaunch.
- launchApp
- assertVisible:
    id: today-screen-message
- scrollUntilVisible:
    element:
      id: today-following-all
    timeout: 90000
    centerElement: true
    speed: 20
- scrollUntilVisible:
    element:
      id: today-following-person-person_2b850aa643795ce8902f754b
      text: 'Anthony Albanese, Parliamentarian, 1 change since .*1 new declared entry.*'
    timeout: 90000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- assertNotVisible:
    id: today-following-bill-au-federal-r7549
- assertNotVisible:
    id: today-following-electorate-el_5d600e7f6dca5b72ae04d686
- takeScreenshot: ${EVIDENCE}/26-after-relaunch

# Unfollow all: Edit, the foot row, then the action sheet's button.
- scrollUntilVisible:
    element:
      id: today-following-all
    direction: UP
    timeout: 90000
    centerElement: true
    speed: 20
- tapOn:
    id: today-following-all
- extendedWaitUntil:
    visible:
      id: follows-screen
    timeout: 15000
- tapOn: Edit
- scrollUntilVisible:
    element:
      id: follows-unfollow-all
    timeout: 90000
    centerElement: true
    speed: 20
- tapOn:
    id: follows-unfollow-all
- assertVisible: Unfollow all 2\?
- assertVisible: Today stops showing their changes\.
- takeScreenshot: ${EVIDENCE}/26-clear-confirm
# The sheet's destructive button; the foot row behind it has the same words
# and comes first in the hierarchy.
- tapOn:
    text: Unfollow all
    index: 1
- extendedWaitUntil:
    visible:
      id: follows-empty
    timeout: 30000
- assertVisible: Nothing followed yet
- assertNotVisible: Edit
- tapOn: Today
- assertVisible:
    id: today-screen
- scrollUntilVisible:
    element:
      id: today-screen-message
    direction: UP
    timeout: 90000
- assertNotVisible:
    id: today-following
- takeScreenshot: ${EVIDENCE}/26-cleared
