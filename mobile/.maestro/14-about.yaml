appId: au.com.opax.app
name: 14 About as a reading page, its coverage line, then Coverage pushed in the Account sheet
---
# account.md 3: About reads top to bottom with one row, Coverage. Support,
# privacy, sources and methods are Account rows now, not About's.
- launchApp
- tapOn: Account
- scrollUntilVisible:
    element:
      id: account-about
    timeout: 90000
- tapOn:
    id: account-about
- scrollUntilVisible:
    element:
      id: about-name
    timeout: 90000
    visibilityPercentage: 1
- takeScreenshot: ${EVIDENCE}/14-name
- scrollUntilVisible:
    element:
      id: about-independence
    timeout: 90000
    visibilityPercentage: 1
- assertVisible: 'OPAX is independent and non-partisan\..*'
- scrollUntilVisible:
    element:
      id: about-privacy-device
    timeout: 90000
    visibilityPercentage: 1
- assertVisible: '.*Your electorate and follows are saved on this iPhone only\..*'
- takeScreenshot: ${EVIDENCE}/14-privacy
- scrollUntilVisible:
    element:
      id: about-speeches
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/14-coverage
# The coverage figure's one source line: the date, then OPAX.
- scrollUntilVisible:
    element:
      id: about-coverage-as-at
    timeout: 90000
- assertVisible: 'Updated .*OPAX.*'
- takeScreenshot: ${EVIDENCE}/14-coverage-as-at
- assertNotVisible:
    id: about-support
- assertNotVisible:
    id: about-privacy
- assertNotVisible:
    id: about-sources-open
- assertNotVisible:
    id: about-methods
- assertNotVisible: We aim to respond within 2 business days.
# Coverage pushes inside the same sheet, with About OPAX as its Back.
- scrollUntilVisible:
    element:
      id: about-coverage
    centerElement: true
    timeout: 90000
- waitForAnimationToEnd
- tapOn:
    id: about-coverage
- extendedWaitUntil:
    visible:
      id: coverage-screen
    timeout: 30000
- assertVisible: About OPAX
- takeScreenshot: ${EVIDENCE}/14-coverage-pushed
- tapOn: { id: BackButton }
- extendedWaitUntil:
    visible:
      id: about-screen
    timeout: 15000
