appId: au.com.opax.app
name: 14 About, coverage, privacy, then Sources and licences with source terms and font notices
---
- launchApp
- tapOn: Account and about
- scrollUntilVisible:
    element:
      id: account-about
    timeout: 90000
- tapOn:
    id: account-about
- scrollUntilVisible:
    element:
      id: about-name
    timeout: 90000
    visibilityPercentage: 1
- takeScreenshot: ${EVIDENCE}/14-name
- scrollUntilVisible:
    element:
      id: about-resources
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/14-coverage
# The snapshot date and the one caveat line; the details sit behind
# disclosures and the source line.
- scrollUntilVisible:
    element:
      id: about-snapshot
    timeout: 90000
- assertVisible: .*Counts describe collected records, not live search totals\.
- takeScreenshot: ${EVIDENCE}/14-snapshot
- scrollUntilVisible:
    element:
      id: about-coverage-as-at
    timeout: 90000
- assertVisible: As at .* Source.*OPAX collection.*
- takeScreenshot: ${EVIDENCE}/14-coverage-as-at
- scrollUntilVisible:
    element:
      id: about-privacy
    timeout: 90000
- tapOn:
    id: about-privacy
- assertVisible: https://opax.invalid/privacy
- takeScreenshot: ${EVIDENCE}/14-privacy-alert
- tapOn: OK
# Licences, credits and source terms are on one screen, from About.
- scrollUntilVisible:
    element:
      id: about-sources-open
    direction: UP
    centerElement: true
    timeout: 90000
- tapOn:
    id: about-sources-open
- extendedWaitUntil:
    visible:
      id: sources-screen
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/14-sources
- scrollUntilVisible:
    element:
      id: sources-dataset-hansard
    centerElement: true
    timeout: 90000
- tapOn:
    id: sources-dataset-hansard
- assertVisible: .*Hansard is reproduced under CC BY-NC-ND terms.*
- scrollUntilVisible:
    element:
      text: Copyright and disclaimer
    centerElement: true
    timeout: 90000
- tapOn: Copyright and disclaimer
- assertVisible: https://www.aph.gov.au/Help/Disclaimer_Privacy_Copyright
- takeScreenshot: ${EVIDENCE}/14-source-alert
- tapOn: OK
- scrollUntilVisible:
    element:
      id: sources-font-Merriweather
    timeout: 90000
- tapOn:
    id: sources-font-Merriweather
- scrollUntilVisible:
    element:
      id: sources-notice-Merriweather
    timeout: 90000
    visibilityPercentage: 1
- takeScreenshot: ${EVIDENCE}/14-font-notice
