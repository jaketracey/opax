appId: au.com.opax.app
name: 36 Person speeches, mentions, topics, ministerial diary and expense categories
---
# Speeches is its own row and pushes the paged record list. Mentions and
# Topics sit in "More from the record" at the page's foot, so each is found
# scrolling down.
- launchApp:
    clearState: true
    permissions: {}
- runFlow:
    file: support/people-open-profile.yaml
    env:
      NAME: Anthony Albanese
      SLUG: anthony-albanese
- scrollUntilVisible:
    element: { id: person-figures }
    direction: DOWN
    speed: 20
    centerElement: true
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/36-figures
- scrollUntilVisible:
    element: { id: person-speeches }
    direction: DOWN
    speed: 30
    centerElement: true
    timeout: 180000
- tapOn: { id: person-speeches }
- extendedWaitUntil:
    visible: { id: record-list-row-0 }
    timeout: 30000
- assertVisible: { id: record-list-screen }
- takeScreenshot: ${EVIDENCE}/36-speeches
- tapOn: { id: record-list-row-0 }
- extendedWaitUntil:
    visible: { id: doc-title }
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/36-speech-destination
- tapOn: { id: BackButton }
- extendedWaitUntil:
    visible: { id: record-list-screen }
    timeout: 15000
- tapOn: { id: BackButton }
- scrollUntilVisible:
    element: { id: person-mentions }
    direction: DOWN
    speed: 30
    centerElement: true
    timeout: 180000
- tapOn: { id: person-mentions }
- extendedWaitUntil:
    visible: { id: record-list-row-0 }
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/36-mentions
- tapOn: { id: record-list-row-0 }
- extendedWaitUntil:
    visible: { id: doc-title }
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/36-mention-destination
- tapOn: { id: BackButton }
- extendedWaitUntil:
    visible: { id: record-list-screen }
    timeout: 15000
- tapOn: { id: BackButton }
# Topics are drawn in place; the era switch appears only when the data gives
# era bounds ("1998 to 2012", "Since 2013").
- scrollUntilVisible:
    element: { id: person-topics }
    direction: DOWN
    speed: 20
    centerElement: true
    timeout: 180000
- tapOn:
    text: 'Since [0-9]{4}'
    optional: true
- takeScreenshot: ${EVIDENCE}/36-topics-now
# R1 Search keeps canonical native members only. This public, roster-guarded
# state profile exercises the diary without widening the Search membership set.
- openLink: opax://person/chris-minns
- extendedWaitUntil:
    visible: { id: person-screen-title }
    timeout: 30000
- scrollUntilVisible:
    element: { text: Ministerial diary }
    direction: DOWN
    speed: 40
    centerElement: true
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/36-diary
- tapOn: { id: BackButton }
- runFlow:
    file: support/people-open-profile.yaml
    env:
      NAME: Anthony Albanese
      SLUG: anthony-albanese
# Each category under Expenses opens Expense categories at that category,
# with what this member claimed under it.
- scrollUntilVisible:
    element: { id: person-expense-categories }
    direction: DOWN
    speed: 40
    centerElement: true
    timeout: 180000
- tapOn: { id: person-expense-categories }
- scrollUntilVisible:
    element: { id: person-expense-category-0 }
    direction: DOWN
    speed: 20
    centerElement: true
    timeout: 180000
- tapOn: { id: person-expense-category-0 }
# The sheet's own screen, not a title that the profile row behind it shares.
- extendedWaitUntil:
    visible: { id: expense-glossary }
    timeout: 15000
- assertVisible: { id: expense-glossary-own }
- takeScreenshot: ${EVIDENCE}/36-glossary
- scrollUntilVisible:
    element: { id: expense-glossary-end }
    direction: DOWN
    speed: 50
    centerElement: true
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/36-glossary-source
- tapOn: Done
- scrollUntilVisible:
    element: { id: person-screen-title }
    direction: UP
    speed: 50
    centerElement: true
    timeout: 180000
- assertVisible: { id: person-screen-title }
