appId: au.com.opax.app
name: 07 Scene lifecycle, cold and warm links and native share presentation
env:
  REMOTE_SHARE_UI: ${REMOTE_SHARE_UI || "false"}
---
- stopApp
- openLink: opax://person/anthony-albanese
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible:
      id: person-screen-title
    timeout: 30000
- assertVisible: Anthony Albanese
- takeScreenshot: ${EVIDENCE}/07-cold-link
- openLink: opax://person/julia-gillard
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: Julia Gillard
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/07-warm-link
# Exercise the real native module, with local metadata and the non-resolving
# e2e origin. Dismiss the sheet without selecting a destination or copying.
- openLink: opax://workbench
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible:
      id: wb-native-share
    timeout: 30000
- tapOn:
    id: wb-native-share
- takeScreenshot: ${EVIDENCE}/07-native-share
- runFlow:
    when:
      true: ${REMOTE_SHARE_UI !== "true"}
    commands:
      - assertVisible: Anthony Albanese
      - assertVisible: opax.invalid
      - runFlow:
          when:
            visible:
              id: PopoverDismissRegion
          commands:
            # The upper quarter is outside the popover on the assigned phones
            # at the standard text size.
            - tapOn:
                point: 50%,25%
      - runFlow:
          when:
            visible: Close
          commands:
            - tapOn: Close
- runFlow:
    when:
      true: ${REMOTE_SHARE_UI === "true"}
    commands:
      # The iOS 18.4 system-hosted sheet is absent from Maestro's app
      # hierarchy, so neither its arrival nor its Close button can be found
      # by label; a fixed-point tap on its X landed before the sheet arrived.
      # Swipe the sheet down from its header instead. Until the sheet is up
      # the same drag only moves the workbench, so repeat it (at most five
      # times) until the app reports the cancellation. The last capture
      # shows the sheet with its metadata preview. The cancellation and
      # return-to-app assertions below remain mandatory in both modes.
      - evalScript: ${output.shareAttempt = 0}
      - repeat:
          while:
            notVisible: Native share cancelled
          times: 5
          commands:
            - waitForAnimationToEnd
            - evalScript: ${output.shareAttempt = output.shareAttempt + 1}
            - takeScreenshot: ${EVIDENCE}/07-native-share-sheet-${output.shareAttempt}
            - swipe:
                start: 50%, 50%
                end: 50%, 95%
                duration: 600
- assertVisible: Native share cancelled
- tapOn: OK
- assertVisible:
    id: wb-top
- takeScreenshot: ${EVIDENCE}/07-native-share-dismissed
