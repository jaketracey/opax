appId: au.com.opax.app
name: 07 Scene lifecycle, cold and warm links and native share presentation
env:
  REMOTE_SHARE_UI: ${REMOTE_SHARE_UI || "false"}
---
- stopApp
- openLink: opax://person/anthony-albanese
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible:
      id: person-screen-title
    timeout: 30000
- assertVisible: Anthony Albanese
- takeScreenshot: ${EVIDENCE}/07-cold-link
- openLink: opax://person/julia-gillard
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: Julia Gillard
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/07-warm-link
# Exercise the real native module, with local metadata and the non-resolving
# e2e origin. Dismiss the sheet without selecting a destination or copying.
- openLink: opax://workbench
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible:
      id: wb-native-share
    timeout: 30000
- tapOn:
    id: wb-native-share
- takeScreenshot: ${EVIDENCE}/07-native-share
- runFlow:
    when:
      true: ${REMOTE_SHARE_UI !== "true"}
    commands:
      - assertVisible: Anthony Albanese
      - assertVisible: opax.invalid
      - runFlow:
          when:
            visible:
              id: PopoverDismissRegion
          commands:
            # The upper quarter is outside the popover on the assigned phones
            # at the standard text size.
            - tapOn:
                point: 50%,25%
      - runFlow:
          when:
            visible: Close
          commands:
            - tapOn: Close
- runFlow:
    when:
      true: ${REMOTE_SHARE_UI === "true"}
    commands:
      # The iOS 18.4 system-hosted sheet is absent from Maestro's app hierarchy.
      # Review the captured metadata preview and close its observed X button
      # on the assigned 16e at the standard text size. The cancellation and
      # return-to-app assertions below remain mandatory in both modes.
      - tapOn:
          point: 93%,49%
- assertVisible: Native share cancelled
- tapOn: OK
- assertVisible:
    id: wb-top
- takeScreenshot: ${EVIDENCE}/07-native-share-dismissed
