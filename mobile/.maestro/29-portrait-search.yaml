appId: au.com.opax.app
name: 29 One row per person in Search, drawn with that person's face
---
# The surname stub "Walsh" and "Jess Walsh" share one person ID (10956), so
# Search draws one row for her, not two: the full-name entry with its
# portrait, in the suggestions and in the results.
- launchApp:
    clearState: true
    permissions: {}
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-search
- runFlow:
    file: support/search-query.yaml
    env:
      QUERY: Walsh
      PREFIX: 29
- extendedWaitUntil:
    visible:
      id: search-suggestion-person-10956
      text: Jess Walsh.*
    timeout: 30000
- assertNotVisible:
    id: search-suggestion-person-10956
    text: ^Walsh.*
- takeScreenshot: ${EVIDENCE}/15-jess-fullname-suggestion
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: search-result-jess-walsh
      text: Jess Walsh.*
    direction: DOWN
    centerElement: true
    timeout: 90000
- assertVisible:
    id: search-result-jess-walsh
    text: Jess Walsh.*
- assertNotVisible:
    id: search-result-walsh
- takeScreenshot: ${EVIDENCE}/15-jess-walsh-portrait
