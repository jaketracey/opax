appId: au.com.opax.app
name: 29 Surname search stays blank while the full-name entry keeps its face
---
- launchApp:
    clearState: true
    permissions: {}
- tapOn:
    id: tab-search
- runFlow:
    file: support/search-query.yaml
    env:
      QUERY: Walsh
      PREFIX: 29
- hideKeyboard
- scrollUntilVisible:
    element:
      id: search-suggestion-person-10956
      text: ^Walsh.*
    direction: DOWN
    centerElement: true
    timeout: 90000
- assertVisible:
    id: search-suggestion-person-10956
    text: ^Walsh.*
- takeScreenshot: ${EVIDENCE}/15-walsh-surname-suggestion
- scrollUntilVisible:
    element:
      id: search-suggestion-person-10956
      text: Jess Walsh.*
    direction: DOWN
    centerElement: true
    timeout: 90000
- assertVisible:
    id: search-suggestion-person-10956
    text: Jess Walsh.*
- takeScreenshot: ${EVIDENCE}/15-jess-fullname-suggestion
- scrollUntilVisible:
    element:
      id: search-submit
    direction: UP
    timeout: 90000
- tapOn:
    id: search-submit
- scrollUntilVisible:
    element:
      id: search-result-walsh
    direction: DOWN
    centerElement: true
    timeout: 90000
- assertVisible:
    id: search-result-walsh
- takeScreenshot: ${EVIDENCE}/15-walsh-blank
- scrollUntilVisible:
    element:
      id: search-result-jess-walsh
      text: Jess Walsh.*
    direction: DOWN
    centerElement: true
    timeout: 90000
- assertVisible:
    id: search-result-jess-walsh
    text: Jess Walsh.*
- takeScreenshot: ${EVIDENCE}/15-jess-walsh-portrait
