appId: au.com.opax.app
name: 32 Bill to native speech, cite BibTeX, similar on tap and roster profile
---
- launchApp:
    permissions: {}
- openLink: opax://bill/au-federal-r7534
- extendedWaitUntil:
    visible:
      id: bill-screen
    timeout: 20000
- scrollUntilVisible:
    element:
      id: bill-speech-0-web
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 70
    timeout: 180000
- waitForAnimationToEnd
- tapOn:
    id: bill-speech-0-web
- extendedWaitUntil:
    visible:
      id: doc-title
    timeout: 20000
# The text starts on the first screen, under the header (records.md 2.2).
- assertVisible:
    id: reader-text-0
- takeScreenshot: ${EVIDENCE}/32-reader-header
# The bar holds ⋯ only: Cite, Copy link and Open on opax.com.au. Ask about
# this and Share are the bottom toolbar.
- assertNotVisible:
    id: doc-cite
- tapOn: More for this record
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/32-reader-more
- tapOn: Citation formats…
# Citation formats opens at its large detent; one style shows at a time.
- extendedWaitUntil:
    visible:
      id: doc-citations
    timeout: 20000
- tapOn: BibTeX
- waitForAnimationToEnd
- tapOn:
    id: cite-copy-bibtex
- assertVisible: Copied BibTeX
- takeScreenshot: ${EVIDENCE}/32-cite-bibtex
- tapOn: Done
- extendedWaitUntil:
    visible:
      id: doc-title
    timeout: 20000
# In short is closed until opened.
- scrollUntilVisible:
    element:
      id: doc-brief
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- tapOn:
    id: doc-brief
- scrollUntilVisible:
    element:
      id: doc-brief-label
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/32-machine-summary
# The linked bill and similar speeches follow the text.
- scrollUntilVisible:
    element:
      id: doc-bill-open
    direction: DOWN
    centerElement: true
    speed: 70
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/32-linked-bill
- scrollUntilVisible:
    element:
      id: doc-similar
    direction: DOWN
    centerElement: true
    speed: 20
    timeout: 180000
- waitForAnimationToEnd
- tapOn:
    id: doc-similar
- scrollUntilVisible:
    element:
      id: doc-similar-0
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/32-similar
- scrollUntilVisible:
    element:
      id: reader-text-0
    direction: UP
    visibilityPercentage: 10
    speed: 70
    timeout: 180000
- takeScreenshot: ${EVIDENCE}/32-full-text
- waitForAnimationToEnd
# doc-more is the speaker's roster row, not the page's More menu.
- scrollUntilVisible:
    element:
      id: doc-more
    direction: UP
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 180000
- tapOn:
    id: doc-more
- extendedWaitUntil:
    visible:
      id: person-screen-title
    timeout: 20000
- takeScreenshot: ${EVIDENCE}/32-linked-person
# The Citation formats link from a cold start opens the record, then the
# sheet over it; Done leaves the reader.
- launchApp:
    stopApp: true
    permissions: {}
- openLink: opax://doc-cite/speech-1205524
- extendedWaitUntil:
    visible:
      id: doc-citations
    timeout: 20000
- takeScreenshot: ${EVIDENCE}/32-cite-deep-link
- tapOn: Done
- extendedWaitUntil:
    visible:
      id: doc-reader
    timeout: 20000
- assertVisible:
    id: doc-title
# End on the copied citation so the locked native clipboard audit reads it
# immediately, before unrelated host clipboard changes can replace it. From
# the reader it is two taps: ⋯, then Copy BibTeX.
- tapOn: More for this record
- waitForAnimationToEnd
- tapOn: Copy BibTeX
