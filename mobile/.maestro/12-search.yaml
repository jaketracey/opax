appId: au.com.opax.app
name: 12 Local suggestions, the four scopes and the register lists
---
# scrollUntilVisible always swipes from the centre of the screen. Tap
# targets are centred with speed-20 swipes (about half a screen each), so
# the tap lands clear of the navigation bar and the floating tab bar.
- launchApp:
    clearState: true
- runFlow: support/launch-ready.yaml
- tapOn:
    id: tab-search
- runFlow:
    file: support/search-query.yaml
    env:
      QUERY: Anthony Albanese
      PREFIX: 12
# The keyboard stays up: the Search key below submits. iOS visibility checks
# can see rows behind the keyboard, which is enough to prove they are drawn.
# A full name has one match: the person is the top suggestion and in no
# People group (journey 61 has the group row, for a surname).
- extendedWaitUntil:
    visible:
      id: search-top-suggestion
      text: Anthony Albanese.*
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/12-suggestions
# Typing never searches: the suggestions are drawn on the device.
- assertNotVisible:
    id: search-count
# The keyboard's Search key submits in All; the geometry probe checks the
# keyboard went with it (journeys/search.md 3.4).
- pressKey: Enter
- runFlow: search-submit-reveal.yaml
# The results state replaces the suggestions; at AX5 it starts below the fold.
- scrollUntilVisible:
    element:
      id: search-count
    direction: DOWN
    visibilityPercentage: 1
    speed: 20
    timeout: 30000
- scrollUntilVisible:
    element:
      id: search-result-anthony-albanese
    direction: DOWN
    timeout: 90000
    visibilityPercentage: 80
    centerElement: true
    speed: 20
- takeScreenshot: ${EVIDENCE}/12-all
# People, Bills and Speeches are scopes over the same query; switching is
# answered from the session cache.
- runFlow:
    file: support/search-scope.yaml
    env:
      SCOPE: People
- scrollUntilVisible:
    element:
      id: search-result-anthony-albanese
    direction: DOWN
    timeout: 90000
    visibilityPercentage: 80
    centerElement: true
    speed: 20
- takeScreenshot: ${EVIDENCE}/12-people
- runFlow:
    file: support/search-scope.yaml
    env:
      SCOPE: Bills
- scrollUntilVisible:
    element:
      id: search-results-bills
    direction: DOWN
    visibilityPercentage: 1
    speed: 20
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/12-bills
- runFlow:
    file: support/search-scope.yaml
    env:
      SCOPE: Speeches
- scrollUntilVisible:
    element:
      id: records-result-0
    direction: DOWN
    timeout: 90000
    visibilityPercentage: 10
    centerElement: true
    speed: 20
- takeScreenshot: ${EVIDENCE}/12-speeches
# Design pass 3D: a result's passage is drawn under its row, cut on a word;
# there is no "Read matching record" disclosure under each result.
- assertNotVisible: Read matching record
# The registers are lists, not scopes: "Search in" rows under All push one
# list each, one read per tap.
- runFlow:
    file: support/search-scope.yaml
    env:
      SCOPE: All
- scrollUntilVisible:
    element:
      id: search-in-interests
    direction: DOWN
    timeout: 90000
    centerElement: true
    speed: 20
- tapOn:
    id: search-in-interests
- extendedWaitUntil:
    visible:
      id: results-interests-0
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/12-interests
- runFlow:
    file: support/back.yaml
    env:
      BACK: Search
- scrollUntilVisible:
    element:
      id: search-in-pay
    direction: DOWN
    timeout: 90000
    centerElement: true
    speed: 20
- tapOn:
    id: search-in-pay
- extendedWaitUntil:
    visible:
      id: results-pay-0
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/12-pay
- scrollUntilVisible:
    element:
      id: search-pay-caveat
    direction: DOWN
    timeout: 90000
    centerElement: true
    speed: 20
- takeScreenshot: ${EVIDENCE}/12-pay-source-line
- runFlow:
    file: support/back.yaml
    env:
      BACK: Search
- scrollUntilVisible:
    element:
      id: search-in-expenses
    direction: DOWN
    timeout: 90000
    centerElement: true
    speed: 20
- tapOn:
    id: search-in-expenses
- extendedWaitUntil:
    visible:
      id: results-expenses-0
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/12-expenses
- waitForAnimationToEnd
# An expenses row for a member opens that member's page.
- tapOn:
    id: results-expenses-0
- extendedWaitUntil:
    visible:
      id: person-screen-title
    timeout: 20000
- takeScreenshot: ${EVIDENCE}/12-open-person
