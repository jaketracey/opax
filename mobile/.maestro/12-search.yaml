appId: au.com.opax.app
name: 12 Local suggestions and the four catalog search kinds
---
- launchApp:
    clearState: true
- tapOn:
    id: tab-search
- tapOn:
    id: search-input
- inputText: Anthony Albanese
# Swipe on the content: iOS visibility checks can see rows behind the keyboard.
- swipe:
    start: 90%, 40%
    end: 90%, 20%
- scrollUntilVisible:
    element:
      id: search-suggestion-person-.*
    timeout: 90000
    centerElement: true
- takeScreenshot: ${EVIDENCE}/12-suggestions
- assertVisible:
    id: search-suggestion-person-.*
- scrollUntilVisible:
    element:
      id: search-submit
    timeout: 90000
    direction: UP
- tapOn:
    id: search-submit
- scrollUntilVisible:
    element:
      id: search-result-anthony-albanese
    timeout: 90000
    visibilityPercentage: 1
    centerElement: true
- takeScreenshot: ${EVIDENCE}/12-people
- scrollUntilVisible:
    element:
      id: search-kind-menu
    timeout: 90000
    direction: UP
- tapOn:
    id: search-kind-menu
- takeScreenshot: ${EVIDENCE}/12-kind-menu
- tapOn: Declared interests
- scrollUntilVisible:
    element:
      id: search-submit
    timeout: 90000
- tapOn:
    id: search-submit
- scrollUntilVisible:
    element:
      id: search-result-anthony-albanese
    timeout: 90000
    visibilityPercentage: 1
    centerElement: true
- takeScreenshot: ${EVIDENCE}/12-interests
- scrollUntilVisible:
    element:
      id: search-kind-menu
    timeout: 90000
    direction: UP
- tapOn:
    id: search-kind-menu
- tapOn: Pay
- scrollUntilVisible:
    element:
      id: search-submit
    timeout: 90000
- tapOn:
    id: search-submit
- scrollUntilVisible:
    element:
      id: search-result-anthony-albanese
    timeout: 90000
    visibilityPercentage: 1
    centerElement: true
- takeScreenshot: ${EVIDENCE}/12-pay
- scrollUntilVisible:
    element:
      text: Read matching record
    timeout: 90000
- tapOn: Read matching record
- takeScreenshot: ${EVIDENCE}/12-pay-expanded
- tapOn: Hide matching record
- scrollUntilVisible:
    element:
      id: search-kind-menu
    timeout: 90000
    direction: UP
- tapOn:
    id: search-kind-menu
- tapOn: Expenses
- scrollUntilVisible:
    element:
      id: search-submit
    timeout: 90000
- tapOn:
    id: search-submit
- scrollUntilVisible:
    element:
      id: search-result-anthony-albanese
    timeout: 90000
    visibilityPercentage: 1
    centerElement: true
- takeScreenshot: ${EVIDENCE}/12-expenses
- tapOn:
    id: search-result-anthony-albanese
- extendedWaitUntil:
    visible:
      id: person-screen-title
    timeout: 20000
- takeScreenshot: ${EVIDENCE}/12-open-person
