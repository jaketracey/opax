appId: au.com.opax.app
name: 12 Local suggestions and the four catalog search kinds
---
# scrollUntilVisible always swipes from the centre of the screen. Tap
# targets are centred with speed-20 swipes (about half a screen each), so
# the tap lands clear of the navigation bar and the floating tab bar.
- launchApp:
    clearState: true
- tapOn:
    id: tab-search
- tapOn:
    id: search-input
- inputText: Anthony Albanese
# Swipe on the content: iOS visibility checks can see rows behind the keyboard.
- swipe:
    start: 90%, 40%
    end: 90%, 20%
- scrollUntilVisible:
    element:
      id: search-suggestion-person-.*
    direction: DOWN
    timeout: 90000
    centerElement: true
- takeScreenshot: ${EVIDENCE}/12-suggestions
- assertVisible:
    id: search-suggestion-person-.*
# Retain this journey's keyboard-dismissal step. Keyboard-up single taps
# are checked independently by 12-search-keyboard.yaml.
- hideKeyboard
- scrollUntilVisible:
    element:
      id: search-submit
    timeout: 90000
    direction: UP
    centerElement: true
    speed: 20
- waitForAnimationToEnd
# Native frames exclude targets obscured by navigation or tab bars.
- runFlow: search-submit-reveal.yaml
- tapOn:
    id: search-submit
# The results state replaces the suggestions; at AX5 it starts below the fold.
- scrollUntilVisible:
    element:
      id: search-cache-state
    direction: DOWN
    visibilityPercentage: 1
    speed: 20
    timeout: 30000
- scrollUntilVisible:
    element:
      id: search-result-anthony-albanese
    direction: DOWN
    timeout: 90000
    visibilityPercentage: 80
    centerElement: true
    speed: 20
- takeScreenshot: ${EVIDENCE}/12-people
- scrollUntilVisible:
    element:
      id: search-kind-menu
    timeout: 90000
    direction: UP
    centerElement: true
- tapOn:
    id: search-kind-menu
- takeScreenshot: ${EVIDENCE}/12-kind-menu
- tapOn: Declared interests
- scrollUntilVisible:
    element:
      id: search-submit
    direction: DOWN
    timeout: 90000
- waitForAnimationToEnd
# Native frames exclude targets obscured by navigation or tab bars.
- runFlow: search-submit-reveal.yaml
- tapOn:
    id: search-submit
- scrollUntilVisible:
    element:
      id: search-cache-state
    direction: DOWN
    visibilityPercentage: 1
    speed: 20
    timeout: 30000
- scrollUntilVisible:
    element:
      id: search-result-anthony-albanese
    direction: DOWN
    timeout: 90000
    visibilityPercentage: 80
    centerElement: true
    speed: 20
- takeScreenshot: ${EVIDENCE}/12-interests
- scrollUntilVisible:
    element:
      id: search-kind-menu
    timeout: 90000
    direction: UP
    centerElement: true
- tapOn:
    id: search-kind-menu
- tapOn: Pay
- scrollUntilVisible:
    element:
      id: search-submit
    direction: DOWN
    timeout: 90000
- waitForAnimationToEnd
# Native frames exclude targets obscured by navigation or tab bars.
- runFlow: search-submit-reveal.yaml
- tapOn:
    id: search-submit
- scrollUntilVisible:
    element:
      id: search-cache-state
    direction: DOWN
    visibilityPercentage: 1
    speed: 20
    timeout: 30000
- scrollUntilVisible:
    element:
      id: search-result-anthony-albanese
    direction: DOWN
    timeout: 90000
    visibilityPercentage: 80
    centerElement: true
    speed: 20
- takeScreenshot: ${EVIDENCE}/12-pay
- scrollUntilVisible:
    element:
      text: Read matching record
    direction: DOWN
    timeout: 90000
    centerElement: true
    speed: 20
- waitForAnimationToEnd
- tapOn: Read matching record
- takeScreenshot: ${EVIDENCE}/12-pay-expanded
# Expanding removes the preview above the toggle, moving it up at AX5.
- scrollUntilVisible:
    element:
      text: Hide matching record
    timeout: 90000
    centerElement: true
    direction: UP
- takeScreenshot: ${EVIDENCE}/12-pay-expanded-toggle
- tapOn: Hide matching record
- scrollUntilVisible:
    element:
      id: search-kind-menu
    timeout: 90000
    direction: UP
    centerElement: true
- tapOn:
    id: search-kind-menu
- tapOn: Expenses
- scrollUntilVisible:
    element:
      id: search-submit
    direction: DOWN
    timeout: 90000
- waitForAnimationToEnd
# Native frames exclude targets obscured by navigation or tab bars.
- runFlow: search-submit-reveal.yaml
- tapOn:
    id: search-submit
- scrollUntilVisible:
    element:
      id: search-cache-state
    direction: DOWN
    visibilityPercentage: 1
    speed: 20
    timeout: 30000
- scrollUntilVisible:
    element:
      id: search-result-anthony-albanese-name
    direction: DOWN
    timeout: 90000
    centerElement: true
    speed: 20
# Target the name so the tap stays visible at both default size and AX5.
- takeScreenshot: ${EVIDENCE}/12-expenses
- waitForAnimationToEnd
- tapOn:
    id: search-result-anthony-albanese-name
- extendedWaitUntil:
    visible:
      id: person-screen-title
    timeout: 20000
- takeScreenshot: ${EVIDENCE}/12-open-person
