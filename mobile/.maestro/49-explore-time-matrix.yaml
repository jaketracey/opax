appId: au.com.opax.app
name: 49 Explore from Today, words per dollar, the Time machine and who owns which debate
---
- launchApp:
    clearState: true
    permissions: {}
- runFlow: support/launch-ready.yaml
- assertVisible:
    id: today-screen
# Today's Explore entry opens the hub.
- scrollUntilVisible:
    element:
      id: today-explore-open
    visibilityPercentage: 100
    timeout: 90000
- tapOn:
    id: today-explore-open
- extendedWaitUntil:
    visible:
      id: explore-screen
    timeout: 30000
- scrollUntilVisible:
    element:
      id: explore-wd
    timeout: 30000
- tapOn:
    id: explore-wd
# Words per dollar: one subject, its dated figure, then the parties.
- extendedWaitUntil:
    visible:
      id: explore-wd-screen
    timeout: 30000
- extendedWaitUntil:
    notVisible:
      id: wd-loading
    timeout: 90000
- assertVisible:
    id: wd-subject
- assertVisible:
    id: wd-figure
- assertVisible:
    id: wd-as-at
- takeScreenshot: ${EVIDENCE}/49-words-per-dollar
- openLink: opax://explore/tide
- extendedWaitUntil:
    visible:
      id: explore-tide-screen
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: tide
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/49-tide
- openLink: opax://explore/tm
# The year shows at once: no field and no Open year.
- extendedWaitUntil:
    visible:
      id: tm-year-menu
    timeout: 90000
- assertVisible:
    id: tm-year-menu
    text: 'Year, 2025'
- assertNotVisible:
    text: Open year
- extendedWaitUntil:
    visible:
      id: tm-photo-2025-cooper-polling-place-loaded
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/49-time-machine
- scrollUntilVisible:
    element:
      id: explore-machine-pill
    direction: DOWN
    centerElement: true
    timeout: 90000
    speed: 20
- takeScreenshot: ${EVIDENCE}/49-time-machine-brief
- tapOn:
    id: explore-machine-pill
- assertVisible:
    id: explore-machine-pill-sheet
- takeScreenshot: ${EVIDENCE}/49-machine-note
- tapOn: Done
# The year pager is a step pair at the page's foot (no bottom toolbar: the
# floating tab bar covered it); the neighbour is in its label.
- scrollUntilVisible:
    element:
      id: tm-previous
    direction: DOWN
    centerElement: true
    timeout: 90000
    speed: 20
- tapOn:
    id: tm-previous
- extendedWaitUntil:
    visible:
      id: tm-year-menu
      text: 'Year, 2024'
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/49-time-machine-2024
- openLink: opax://explore/matrix
- scrollUntilVisible:
    element:
      id: matrix-cell-0-1
    direction: DOWN
    centerElement: true
    timeout: 90000
    speed: 20
- takeScreenshot: ${EVIDENCE}/49-matrix
- tapOn:
    id: matrix-cell-0-1
- assertVisible:
    id: topic-screen
- takeScreenshot: ${EVIDENCE}/49-native-topic
