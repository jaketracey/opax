appId: au.com.opax.app
name: 49 Time machine and native debate matrix
---
- launchApp:
    clearState: true
    permissions: {}
- openLink: opax://explore/tm
# The year shows at once: no field and no Open year.
- extendedWaitUntil:
    visible:
      id: tm-year-menu
    timeout: 90000
- assertVisible:
    id: tm-year-menu
    text: 'Year, 2025'
- assertNotVisible:
    id: tm-open
- extendedWaitUntil:
    visible:
      id: tm-photo-2025-cooper-polling-place-loaded
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/49-time-machine
- scrollUntilVisible:
    element:
      id: explore-machine-pill
    direction: DOWN
    centerElement: true
    timeout: 90000
    speed: 20
- takeScreenshot: ${EVIDENCE}/49-time-machine-brief
- tapOn:
    id: explore-machine-pill
- assertVisible:
    id: explore-machine-pill-sheet
- takeScreenshot: ${EVIDENCE}/49-machine-note
- tapOn: Done
# The bottom pager's chevrons carry no visible year; the neighbour is in the label.
- tapOn: 'Previous year, 2024'
- extendedWaitUntil:
    visible:
      id: tm-year-menu
      text: 'Year, 2024'
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/49-time-machine-2024
- openLink: opax://explore/matrix
- scrollUntilVisible:
    element:
      id: matrix-cell-0-1
    direction: DOWN
    centerElement: true
    timeout: 90000
    speed: 20
- takeScreenshot: ${EVIDENCE}/49-matrix
- tapOn:
    id: matrix-cell-0-1
- assertVisible:
    id: topic-screen
- takeScreenshot: ${EVIDENCE}/49-native-topic
