appId: au.com.opax.app
name: 43 Government agencies, an agency's years, suppliers and contracts, and its lead
---
- launchApp
- openLink: opax://public-money
- tapOn:
    text: Open
    optional: true
# Until the top-suppliers index ships (D6) the contracts card opens the
# agency list, titled Government agencies, with no Suppliers segment.
- scrollUntilVisible:
    element:
      id: money-card-contracts
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- tapOn:
    id: money-card-contracts
- scrollUntilVisible:
    element:
      id: agencies-title
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- assertNotVisible:
    id: contracts-view-suppliers
- takeScreenshot: ${EVIDENCE}/43-agencies
# Sort is a pop-up on the caption line.
- scrollUntilVisible:
    element:
      id: agencies-sort
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- tapOn:
    id: agencies-sort
- tapOn: Name
- takeScreenshot: ${EVIDENCE}/43-agencies-a-to-z
# The bar search sits under the large title.
- tapOn: Agencies
- inputText: Digital Transformation Agency
- pressKey: Enter
- scrollUntilVisible:
    element:
      id: agency-row-0
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- tapOn:
    id: agency-row-0
- scrollUntilVisible:
    element:
      id: agency-title
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/43-agency
# Years: calendar years, a chart that is not tappable, and a table toggle.
- scrollUntilVisible:
    element:
      id: agency-chart
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- assertVisible: Contract value by year the contract started.*
- assertNotVisible: '20[0-9][0-9]–[0-9][0-9]'
- takeScreenshot: ${EVIDENCE}/43-years-chart
- tapOn: Table
- scrollUntilVisible:
    element:
      id: agency-table-toggle
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/43-years-table
- tapOn:
    id: agency-table-toggle
- scrollUntilVisible:
    element:
      text: Suppliers
    direction: UP
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- tapOn:
    text: Suppliers
- scrollUntilVisible:
    element:
      id: agency-supplier-0
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/43-suppliers
- scrollUntilVisible:
    element:
      text: Contracts
    direction: UP
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- tapOn:
    text: Contracts
- scrollUntilVisible:
    element:
      id: agency-contract-0
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/43-contracts
# A contract row pushes its money item, with the AusTender original.
- tapOn:
    id: agency-contract-0
- scrollUntilVisible:
    element:
      id: money-item-title
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- scrollUntilVisible:
    element:
      id: money-item-original-0
    direction: DOWN
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- takeScreenshot: ${EVIDENCE}/43-contract-item
- tapOn:
    id: money-item-original-0
- assertVisible: https://www.tenders.gov.au/
- takeScreenshot: ${EVIDENCE}/43-austender
- tapOn: OK
- tapOn: { id: BackButton }
# The agency's own concentration lead, when Leads has one; else Leads'
# government contracts list.
- scrollUntilVisible:
    element:
      id: agency-title
    direction: UP
    visibilityPercentage: 10
    centerElement: true
    speed: 20
    timeout: 300000
- runFlow:
    when:
      visible:
        id: agency-lead
    commands:
      - tapOn:
          id: agency-lead
      - extendedWaitUntil:
          visible:
            id: lead-heading
          timeout: 30000
      - takeScreenshot: ${EVIDENCE}/43-agency-lead
- runFlow:
    when:
      notVisible:
        id: lead-heading
    commands:
      - openLink: opax://discover?category=procurement_concentration
      - tapOn:
          text: Open
          optional: true
      - extendedWaitUntil:
          visible: Government contracts
          timeout: 30000
      - takeScreenshot: ${EVIDENCE}/43-government-contracts-leads
