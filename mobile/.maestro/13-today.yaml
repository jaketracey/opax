appId: au.com.opax.app
name: 13 Today feeds and their dated original sources
---
- launchApp
- assertVisible:
    id: today-screen-message
# The daily edition: the fixture's pinned production response, as posted.
# At AX5 the title alone can outgrow the screen, so match a tenth of it.
- scrollUntilVisible:
    element:
      id: today-edition-head
      text: 'Daily edition, Bill, 4 October 2026: Wage Justice for Early Childhood.*'
    timeout: 90000
    visibilityPercentage: 10
    centerElement: true
- takeScreenshot: ${EVIDENCE}/13-edition
# A bill edition's text is a model's summary: its label comes first.
- scrollUntilVisible:
    element:
      id: today-edition-machine
      text: 'Machine-written\. Written by a model from the explanatory memorandum; not the record\.'
    timeout: 90000
    visibilityPercentage: 10
    centerElement: true
- takeScreenshot: ${EVIDENCE}/13-edition-machine
- scrollUntilVisible:
    element:
      id: today-edition-link
    timeout: 90000
    visibilityPercentage: 10
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: today-edition-link
# E2E shows the guarded web address on the build's reserved origin instead.
- scrollUntilVisible:
    element:
      text: https://opax\.invalid/bill/au-federal-r7529
    timeout: 20000
- takeScreenshot: ${EVIDENCE}/13-edition-link-alert
- tapOn: OK
- scrollUntilVisible:
    element:
      id: today-edition-as-at
    timeout: 90000
    visibilityPercentage: 10
    centerElement: true
- assertVisible: 'As at 4 October 2026 · Source: OPAX daily edition'
- takeScreenshot: ${EVIDENCE}/13-edition-as-at
- scrollUntilVisible:
    element:
      id: today-bill-0
    timeout: 90000
    visibilityPercentage: 1
    centerElement: true
- takeScreenshot: ${EVIDENCE}/13-bills
- scrollUntilVisible:
    element:
      id: today-bills-as-at
    timeout: 90000
- assertVisible: As at .* Source.*ParlInfo.*
- takeScreenshot: ${EVIDENCE}/13-bills-as-at
- scrollUntilVisible:
    element:
      id: today-bill-0
    timeout: 90000
    visibilityPercentage: 1
    centerElement: true
    direction: UP
- tapOn:
    id: today-bill-0
- scrollUntilVisible:
    element:
      id: bill-title
    timeout: 90000
    visibilityPercentage: 1
- takeScreenshot: ${EVIDENCE}/13-open-bill
# On iOS 27 an uncentred source link can sit under the tab bar.
- scrollUntilVisible:
    element:
      id: bill-source-0
    timeout: 90000
    centerElement: true
- waitForAnimationToEnd
- tapOn:
    id: bill-source-0
- assertVisible: https://parlinfo.aph.gov.au/.*
- takeScreenshot: ${EVIDENCE}/13-bill-source-alert
- tapOn: OK
- tapOn: Today
- scrollUntilVisible:
    element:
      id: today-declaration-0
    timeout: 90000
- takeScreenshot: ${EVIDENCE}/13-declaration
- tapOn:
    id: today-declaration-0
- assertVisible: https://www.aph.gov.au/Parliamentary_Business/Committees/Senate/Senators_Interests/Senators_Interests_Register/123072
- takeScreenshot: ${EVIDENCE}/13-declaration-source-alert
- tapOn: OK
# At AX5 this as-at line is about 520pt tall. Centring lands it differently
# on each screen (the 17 Pro shows all of it; a centre stopped by the page end
# clips its date), so a fixed drag after centring can push it off either edge.
# Start from the page end, where every device places it the same way, then
# drag its date back below the navigation bar before requiring full visibility.
- scrollUntilVisible:
    element:
      id: today-screen-footer
    timeout: 90000
    visibilityPercentage: 1
- swipe:
    start: 90%, 70%
    end: 90%, 20%
    duration: 300
- waitForAnimationToEnd
- swipe:
    start: 90%, 30%
    end: 90%, 60%
    duration: 1000
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: today-declarations-as-at
    timeout: 90000
- assertVisible:
    id: today-declarations-as-at
    text: As at .* Source.*
- takeScreenshot: ${EVIDENCE}/13-declarations-as-at
