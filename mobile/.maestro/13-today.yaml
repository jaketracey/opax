appId: au.com.opax.app
name: 13 Today front page, its native records and dated original sources
---
# scrollUntilVisible always swipes from the centre of the screen. Tap
# targets are centred with speed-20 swipes (about half a screen each). From
# iOS 26 the tab bar floats over the bottom of the page, and a link drawn
# under it still counts as visible: on iOS 27 a source tap hit the Your MP
# tab. Each group of steps first checks the page is still shown.
#
# Case A, no seat (today.md 5.2): the fixture edition is pinned fresh and
# saved, so it leads the page and the invitation follows it.
- launchApp:
    permissions: {}
    arguments:
      OPAXEditionAge: fresh
      OPAXEditionCache: present
      OPAXSeat: none
- assertVisible:
    id: today-screen-message
# The daily edition: one whole-card link with its line inside the card.
- scrollUntilVisible:
    element:
      id: today-edition
    timeout: 90000
    visibilityPercentage: 10
    centerElement: true
- takeScreenshot: ${EVIDENCE}/13-edition
# The machine label is part of the card's combined accessible label.
- assertVisible:
    id: today-edition
    text: .*Machine-written.*
- takeScreenshot: ${EVIDENCE}/13-edition-machine
# The card opens the daily edition inside Today.
- waitForAnimationToEnd
- tapOn:
    id: today-edition
- extendedWaitUntil:
    visible:
      id: edition-screen
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/13-edition-open
- tapOn: Today
- assertVisible:
    id: today-screen
# The edition's own line: its date and source, opening the sources sheet.
- scrollUntilVisible:
    element:
      id: today-edition-sources
    direction: DOWN
    timeout: 90000
    centerElement: true
    speed: 20
- waitForAnimationToEnd
- assertVisible:
    id: today-edition-sources
    text: Updated \d{1,2} \w{3} \d{4}.*
- takeScreenshot: ${EVIDENCE}/13-sources
- tapOn:
    id: today-edition-sources
- extendedWaitUntil:
    visible: Sources
    timeout: 30000
- takeScreenshot: ${EVIDENCE}/13-sources-sheet
- tapOn: Done
- assertVisible:
    id: today-screen
- scrollUntilVisible:
    element:
      id: today-bill-0
    direction: DOWN
    timeout: 90000
    visibilityPercentage: 1
    centerElement: true
# The first ready rows can still be crossfading from their skeleton.
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/13-bills
- scrollUntilVisible:
    element:
      id: today-bill-0
    timeout: 90000
    visibilityPercentage: 1
    centerElement: true
    speed: 20
    direction: UP
- waitForAnimationToEnd
- tapOn:
    id: today-bill-0
- scrollUntilVisible:
    element:
      id: bill-title
    direction: DOWN
    timeout: 90000
    visibilityPercentage: 1
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/13-open-bill
# On iOS 27 an uncentred source link can sit under the tab bar.
- assertVisible:
    id: bill-screen
- scrollUntilVisible:
    element:
      id: bill-source
    direction: DOWN
    timeout: 90000
    centerElement: true
    speed: 20
- waitForAnimationToEnd
- assertVisible:
    id: bill-screen
- tapOn:
    id: bill-source
# The bill's one source line opens its originals; in e2e builds an
# original opens the local preview of its address ("Original", Done).
- extendedWaitUntil:
    visible:
      id: bill-source-sheet-original-0
    timeout: 15000
- tapOn:
    id: bill-source-sheet-original-0
- extendedWaitUntil:
    visible:
      id: source-destination-url
      text: https://parlinfo\.aph\.gov\.au/.*
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/13-bill-source-original
- tapOn: Done
# Original is presented over Sources. Close both before returning to Today.
- extendedWaitUntil:
    visible:
      id: bill-source-sheet-original-0
    timeout: 15000
- tapOn: Done
- extendedWaitUntil:
    notVisible:
      id: bill-source-sheet-original-0
    timeout: 15000
# A long bill title leaves the back button a bare chevron, and the minimised
# tab bar shows no "Today" text, so go back by the button's id.
- tapOn:
    id: BackButton
- assertVisible:
    id: today-screen
- scrollUntilVisible:
    element:
      id: today-declaration-0
    direction: DOWN
    timeout: 90000
    centerElement: true
    speed: 20
- waitForAnimationToEnd
- takeScreenshot: ${EVIDENCE}/13-declaration
- assertVisible:
    id: today-screen
# The register page is "Open the register" in the entry's context menu.
- longPressOn:
    id: today-declaration-0
- tapOn: Open the register
- extendedWaitUntil:
    visible:
      id: source-destination-url
      text: https://www\.aph\.gov\.au/.*
    timeout: 15000
- takeScreenshot: ${EVIDENCE}/13-declaration-source-original
# The local destination view scrolls a long URL at AX5. Capture its end too.
- repeat:
    times: 8
    commands:
      - swipe:
          start: 50%, 65%
          end: 50%, 35%
          duration: 1000
- takeScreenshot: ${EVIDENCE}/13-declaration-source-original-end
- tapOn: Done
- assertVisible:
    id: today-screen
# The foot: the independence line and Report a correction (design review D4).
- scrollUntilVisible:
    element:
      id: today-screen-footer
    direction: DOWN
    timeout: 300000
    visibilityPercentage: 1
- scrollUntilVisible:
    element:
      id: today-independence
    direction: DOWN
    timeout: 300000
    visibilityPercentage: 10
    centerElement: true
- assertVisible: OPAX is independent and non-partisan\..*
- takeScreenshot: ${EVIDENCE}/13-foot
