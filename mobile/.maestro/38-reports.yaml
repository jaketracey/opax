appId: au.com.opax.app
name: 38 Reports, report, Money, section deep link and cited record
---
- launchApp:
    clearState: true
- scrollUntilVisible:
    element:
      id: today-reports
    direction: DOWN
    timeout: 300000
    centerElement: true
- tapOn:
    id: today-reports
- assertVisible:
    id: reports-screen
- takeScreenshot: ${EVIDENCE}/38-reports-index
# Today's tile opens the reports; Spotlight left Today in design pass 3A.
- scrollUntilVisible:
    element:
      id: report-open-gambling
    direction: DOWN
    timeout: 300000
    centerElement: true
- tapOn:
    id: report-open-gambling
- assertVisible:
    id: report-title
- takeScreenshot: ${EVIDENCE}/38-report
- scrollUntilVisible:
    element:
      id: report-tab-money
    direction: DOWN
    timeout: 300000
    centerElement: true
- tapOn:
    id: report-tab-money
- scrollUntilVisible:
    element:
      text: Follow the money
    direction: DOWN
    timeout: 300000
    centerElement: true
- takeScreenshot: ${EVIDENCE}/38-money
- scrollUntilVisible:
    element:
      text: Words per dollar
    direction: DOWN
    timeout: 300000
    centerElement: true
- takeScreenshot: ${EVIDENCE}/38-words-per-dollar
- scrollUntilVisible:
    element:
      id: report-open-section-1
    direction: DOWN
    timeout: 300000
    visibilityPercentage: 10
    centerElement: true
- tapOn:
    id: report-open-section-1
- scrollUntilVisible:
    element:
      id: report-section-1
    direction: DOWN
    timeout: 90000
    visibilityPercentage: 2
- takeScreenshot: ${EVIDENCE}/38-section
- scrollUntilVisible:
    element:
      id: report-answer-1-citation-1
    direction: DOWN
    timeout: 300000
    centerElement: true
- tapOn:
    id: report-answer-1-citation-1
# The records lane now owns the native reader. Its local fixture contains
# only the pinned citation excerpt and says so on screen.
- assertVisible:
    id: doc-title
- takeScreenshot: ${EVIDENCE}/38-cited-record
- tapOn:
    text: Gambling
    index: 0
- scrollUntilVisible:
    element:
      id: report-section-share-1
    direction: DOWN
    timeout: 300000
    centerElement: true
- tapOn:
    id: report-section-share-1
- assertVisible: https://opax.invalid/reports/gambling/s/1
- takeScreenshot: ${EVIDENCE}/38-section-share
- tapOn: OK
