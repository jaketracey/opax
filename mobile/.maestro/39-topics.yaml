appId: au.com.opax.app
name: 39 Topics, a topic page, coverage and Methods
---
- launchApp:
    clearState: true
- openLink: opax://topics
- assertVisible:
    id: topics-screen
- assertVisible:
    id: topics-order
- takeScreenshot: ${EVIDENCE}/39-topics
# A tap target: centred at speed 20 (about half a screen per swipe), the
# whole row in view. At the default speed the centring swipe left the row
# under the navigation bar once pass 5 split the list (integration-p5 gate).
- scrollUntilVisible:
    element:
      id: topic-open-gambling
    direction: DOWN
    timeout: 300000
    visibilityPercentage: 100
    centerElement: true
    speed: 20
- takeScreenshot: ${EVIDENCE}/39-topic-row
- tapOn:
    id: topic-open-gambling
- assertVisible:
    id: topic-screen
- extendedWaitUntil:
    visible:
      id: topic-count
    timeout: 60000
- takeScreenshot: ${EVIDENCE}/39-topic
- scrollUntilVisible:
    element:
      id: topic-tide
    direction: DOWN
    timeout: 300000
    visibilityPercentage: 10
    centerElement: true
- takeScreenshot: ${EVIDENCE}/39-over-time
- scrollUntilVisible:
    element:
      id: topic-who
    direction: DOWN
    timeout: 300000
    visibilityPercentage: 10
    centerElement: true
- takeScreenshot: ${EVIDENCE}/39-who-speaks
# A Who speaks row filters Speeches in place: no screen is pushed, the
# filters line appears, and Clear removes it.
- scrollUntilVisible:
    element:
      id: topic-state-row-federal
    direction: DOWN
    timeout: 300000
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: topic-state-row-federal
- assertVisible:
    id: topic-screen
- scrollUntilVisible:
    element:
      id: topic-filters-line
    direction: DOWN
    timeout: 300000
    visibilityPercentage: 100
    centerElement: true
- takeScreenshot: ${EVIDENCE}/39-filtered
- tapOn:
    id: topic-filters-clear
- assertNotVisible:
    id: topic-filters-line
- scrollUntilVisible:
    element:
      id: topic-money-section
    direction: UP
    timeout: 300000
    visibilityPercentage: 10
    centerElement: true
- takeScreenshot: ${EVIDENCE}/39-money
- scrollUntilVisible:
    element:
      id: topic-speeches
    direction: DOWN
    timeout: 300000
    visibilityPercentage: 10
    centerElement: true
- takeScreenshot: ${EVIDENCE}/39-speeches
- scrollUntilVisible:
    element:
      id: topic-speeches-more
    direction: DOWN
    timeout: 300000
    visibilityPercentage: 100
    centerElement: true
- takeScreenshot: ${EVIDENCE}/39-all-speeches
# Use the native header to leave the long speech list.
- tapOn:
    text: Topics
    index: 0
- scrollUntilVisible:
    element:
      id: topics-stats
    direction: DOWN
    timeout: 300000
    centerElement: true
- tapOn:
    id: topics-stats
- assertVisible:
    id: stats-screen
- takeScreenshot: ${EVIDENCE}/39-stats
- scrollUntilVisible:
    element:
      id: stats-methods
    direction: DOWN
    timeout: 300000
    centerElement: true
- tapOn:
    id: stats-methods
- assertVisible:
    id: methods-screen
- takeScreenshot: ${EVIDENCE}/39-methods
- scrollUntilVisible:
    element:
      id: methods-8
    direction: DOWN
    timeout: 300000
    visibilityPercentage: 10
    centerElement: true
- takeScreenshot: ${EVIDENCE}/39-how-to-cite
