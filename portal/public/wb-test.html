<!doctype html>
<!-- Throwaway harness for the loading animals. Not linked from anywhere; delete freely. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>wombat test</title>
  <link rel="stylesheet" href="/tokens.css">
  <link rel="stylesheet" href="/style.css">
  <style>
    body { max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
    h2 { margin-top: 2.5rem; }
    .rigs { display: flex; flex-wrap: wrap; gap: 0 1rem; }
    .zoom { zoom: 2.8; }
    .zoom .wb-wrap { margin: 0; }
    .zoom .wb-stage { width: 110px; mask-image: none; }
    .zoom .wb-label { display: none; }
  </style>
</head>
<body>
  <h1>wombat test</h1>

  <h2>live (as on the Ask page)</h2>
  <div id="live" role="status"></div>

  <h2>frozen mid-stride, 2.8x</h2>
  <div class="rigs" id="walk"></div>

  <h2>frozen in the pause beat, 2.8x</h2>
  <div class="rigs" id="beat"></div>

  <script type="module">
    import { mountWombat } from '/wombat.js'
    const w = mountWombat(document.getElementById('live'))
    let s = 0
    setInterval(() => {
      s++
      if (s >= 10) w.setLabel(`Checking the record — ${s}s. This can take up to a minute.`)
    }, 1000)
    // Each rig parks its walker and holds every other part at one moment of the loop.
    const rig = (row, animal, seconds) => {
      const box = document.createElement('div')
      box.className = 'zoom'
      document.getElementById(row).appendChild(box)
      mountWombat(box, { label: '', animal })
      requestAnimationFrame(() => {
        for (const a of box.getAnimations({ subtree: true })) {
          if (a.effect.target.classList.contains('wb-trundle')) { a.cancel(); continue }
          a.pause()
          a.currentTime = seconds * 1000
        }
        Object.assign(box.querySelector('.wb-trundle').style, { animation: 'none', left: '22px' })
      })
    }
    for (const animal of ['emu', 'wombat', 'echidna', 'platypus']) {
      rig('walk', animal, 3.2)
      rig('beat', animal, 9.8)
    }
    window.wombat = w
  </script>
</body>
</html>
