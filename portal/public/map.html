  <title>OPAX Money Map</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; background: #faf9f6; color: #33322e;
      font: 14px/1.5 system-ui, -apple-system, 'Segoe UI', sans-serif;
    }
    header {
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      position: relative; padding: 12px 74px 12px 18px; border-bottom: 1px solid #e4e1d8;
    }
    .logo { display: inline-flex; flex: none; }
    .logo-mark { width: 48px; height: 44px; }
    .logo-land { fill: #a98048; }
    .logo-star { fill: #33322e; }
    header p { flex: 1 1 320px; }
    header h1 { margin: 0; font-size: 17px; }
    header p { margin: 0; font-size: 12.5px; color: #8a8578; }
    .map-close {
      position: absolute; top: 12px; right: 18px; display: inline-flex;
      align-items: center; justify-content: center; width: 44px; height: 44px;
      color: #33322e; border-radius: 50%;
    }
    .map-close:hover { background: #eae6de; }
    .map-close:focus-visible { outline: 2px solid #876738; outline-offset: 2px; }
    #map { flex: 1; min-height: 0; }
    #status {
      display: flex; align-items: center; justify-content: center;
      height: 100%; color: #8a8578;
    }
  </style>
</head>

    <h1>Money Map</h1>
    <p>
      Who funds Australian politics: the top 250 donors and the parties they gave to,
      from AEC returns 1998&ndash;2026. Colour and territory are the donor's industry;
      size is lifetime dollars. Click the legend to isolate an industry.
    </p>
