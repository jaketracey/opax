[project]
name = "opax"
version = "1.0.0"
description = "OPAX data pipeline and knowledge-box tooling (Open Parliamentary Accountability eXchange)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
dependencies = [
    # Fetching and parsing the record
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "pdfminer.six>=20221105",
    "pdfplumber>=0.11.0",
    "pypdfium2>=4.30.0",
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    "openpyxl>=3.1.5",
    "playwright>=1.58.0",
    # Tabular sources
    "pandas>=2.3.3",
    "pyarrow>=21.0.0",
    "datasets>=4.8.4",
    # Classification helpers (donations, interests)
    "anthropic>=0.86.0",
]

[project.optional-dependencies]
# parli.db can read a PostgreSQL copy of the corpus when DATABASE_URL is set.
postgres = ["psycopg[binary,pool]>=3.2"]
