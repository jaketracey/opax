# Deploy the portal Worker to production.
#
# Starts when:
#   * a push to main changes portal/public/corpus.json. Only the nightly refresh does that
#     (scripts/vm/nightly.sh stamps refresh.checked_at every night, so every nightly commit
#     carries it), so the nightly's push is what deploys its data; or
#   * someone runs it by hand (Actions > Deploy > Run workflow, or `gh workflow run deploy.yml`).
# It is deliberately NOT triggered by other pushes, so a human's own `npm run deploy` from a
# laptop works exactly as before, and never by pull_request: this repository is public and the
# job holds the Cloudflare deploy token. A human commit that touches corpus.json (a manual
# refresh) does deploy; that is wanted.
#
# The restamp commit this job pushes back does not touch corpus.json and carries [skip ci], so
# it cannot start another run.
#
# Secrets (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN    Workers Scripts / Routes / KV / R2 / Tail / Observability write,
#                           D1 Edit (the table reload after the deploy), Account Settings read
#   CLOUDFLARE_ACCOUNT_ID   459714503d7cbe9d0b7875e62526628b
#
# Runs the shared cached and parallel `build:release` pipeline before Test,
# then `deploy:built` uploads those built assets with Wrangler.
# Stamps that change after the deploy are committed back to main, and D1 opax-tables is
# reloaded when the table data changed (see the "Reload D1 tables" step).
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - portal/public/corpus.json
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip the test suite (emergency only: a data refresh is blocked by a red test)"
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  actions: read    # verify active deployment receipts
  deployments: write # record the exact main SHA sent to production
  contents: write   # push the restamped assets back to main
  issues: write     # open an issue if the deploy fails

jobs:
  deploy:
    name: Build, test, deploy
    # belt and braces: the bot's own restamp push must never start another run
    if: ${{ github.event_name != 'push' || github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    # build + test + deploy ~25 min; a full D1 table reload adds up to ~40 more
    timeout-minutes: 120
    defaults:
      run:
        working-directory: portal
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Skip an already deployed or deploying main checkout
        id: duplicate
        uses: actions/github-script@v7
        with:
          script: |
            const duplicate = require('./scripts/deploy-duplicate.cjs');
            await duplicate({github, context, core, exec});

      - name: Set up Node 24
        if: steps.duplicate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install
        if: steps.duplicate.outputs.skip != 'true'
        run: npm ci

      - name: Set up uv
        if: steps.duplicate.outputs.skip != 'true'
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install locked Python dependencies
        if: steps.duplicate.outputs.skip != 'true'
        working-directory: .
        run: |
          uv sync --frozen --python "$(cat .python-version)"
          # Node tests spawn bare python3; later steps must use this project venv.
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # Detached, checksummed outputs are restored at their original build
      # positions, never directly over public/. No fallback to stale keys.
      - name: Restore passage name build cache
        uses: actions/cache@v4
        with:
          path: .cache/release-build/passage-names
          key: ${{ runner.os }}-node24-passage-v1-${{ hashFiles('scripts/build_passage_names.mjs', 'scripts/cached_release_build.mjs', 'portal/public/parliamentarians.json', 'portal/package-lock.json') }}

      - name: Restore crawl build cache
        uses: actions/cache@v4
        with:
          path: .cache/release-build/crawl
          key: ${{ runner.os }}-node24-crawl-v1-${{ hashFiles('scripts/**/*.mjs', 'scripts/**/*.json', 'portal/src/**', 'portal/public/**/*.json', 'portal/public/**/*.js', 'portal/package-lock.json') }}

      # Prepare all release assets before tests and deployment.
      # Metadata only here; the table reload step after the deploy builds the SQL itself
      # (load_tables.mjs --sql) from the same public/ inputs.
      - name: Build all release assets
        if: steps.duplicate.outputs.skip != 'true'
        run: npm run build:release
        env:
          OPAX_TABLE_METADATA_ONLY: '1'
          OPAX_RELEASE_CACHE_DIR: ../.cache/release-build

      - name: Test
        if: ${{ steps.duplicate.outputs.skip != 'true' && !inputs.skip_tests }}
        run: npm test

      - name: Types
        if: steps.duplicate.outputs.skip != 'true'
        run: npx wrangler types && npx tsc --noEmit

      - name: Record the checkout being deployed
        id: receipt
        if: steps.duplicate.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            try {
              const {data} = await github.rest.repos.createDeployment({...repo,
                ref: '${{ steps.duplicate.outputs.sha }}', environment: 'production',
                auto_merge: false, required_contexts: [],
                payload: {workflow: 'deploy.yml', run_id: context.runId}});
              core.setOutput('id', data.id);
              await github.rest.repos.createDeploymentStatus({...repo, deployment_id: data.id,
                state: 'in_progress', log_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`});
            } catch (error) { core.warning(`Could not record deployment: ${error.message}`); }

      - name: Deploy
        id: production
        if: steps.duplicate.outputs.skip != 'true'
        # Assets were built before Test, including when skip_tests is set.
        run: npm run deploy:built
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # /api/table reads D1 opax-tables, which the Worker deploy does not touch. Reload it when the
      # table SQL built from this checkout differs from the version row in D1 (scripts/reload_tables.mjs:
      # skip when equal, else preflight, drift check, ordered apply with retries, then smoke all 10
      # datasets). Never on pull requests. Re-running is safe: a failed reload marks the deployment
      # receipt failed, so the duplicate guard lets a re-run deploy and reload again.
      # Opt-in: repository variable OPAX_TABLE_RELOAD=on (needs D1 Edit on CLOUDFLARE_API_TOKEN). Unset or anything else = skip.
      - name: Reload D1 tables if the table data changed
        id: tables
        if: ${{ steps.duplicate.outputs.skip != 'true' && steps.production.outcome == 'success' && github.event_name != 'pull_request' && vars.OPAX_TABLE_RELOAD == 'on' }}
        timeout-minutes: 60
        run: |
          if ! node ../scripts/load_tables.mjs --sql; then
            echo "::error::D1 reload failed: the table SQL did not build"
            printf '### D1 reload failed\n- the table SQL did not build; D1 was not touched\n' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node ../scripts/reload_tables.mjs --remote --base https://opax.com.au
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Record production deployment outcome
        if: ${{ always() && steps.receipt.outputs.id != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const deployed = '${{ steps.production.outcome }}' === 'success', tables = '${{ steps.tables.outcome }}';
              await github.rest.repos.createDeploymentStatus({owner: context.repo.owner, repo: context.repo.repo,
                deployment_id: Number('${{ steps.receipt.outputs.id }}'),
                state: deployed && tables !== 'failure' && tables !== 'cancelled' ? 'success' : 'failure',
                description: deployed && (tables === 'failure' || tables === 'cancelled') ? 'Worker deployed; D1 table reload failed' : undefined});
            } catch (error) { core.warning(`Could not record deployment outcome: ${error.message}`); }

      - name: Commit restamped assets back to main
        # also after a failed table reload: the Worker carrying these stamps is live
        if: ${{ !cancelled() && steps.production.outcome == 'success' && steps.duplicate.outputs.skip != 'true' }}
        working-directory: .
        run: |
          set -euo pipefail
          # The build rewrites this file's line endings; it is never a real change.
          git checkout -- portal/public/grants-map-LICENSE.txt 2>/dev/null || true
          # Content-hash stamps in the entry pages, and the analytics bundles. NOT voice.js or
          # chunks/: esbuild bakes the absolute checkout path into their hashes, so a CI build
          # never matches what was committed and committing it would only add churn.
          stamped=$(git diff --name-only | grep -E '^portal/public/([^/]+\.html|analytics\.js|events\.js|ga\.js|gtm\.js)$' || true)
          other=$(git diff --name-only | grep -vxF -f <(printf '%s\n' "$stamped") || true)
          if [ -n "$other" ]; then
            echo "::notice::tracked files changed by the build and not committed: $(echo "$other" | tr '\n' ' ')"
          fi
          if [ -z "$stamped" ]; then
            echo "Stamps unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "$stamped" | xargs git add --
          git commit -m "Restamp assets after deploy [skip ci]"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push rejected (attempt $attempt); rebasing onto origin/main"
            if ! git pull --rebase --autostash origin main; then
              echo "::warning::restamp rebase failed (attempt $attempt); production is already deployed"
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((attempt * 5))
          done
          echo "::warning::could not push the restamp commit; production is already deployed"
          exit 0

      - name: Summary
        if: ${{ success() && steps.duplicate.outputs.skip != 'true' }}
        working-directory: .
        run: |
          {
            echo "### Deployed"
            echo "- deployed checkout: \`${{ steps.duplicate.outputs.sha }}\`"
            echo "- corpus version: \`$(python3 -c 'import json; print(json.load(open("portal/public/corpus.json"))["version"])')\`"
            echo "- CACHE_EPOCH: \`$(grep -m1 -o '"CACHE_EPOCH": "[^"]*"' portal/wrangler.jsonc)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open an issue if the deploy failed
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Deploy failed $(date -u +%F)"
          url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number,title \
                       --jq "[.[] | select(.title == \"$title\")][0].number // empty") || existing=""
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $url"
          else
            gh issue create --title "$title" \
              --body "The production deploy workflow failed: $url. Data on main is unaffected; fix and re-run the workflow. Runbook: docs/operations/nightly-refresh.md"
          fi
