name: Gates

on:
  pull_request:
    branches: [main, ios/apple-design]
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      senate_only:
        description: Run only the Senate ingest and nightly regression gate
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  TZ: Australia/Melbourne
  LANG: C.UTF-8
  WRANGLER_SEND_METRICS: 'false'

jobs:
  mobile-static:
    if: ${{ !inputs.senate_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # main has no mobile tree yet. A partial mobile tree must fail installation.
      - name: Identify mobile sources
        id: mobile
        run: |
          if [ -d mobile ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No mobile tree in this commit; mobile checks do not apply.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.mobile.outputs.present == 'true'
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        if: steps.mobile.outputs.present == 'true'
        working-directory: mobile
        run: npm ci
      - name: Typecheck, lint and static QA
        if: steps.mobile.outputs.present == 'true'
        working-directory: mobile
        run: npx tsc --noEmit && npm run -s lint && npm run -s qa-static

  mobile-jest:
    if: ${{ !inputs.senate_only }}
    name: mobile-jest (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify mobile sources
        id: mobile
        run: |
          if [ -d mobile ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No mobile tree in this commit; mobile checks do not apply.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.mobile.outputs.present == 'true'
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        if: steps.mobile.outputs.present == 'true'
        working-directory: mobile
        run: npm ci
      # Call Jest directly: the package script puts --maxWorkers=2 first.
      - name: Run Jest shard
        if: steps.mobile.outputs.present == 'true'
        working-directory: mobile
        run: npx jest --silent --shard=${{ matrix.shard }}/6 --maxWorkers=4

  # Every app build still in use decodes the published files the app reads (scripts/ci/app-data-guard.sh,
  # running mobile/tests/published-data.test.ts from the app line). Published data must decode under the
  # strictest decoders still on readers' phones, not only the newest: a data change that any of these builds
  # would refuse, or lose a row from, fails here and names the build, the file and the path inside it.
  # main has no mobile tree, so the app tree is exported from APP_REF beside this checkout, with each pinned
  # build's mobile/src beside it, and the guard is pointed at this commit's portal/public once per build.
  # It runs only when a pull request into main changes a file family the app reads, this job or its script
  # (the paths in the first step); nightly commits pushed straight to main do not pass through here.
  app-data:
    if: ${{ !inputs.senate_only && github.event_name == 'pull_request' && github.base_ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The newest app line: the one TestFlight builds are cut from (builds 78 onwards). Its tree supplies the
      # guard, the Jest config and the one install. ios/apple-design is older and lacks newer readers
      # (people/firsts.json), so data those readers decode would go unchecked against it.
      APP_REF: ad/b78-int
      # Builds still on readers' phones, checked with their own decoders: "label|tag|commit", one a line.
      # The tag keeps the commit in the repository; the job fails if the tag is missing or has moved.
      # Add a build when it ships; remove one only when that build is no longer in use.
      #   1.1.4 (73): in App Review. Retire when 1.1.4 is no longer in use.
      #   1.1.3 (57): the store build live now. Retire when 1.1.3 is no longer in use.
      PINNED_BUILDS: |
        1.1.4 (73)|ios-1.1.4-b73|ade1bb3fb6e4d49db7ff6657df3f3f4c4f945b2d
        1.1.3 (57)|ios-1.1.3-b57|eb6fd2dce90364763fb59911205b8910f952fa20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify changed app data
        id: data
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- \
            portal/public/bills portal/public/parliamentarians.json portal/public/votes.json \
            portal/public/electorates portal/public/interests portal/public/pay.json \
            portal/public/expenses.json portal/public/expense-categories.json portal/public/photos \
            portal/public/corpus.json portal/public/discovery.json portal/public/graph \
            portal/public/parliament portal/public/divisions portal/public/people \
            portal/src/app-vic-election.ts portal/src/vic-election-parties.ts \
            scripts/ci/app-endpoint-guard scripts/ci/app-endpoint-fixtures.mjs \
            scripts/ci/app-data-guard.sh .github/workflows/gates.yml | head -1)
          if [ -n "$changed" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No app-read data file changed; the app data guard does not apply.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Export the app tree and the pinned builds
        id: app
        if: steps.data.outputs.changed == 'true'
        # A failed export (a bad pin, a failed fetch, a missing app line) fails the job. Only the guard
        # test not being on APP_REF, which the script reports as present=false, is a warning.
        run: |
          git fetch --quiet --tags origin
          out=$(bash scripts/ci/app-data-guard.sh export "$RUNNER_TEMP") || {
            echo "::error title=App data guard::The app builds could not be exported; nothing was checked."
            exit 1
          }
          case "$out" in
            present=true)
              echo 'present=true' >> "$GITHUB_OUTPUT"
              ;;
            present=false)
              echo "::warning title=App data guard::The data guard is not on $APP_REF; this change to app-read data was not checked."
              echo "The data guard is not on $APP_REF yet; nothing was checked." >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              echo "::error title=App data guard::The export said neither present=true nor present=false: $out"
              exit 1
              ;;
          esac
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 24.21.0
      - name: Install the app's dependencies
        if: steps.app.outputs.present == 'true'
        working-directory: ${{ runner.temp }}/app/mobile
        run: npm ci
      # Through npm test inside the script, so the app's Jest flags (--no-sparkplug) apply to the in-band file.
      - name: Decode every published file with each build's decoders
        if: steps.app.outputs.present == 'true'
        run: bash scripts/ci/app-data-guard.sh run "$RUNNER_TEMP" portal/public

  # Stored Ask research payloads replayed through the current answer pipeline: no model, network,
  # secrets or release build. Fails on an empty, limitation-only or uncited answer, or a changed API shape.
  ask-replay:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Identify the replay set
        id: replay
        run: |
          if [ -f test/ask-replay.test.mjs ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No Ask replay set in this commit; the replay does not apply.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.replay.outputs.present == 'true'
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install
        if: steps.replay.outputs.present == 'true'
        run: npm ci
      - name: Replay stored Ask payloads
        if: steps.replay.outputs.present == 'true'
        run: node --test --test-reporter=spec test/ask-replay.test.mjs

  # The data tooling suites (scripts/test_*.py, scripts/vm/test_*.py): roster identity, exports, nightly
  # helpers. The roster replay (test_roster_export_wrappers.py) runs the real weekly export in a git sandbox
  # and needs the sqlite3 CLI; without it the suite skips, so install it rather than pass silently.
  # Left out until fixed (they fail on main with the locked Python):
  #   scripts/vm/test_fixture_imports.py: export_bills.py imports 'corrections', which the fixture does not copy.
  #   scripts/vm/test_build_evidence_bundle.py: ATTACH of a file: URI fails ("unable to open database")
  #     under the uv-managed interpreter; it passes only with a system Python's sqlite3.
  scripts-python:
    if: ${{ !inputs.senate_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install locked Python dependencies
        run: uv sync --frozen --python "$(cat .python-version)"
      - name: Ensure the sqlite3 CLI
        run: command -v sqlite3 || { sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3; }
      - name: Test data scripts
        run: |
          git config --global user.name ci
          git config --global user.email ci@example.invalid
          # pytest's --ignore does not drop a file named on the command line, so filter the list here.
          mapfile -t suites < <(ls scripts/test_*.py scripts/vm/test_*.py \
            | grep -v -x -e scripts/vm/test_fixture_imports.py -e scripts/vm/test_build_evidence_bundle.py)
          uv run --frozen --with pytest pytest -q -p no:cacheprovider -rs "${suites[@]}"
      - name: Test bounded NSW repair and shared growth guard
        run: |
          uv run --frozen --with pytest pytest -q tests/test_nsw_backfill.py tests/test_nsw_hansard_resume.py tests/test_nsw_publication.py tests/test_backfill_guard.py
          bash -n scripts/vm/nightly.sh scripts/vm/nsw_hansard_backfill.sh
          uv run --frozen bash scripts/vm/test_nsw_hansard_backfill.sh
      - name: Test that a documents-only royal commission holds no extract
        run: uv run --frozen --with pytest pytest -q tests/test_rc_no_extracts.py tests/test_royal_commissions.py

  senate-refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
      - name: Install locked Python dependencies
        run: uv sync --frozen --python "$(cat .python-version)"
      - name: Ensure the sqlite3 CLI
        run: command -v sqlite3 || { sudo apt-get update -qq && sudo apt-get install -y -qq sqlite3; }
      - name: Test Senate ingest and publication holds
        run: >-
          nice -n 10 uv run --frozen --with pytest pytest -q
          tests/test_senate_backfill.py tests/test_backfill_guard.py tests/test_federal_backfill.py
          tests/test_openaustralia_xml.py tests/test_vote_parties.py
          scripts/test_roster_identity.py scripts/test_refresh_watchdog.py
          scripts/test_update_corpus_manifest.py parli/tests/test_speech_hygiene.py
          parli/tests/test_speech_repair.py
      - name: Test federal source transport
        run: nice -n 10 uv run --frozen --with pytest pytest tests/test_source_http.py -q -k 'federal or robots or urllib'
      - name: Test nightly warning and periodic completion paths
        run: PATH="$PWD/.venv/bin:$PATH" nice -n 10 bash scripts/vm/test_nightly.sh

  portal:
    if: ${{ !inputs.senate_only }}
    name: portal (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Install
        run: npm ci
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install locked Python dependencies
        working-directory: .
        run: |
          uv sync --frozen --python "$(cat .python-version)"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
      - name: Generate Worker types
        run: npx wrangler types
      - name: Build release assets
        run: |
          if node -e 'process.exit(Object.hasOwn(JSON.parse(require("fs").readFileSync("package.json", "utf8")).scripts, "build:release") ? 0 : 1)'; then
            npm run build:release
          else
            # ios/apple-design predates build:release. Run its complete
            # pre-deploy build sequence, without invoking the deploy script.
            echo '::notice::Building the legacy portal release sequence'
            npm run build:search
            npm run build:social
            npm run build:grants-map
            npm run build:analytics
            npm run build:voice
            node ../scripts/stamp_assets.mjs
          fi
        env:
          OPAX_TABLE_METADATA_ONLY: '1'
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Test portal
        # Equivalent to npm test, with Node's shard option before the file list.
        run: nice -n 10 node --test --test-concurrency=4 --test-shard=${{ matrix.shard }}/4 test/*.test.mjs
      - name: Test portal Python loaders
        if: matrix.shard == 1
        working-directory: .
        run: |
          if compgen -G 'portal/test/*_test.py' > /dev/null; then
            python3 -m unittest discover -s portal/test -p '*_test.py'
          else
            echo 'No portal Python loader tests in this commit.' >> "$GITHUB_STEP_SUMMARY"
          fi
          # Profiles read this generated file; stale data must fail the PR.
          python3 scripts/export_roster_list_parties.py --check
